<template>
    <template lwc:if={showLawnCareShell}>
        <section class="workspace">
            <section class="panel hero">
                <div class="hero-copy">
                    <div class="eyebrow">Outdoor Living · {lobLabel} Opportunity</div>
                    <h1>{opp.Name}</h1>
                    <template lwc:if={heroSubtitle}>
                        <div class="subtitle">{heroSubtitle}</div>
                    </template>
                    <div class="hero-meta">
                        <span class="chip chip-type">{lobLabel}</span>
                        <span class="chip">{opp.StageName}</span>
                    </div>
                </div>
                <div class="hero-actions">
                    <button type="button" class="cta cta-secondary" onclick={handleEmailHomeowner} disabled={disableEmail}>Email</button>
                    <button type="button" class="cta cta-secondary" onclick={handleCallHomeowner} disabled={disableCall}>Call</button>
                    <button type="button" class="cta cta-secondary" onclick={logCall}>Log Call</button>
                    <button type="button" class="cta cta-secondary" onclick={createTask}>New Task</button>
                    <button type="button" class="cta cta-secondary" onclick={scheduleEvent}>Schedule Event</button>
                    <button type="button" class="cta cta-secondary" onclick={handleNewNote}>Add Note</button>
                    <button type="button" class="cta cta-secondary" onclick={handleOpenAccount}>Open Account</button>
                    <template lwc:if={hasProperty}>
                        <button type="button" class="cta cta-secondary" onclick={handleOpenProperty}>Open Property</button>
                    </template>
                    <button type="button" class="cta cta-secondary" onclick={handleEditOpportunity}>Edit</button>
                    <template lwc:if={showNextStageAction}>
                        <button type="button" class="cta" onclick={handleNextStage}>Next Stage</button>
                    </template>
                </div>
            </section>

            <div class="hero-kpis">
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{notesCount}</div>
                    <div class="hero-kpi-label">Notes</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{filesCount}</div>
                    <div class="hero-kpi-label">Files</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{tasks.length}</div>
                    <div class="hero-kpi-label">Open Activity</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{openItemsCount}</div>
                    <div class="hero-kpi-label">Open Items</div>
                </article>
            </div>

            <section class="panel" lwc:if={hasPathSteps}>
                <div class="panel-header">
                    <span>Opportunity Path</span>
                    <div class="panel-actions">
                        <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Stage</button>
                    </div>
                </div>
                <div class="path">
                    <template for:each={pathSteps} for:item="step">
                        <button type="button" key={step.label} class={step.cssClass} data-stage={step.label} onclick={handleSelectStage} disabled={step.disabled}>{step.label}</button>
                    </template>
                </div>
            </section>

            <div class="page-layout">
                    <section class="panel">
                        <div class="panel-header">
                            <span>Opportunity Snapshot</span>
                            <div class="panel-actions">
                                <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Snapshot</button>
                                <button type="button" class="header-button" onclick={handleOpenAccount}>Open Account</button>
                            </div>
                        </div>
                        <div class="grid">
                            <div><div class="label">Opportunity Name</div><div class="value">{opp.Name}</div></div>
                            <div><div class="label">Account</div><div class="value"><a href={accountUrl}>{accountName}</a></div></div>
                            <div><div class="label">Record Type</div><div class="value">{lobLabel}</div></div>
                            <div><div class="label">Stage</div><div class="value">{opp.StageName}</div></div>
                            <div><div class="label">Annual Value</div><div class="value">{amountFormatted}</div></div>
                            <div><div class="label">Close Date</div><div class="value">{closeDateFormatted}</div></div>
                            <div><div class="label">Owner</div><div class="value">{opp.Owner.Name}</div></div>
                            <div><div class="label">ODL Path</div><div class="value">{opp.ODL_Path__c}</div></div>
                        </div>
                    </section>

                    <section class="panel" lwc:if={showServicePlanSection}>
                        <div class="panel-header">
                            <span>Service Plan</span>
                            <div class="panel-actions">
                                <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Service Plan</button>
                                <button type="button" class="header-button" onclick={createTask}>New Follow-Up</button>
                            </div>
                        </div>
                        <table class="table">
                            <thead>
                                <tr><th>Service</th><th>Frequency</th><th>Billing</th><th>Contract Term</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>{serviceInterest}</td>
                                    <td>{billingFrequency}</td>
                                    <td>{monthlyBillingFormatted}</td>
                                    <td>{contractTerm}</td>
                                    <td>{estimateStatus}</td>
                                </tr>
                            </tbody>
                        </table>
                    </section>

                    <section class="panel" data-focus-section="activity">
                        <div class="panel-header">
                            <span>Activity and Next Follow-Up</span>
                            <div class="panel-actions">
                                <button type="button" class="header-button" onclick={logCall}>Log Call</button>
                                <button type="button" class="header-button" onclick={createTask}>New Task</button>
                                <button type="button" class="header-button" onclick={scheduleEvent}>Schedule Event</button>
                            </div>
                        </div>
                        <table class="table">
                            <thead>
                                <tr><th>Last Activity</th><th>Date</th><th>Voicemail</th><th>Next Task</th><th>Due</th><th>Owner</th></tr>
                            </thead>
                            <tbody>
                                <template lwc:if={hasTasks}>
                                    <tr>
                                        <td>{lastActivityLabel}</td>
                                        <td>{lastTouchFormatted}</td>
                                        <td>{voicemailLabel}</td>
                                        <td>{nextTaskLabel}</td>
                                        <td>{nextFollowUpFormatted}</td>
                                        <td>{opp.Owner.Name}</td>
                                    </tr>
                                </template>
                                <template lwc:else>
                                    <tr><td colspan="6" class="empty-row"></td></tr>
                                </template>
                            </tbody>
                        </table>
                        <template lwc:if={hasTasks}>
                            <table class="table secondary-table">
                                <thead>
                                    <tr><th>Subject</th><th>Date</th><th>Status</th><th>Owner</th><th>Open</th></tr>
                                </thead>
                                <tbody>
                                    <template for:each={tasks} for:item="task">
                                        <tr key={task.Id}>
                                            <td>{task.Subject}</td>
                                            <td>{task.activityDateFormatted}</td>
                                            <td>{task.Status}</td>
                                            <td>{task.Owner.Name}</td>
                                            <td><a href={task.url}>Open</a></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                    </section>

                    <div class="two-up">
                        <section class="panel">
                            <div class="panel-header">
                                <span>Estimate and Billing</span>
                                <div class="panel-actions">
                                    <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Estimate</button>
                                </div>
                            </div>
                            <div class="grid compact-grid">
                                <div><div class="label">Estimate Status</div><div class="value">{estimateStatus}</div></div>
                                <div><div class="label">Monthly Billing</div><div class="value">{monthlyBillingFormatted}</div></div>
                                <div><div class="label">Contract Term</div><div class="value">{contractTerm}</div></div>
                                <div><div class="label">Billing Frequency</div><div class="value">{billingFrequency}</div></div>
                            </div>
                        </section>

                        <section class="panel" lwc:if={hasProperty}>
                            <div class="panel-header">
                                <span>Related Property</span>
                                <div class="panel-actions">
                                    <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Property Context</button>
                                    <button type="button" class="header-button" onclick={handleOpenProperty}>Open Property</button>
                                </div>
                            </div>
                            <div class="grid compact-grid">
                                <div><div class="label">Property</div><div class="value"><a href={propertyUrl}>{propertyName}</a></div></div>
                                <div><div class="label">Lot Size</div><div class="value">{lotSizeDisplay}</div></div>
                                <div><div class="label">Irrigation</div><div class="value">{irrigationDisplay}</div></div>
                                <div><div class="label">Gate Access</div><div class="value">{gateAccessDisplay}</div></div>
                            </div>
                        </section>
                    </div>

                    <section class="panel" data-focus-section="notes">
                        <div class="panel-header">
                            <span>Notes</span>
                        </div>
                        <template lwc:if={hasNotes}>
                            <table class="table">
                                <thead>
                                    <tr><th>Note</th><th>Description</th><th>Type</th><th>Updated</th><th>Open</th></tr>
                                </thead>
                                <tbody>
                                    <template for:each={notes} for:item="row">
                                        <tr key={row.id}>
                                            <td>{row.label}</td>
                                            <td>{row.notesPreview}</td>
                                            <td>{row.subtext}</td>
                                            <td>{row.dateText}</td>
                                            <td><a href={row.url}>Open</a></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:else>
                            <div class="empty-state empty-state-quiet"></div>
                        </template>
                    </section>

                    <section class="panel">
                        <div class="panel-header">
                            <span>Files and Photos</span>
                        </div>
                        <template lwc:if={hasFiles}>
                            <table class="table">
                                <thead>
                                    <tr><th>File</th><th>Type</th><th>Updated</th><th>Open</th></tr>
                                </thead>
                                <tbody>
                                    <template for:each={files} for:item="row">
                                        <tr key={row.id}>
                                            <td>{row.label}</td>
                                            <td>{row.subtext}</td>
                                            <td>{row.dateText}</td>
                                            <td><a href={row.url}>Open</a></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:else>
                            <div class="empty-state empty-state-stack">
                                <lightning-file-upload
                                    label="Upload files and photos"
                                    name="odlLawnCareFiles"
                                    record-id={recordId}
                                    multiple
                                    onuploadfinished={refreshData}>
                                </lightning-file-upload>
                            </div>
                        </template>
                    </section>
                    <div class="two-up">
                    <section class="panel rail-panel" lwc:if={hasNextActionItems}>
                        <div class="panel-header">
                            <span>Next Actions</span>
                        </div>
                        <div class="qa-list">
                            <template for:each={nextActionItems} for:item="item">
                                <div class="qa-item" key={item.label}>
                                    <div class="qa-title">{item.label}</div>
                                    <div class="qa-meta">{item.dateText}</div>
                                </div>
                            </template>
                        </div>
                    </section>

                    <section class="panel rail-panel">
                        <div class="panel-header">
                            <span>Activity Health</span>
                        </div>
                        <div class="rail-body">
                            <div class="rail-row"><span>Last touch</span><span>{lastTouchFormatted}</span></div>
                            <div class="rail-row"><span>Voicemail</span><span>{voicemailLabel}</span></div>
                            <div class="rail-row"><span>Next follow-up</span><span>{nextFollowUpFormatted}</span></div>
                            <div class="rail-row"><span>Open tasks</span><span>{tasks.length}</span></div>
                        </div>
                    </section>
                    </div>

                    <section class="panel" lwc:if={hasOpenItems}>
                        <div class="panel-header">
                            <span>Open Items</span>
                        </div>
                        <div class="issue-list">
                            <template for:each={openItems} for:item="item">
                                <div class="issue" key={item}>{item}</div>
                            </template>
                        </div>
                    </section>
            </div>
        </section>
    </template>

    <template lwc:elseif={loadError}>
        <div class="panel empty-state">{loadErrorMessage}</div>
    </template>

    <template lwc:elseif={isLoaded}>
        <div class="panel empty-state">Loading...</div>
    </template>
</template>
