<template>
    <template lwc:if={isLoaded}>
        <lightning-card title="Addresses &amp; Contact" icon-name="utility:location">
            <div class="slds-card__body">
                <div class="slds-grid slds-wrap slds-gutters_small">

                    <!-- Division Office -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <p class="slds-text-body_small slds-text-color_weak slds-p-around_x-small" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e4e7ec">Division Office</p>
                        <dl class="slds-dl_horizontal slds-p-around_x-small">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Office Address</dt>
                            <dd class="slds-dl_horizontal__detail">{divOfficeAddr}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Physical Address</dt>
                            <dd class="slds-dl_horizontal__detail">
                                <template for:each={physAddressLines} for:item="line">
                                    <div key={line.id}>{line.text}</div>
                                </template>
                            </dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Phone</dt>
                            <dd class="slds-dl_horizontal__detail">
                                <template lwc:if={divPhoneHref}>
                                    <a href={divPhoneHref} class="slds-text-link">{divPhone}</a>
                                </template>
                                <template lwc:else><span>{divPhone}</span></template>
                            </dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Division Email</dt>
                            <dd class="slds-dl_horizontal__detail">
                                <template lwc:if={divEmailHref}>
                                    <a href={divEmailHref} class="slds-text-link">{divEmail}</a>
                                </template>
                                <template lwc:else><span>{divEmail}</span></template>
                            </dd>
                        </dl>
                    </div>

                    <!-- Corporate Office -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <p class="slds-text-body_small slds-text-color_weak slds-p-around_x-small" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e4e7ec">Corporate Office</p>
                        <dl class="slds-dl_horizontal slds-p-around_x-small">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Corporate Address</dt>
                            <dd class="slds-dl_horizontal__detail">{corpAddr}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Mailing Address</dt>
                            <dd class="slds-dl_horizontal__detail">
                                <template lwc:if={mailSameLabel}>
                                    <span class="slds-badge slds-badge_lightest">{mailSameLabel}</span>
                                </template>
                                <template lwc:else>
                                    <template for:each={mailAddressLines} for:item="line">
                                        <div key={line.id}>{line.text}</div>
                                    </template>
                                </template>
                            </dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">AP Invoicing Email</dt>
                            <dd class="slds-dl_horizontal__detail">
                                <template lwc:if={apEmailHref}>
                                    <a href={apEmailHref} class="slds-text-link">{apEmail}</a>
                                </template>
                                <template lwc:else><span>{apEmail}</span></template>
                            </dd>
                        </dl>
                    </div>

                </div>
            </div>
        </lightning-card>
    </template>
    <template lwc:if={hasError}>
        <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">Unable to load address data.</div>
    </template>
</template>
