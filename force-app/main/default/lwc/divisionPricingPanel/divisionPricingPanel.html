<template>
    <template lwc:if={isLoaded}>

        <!-- Billing Basis -->
        <lightning-card title="Billing Basis" icon-name="utility:currency" class="slds-m-bottom_small">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Sod Billing Basis</dt>
                    <dd class="slds-dl_horizontal__detail">{sodBasis}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Tree Billing Basis</dt>
                    <dd class="slds-dl_horizontal__detail">{treeBasis}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Sod Type Notes</dt>
                    <dd class="slds-dl_horizontal__detail">{sodTypeNotes}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Model Home Discount</dt>
                    <dd class="slds-dl_horizontal__detail">{modelDiscPct}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Discount Notes</dt>
                    <dd class="slds-dl_horizontal__detail">{modelDiscNotes}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Price Adjustment Notice</dt>
                    <dd class="slds-dl_horizontal__detail">{priceAdjDays}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Back-Charge Admin Fee</dt>
                    <dd class="slds-dl_horizontal__detail">{backChargeFee}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Price Adjustment Process</dt>
                    <dd class="slds-dl_horizontal__detail">{priceAdjProc}</dd>
                </dl>
            </div>
        </lightning-card>

        <!-- Payment Terms -->
        <lightning-card title="Payment Terms" icon-name="utility:moneybag" class="slds-m-bottom_small">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Payment Method</dt>
                    <dd class="slds-dl_horizontal__detail">{paymentMethod}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Invoice Deadline</dt>
                    <dd class="slds-dl_horizontal__detail">{invDeadline}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Pay Schedule (Inv 1–15)</dt>
                    <dd class="slds-dl_horizontal__detail">{paySchedule115}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Pay Schedule (Inv 16–End)</dt>
                    <dd class="slds-dl_horizontal__detail">{paySchedule16E}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Lien Waiver</dt>
                    <dd class="slds-dl_horizontal__detail"><span class={lienChip}>{lienWaiver}</span></dd>
                </dl>
            </div>
        </lightning-card>

        <!-- Invoice & Portals -->
        <lightning-card title="Invoice Methods &amp; Portals" icon-name="utility:description" class="slds-m-bottom_small">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Invoice Method (Primary)</dt>
                    <dd class="slds-dl_horizontal__detail">{invMethodPri}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Invoice Method (Non-Portal)</dt>
                    <dd class="slds-dl_horizontal__detail">{invMethodNon}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Non-Portal Invoice Req.</dt>
                    <dd class="slds-dl_horizontal__detail">{nonPortalReq}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Builder Portal</dt>
                    <dd class="slds-dl_horizontal__detail">
                        <template lwc:if={builderPortal}>
                            <a href={builderPortal} target="_blank" class="slds-text-link">Open Builder Portal →</a>
                        </template>
                        <template lwc:else>—</template>
                    </dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Vendor Portal</dt>
                    <dd class="slds-dl_horizontal__detail">
                        <template lwc:if={vendorPortal}>
                            <a href={vendorPortal} target="_blank" class="slds-text-link">Open Vendor Portal →</a>
                        </template>
                        <template lwc:else>—</template>
                    </dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">AP Invoicing Email</dt>
                    <dd class="slds-dl_horizontal__detail">
                        <template lwc:if={apEmailHref}>
                            <a href={apEmailHref} class="slds-text-link">{apEmail}</a>
                        </template>
                        <template lwc:else>{apEmail}</template>
                    </dd>
                </dl>
            </div>
        </lightning-card>

        <!-- Agreements -->
        <lightning-card title="Agreements &amp; Compliance" icon-name="utility:contract_doc" class="slds-m-bottom_small">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal slds-m-bottom_small">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Contractor Agreement Signed</dt>
                    <dd class="slds-dl_horizontal__detail">{contractDate}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">LOVING License #</dt>
                    <dd class="slds-dl_horizontal__detail">{lovingLicense}</dd>
                </dl>
                <template for:each={agreements} for:item="ag">
                    <div key={ag.id} class="slds-grid slds-gutters_x-small slds-m-bottom_xx-small slds-align_absolute-center">
                        <div class="slds-col slds-shrink-none">
                            <span class={ag.chipClass}>
                                <template lwc:if={ag.signed}>✓ Signed</template>
                                <template lwc:else>Not signed</template>
                            </span>
                        </div>
                        <div class="slds-col">
                            <span class="slds-text-body_regular">{ag.label}</span>
                        </div>
                    </div>
                </template>
            </div>
        </lightning-card>

        <!-- Insurance Requirements -->
        <lightning-card title="Insurance Requirements" icon-name="utility:shield">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Additional Insured</dt>
                    <dd class="slds-dl_horizontal__detail"><span class={addlInsuredChip}>{addlInsured}</span></dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Waiver of Subrogation</dt>
                    <dd class="slds-dl_horizontal__detail"><span class={waiverChip}>{waiverSubro}</span></dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">CGL Per Occurrence</dt>
                    <dd class="slds-dl_horizontal__detail">{cglOcc}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">CGL Aggregate</dt>
                    <dd class="slds-dl_horizontal__detail">{cglAgg}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Auto Liability</dt>
                    <dd class="slds-dl_horizontal__detail">{autoLiab}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Umbrella</dt>
                    <dd class="slds-dl_horizontal__detail">{umbrella}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Workers' Comp</dt>
                    <dd class="slds-dl_horizontal__detail">{workersComp}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Renewal Cert Lead Time</dt>
                    <dd class="slds-dl_horizontal__detail">{renewalCert}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Insurance Certs on File</dt>
                    <dd class="slds-dl_horizontal__detail"><span class={certsChip}>{certsOnFile}</span></dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">W-9 on File</dt>
                    <dd class="slds-dl_horizontal__detail"><span class={w9Chip}>{w9OnFile}</span></dd>
                </dl>
            </div>
        </lightning-card>

    </template>
    <template lwc:if={hasError}>
        <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">Unable to load pricing data.</div>
    </template>
</template>
