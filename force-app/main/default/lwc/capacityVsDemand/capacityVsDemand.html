<template>
    <lightning-card title="Capacity vs Demand" icon-name="standard:work_capacity_usage">
        <template if:true={snapshot}>
            <div class="slds-p-horizontal_medium">
                <div class="slds-text-color_weak slds-text-body_small slds-m-bottom_small">
                    As of {snapshot.asOfDate} &middot; Total {snapshot.totalDemand}h / {snapshot.totalCapacity}h
                    ({snapshot.totalUtilization}% utilization)
                </div>
                <template for:each={snapshot.serviceLines} for:item="sl">
                    <div key={sl.serviceLine} class="slds-m-bottom_x-small">
                        <div class="slds-grid slds-grid_align-spread">
                            <span class="slds-text-body_regular">{sl.serviceLine}</span>
                            <span class="slds-text-body_small">{sl.demandHours}h / {sl.capacityHours}h ({sl.utilizationPct}%)</span>
                        </div>
                        <div class="cap-bar-container">
                            <div class={sl.statusClass} style={sl.barStyle}></div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
