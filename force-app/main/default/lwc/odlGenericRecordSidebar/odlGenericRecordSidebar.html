<template>
    <section class="stack">
        <section class="card">
            <div class="header">Record Info</div>
            <div class="form-wrap">
                <lightning-record-form
                    record-id={recordId}
                    object-api-name={objectApiName}
                    mode="view"
                    layout-type="Compact">
                </lightning-record-form>
            </div>
        </section>

        <section class="card">
            <div class="header">Quick Links</div>
            <div class="body">
                <a class="open-link" href={recordUrl}>Open Full Record</a>
                <button class="btn btn-primary" onclick={handleEditRecord}>Edit Record</button>
                <button class="btn btn-ghost" onclick={handleViewRecord}>View Details</button>
            </div>
        </section>
    </section>
</template>
