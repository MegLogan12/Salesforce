<template>
<div class="cs-wrap">

<!-- BRANDED HEADER (intentionally custom — LOVING green is brand identity) -->
<header class="cs-hdr">
    <span class="cs-logo">❧</span>
    <div class="cs-brand"><b>LOVING</b><span>CUSTOMER SUCCESS CONSOLE</span></div>
    <div class="cs-search-wrap">
        <input type="text" class="cs-search" placeholder="Search POs, cases, quotes, communities" oninput={handleSearch} />
    </div>
    <div>
        <template if:true={readOnly}><span class="slds-badge slds-badge_lightest">Read-only</span></template>
        <template if:true={canEdit}><span class="slds-badge cs-badge-edit">CS Edit Enabled</span></template>
    </div>
</header>

<!-- SLDS TAB BAR -->
<div class="slds-tabs_default cs-tabs">
    <ul class="slds-tabs_default__nav" role="tablist">
        <template for:each={tabs} for:item="t">
            <li key={t.key} class={t.liCss} role="presentation">
                <a class="slds-tabs_default__link" role="tab" data-key={t.key} onclick={handleTab} tabindex="0">
                    {t.label}
                    <template if:true={t.count}>
                        <span class="slds-badge slds-badge_lightest cs-tab-ct">{t.count}</span>
                    </template>
                </a>
            </li>
        </template>
    </ul>
</div>

<!-- MAIN + RAIL -->
<div class="cs-body">
<div class="cs-content">

<!-- ═══════════════════ HOME ═══════════════════════════════════════════ -->
<template if:true={isHome}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <h1 class="slds-page-header__title">Home</h1>
            </div>
            <div class="slds-page-header__col-actions">
                <template if:true={canEdit}>
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button-group>
                                <lightning-button label="New PO" variant="brand" onclick={handleOpenNewPo}></lightning-button>
                                <lightning-button label="Create EPO" onclick={handleQbStartEpo}></lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
    <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_medium">
        <template for:each={homeKpis} for:item="k">
            <div key={k.l} class="slds-col slds-size_1-of-4 slds-m-bottom_x-small">
                <div class="slds-box slds-box_small cs-kpi-tile">
                    <p class="slds-text-body_small slds-text-color_weak slds-truncate" title={k.l}>{k.l}</p>
                    <p class={k.css}>{k.v}</p>
                    <p class="slds-text-body_small slds-text-color_weak">{k.s}</p>
                </div>
            </div>
        </template>
    </div>
    <lightning-card title="Pipeline by stage">
        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <p class="slds-text-title_caps slds-m-bottom_x-small">PO stages</p>
                    <template for:each={homePoStages} for:item="r">
                        <div key={r.st} class="cs-stage-row">
                            <span class="cs-stage-lbl slds-text-body_small">{r.st}</span>
                            <div class="cs-bar"><div class="cs-bar-fill cs-bar-orange" style={r.barStyle}></div></div>
                            <span class="slds-text-body_small cs-stage-n">{r.n}</span>
                        </div>
                    </template>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <p class="slds-text-title_caps slds-m-bottom_x-small">Work Order stages (read-only)</p>
                    <template for:each={homeWoStages} for:item="r">
                        <div key={r.st} class="cs-stage-row">
                            <span class="cs-stage-lbl slds-text-body_small">{r.st}</span>
                            <div class="cs-bar"><div class="cs-bar-fill cs-bar-ever" style={r.barStyle}></div></div>
                            <span class="slds-text-body_small cs-stage-n">{r.n}</span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════ PIPELINE ════════════════════════════════════════ -->
<template if:true={isPipeline}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title"><h1 class="slds-page-header__title">Pipeline</h1></div>
            <div class="slds-page-header__col-actions">
                <template if:true={canEdit}>
                    <div class="slds-page-header__controls"><div class="slds-page-header__control">
                        <lightning-button label="New PO" variant="brand" onclick={handleOpenNewPo}></lightning-button>
                    </div></div>
                </template>
            </div>
        </div>
    </div>
    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
        PO stages — Builder_PO__c.Status__c · CS owns this lane
    </p>
    <div class="cs-board slds-m-bottom_large">
        <template for:each={poLane} for:item="col">
            <div key={col.st} class="cs-board-col">
                <div class="cs-col-hdr">
                    <span class="slds-text-body_small slds-text-color_default" style="font-weight:700">{col.st}</span>
                    <span class="slds-badge slds-badge_lightest slds-m-left_xx-small">{col.count}</span>
                    <template if:true={col.sum}>
                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">{col.sum}</span>
                    </template>
                </div>
                <div class="cs-col-cards">
                    <template if:true={col.empty}>
                        <p class="slds-text-body_small slds-text-color_weak slds-text-align_center slds-p-vertical_small">Empty</p>
                    </template>
                    <template for:each={col.cards} for:item="c">
                        <button key={c.id} class="cs-pcard" data-id={c.id} onclick={handlePoCard}>
                            <span class="cs-pcard-id">{c.poNumber}</span>
                            <span class="cs-pcard-sub">{c.builder} · {c.lot}</span>
                            <span class="cs-pcard-sub">{c.community}</span>
                            <span class="cs-pcard-foot">
                                <template for:each={c.chips} for:item="ch">
                                    <span key={ch.id} class={ch.css}>{ch.label}</span>
                                </template>
                                <span class="cs-pcard-amt">{c.amountLabel}</span>
                            </span>
                        </button>
                    </template>
                </div>
            </div>
        </template>
    </div>
    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
        Work Order stages — Work_Order__c.Status__c · read-only for CS
    </p>
    <div class="cs-board slds-m-bottom_medium">
        <template for:each={woLane} for:item="col">
            <div key={col.st} class="cs-board-col">
                <div class="cs-col-hdr">
                    <span class="slds-text-body_small" style="font-weight:700">{col.stLabel}</span>
                    <span class="slds-badge slds-badge_lightest slds-m-left_xx-small">{col.count}</span>
                </div>
                <div class="cs-col-cards">
                    <template if:true={col.empty}>
                        <p class="slds-text-body_small slds-text-color_weak slds-text-align_center slds-p-vertical_small">Empty</p>
                    </template>
                    <template for:each={col.cards} for:item="c">
                        <button key={c.id} class="cs-pcard" data-id={c.id} onclick={handleWoCard}>
                            <span class="cs-pcard-id">{c.name}</span>
                            <span class="cs-pcard-sub">{c.lot} · {c.community}</span>
                            <span class="cs-pcard-sub">{c.fmLabel}</span>
                            <span class="cs-pcard-foot">
                                <template if:true={c.typeChip}><span class={c.typeChip.css}>{c.typeChip.label}</span></template>
                                <template if:true={c.subChip}><span class={c.subChip.css}>{c.subChip.label}</span></template>
                                <span class="cs-pcard-amt">{c.amountLabel}</span>
                            </span>
                        </button>
                    </template>
                </div>
            </div>
        </template>
    </div>
    <p class="slds-text-body_small slds-text-color_weak">Two lanes: the PO lane is fully workable here. The Work Order lane is read-only for CS — sub-statuses ride as chips on the cards, and WO detail lives in the scheduling console.</p>
</template>

<!-- ═══════════════════ PO INTAKE ════════════════════════════════════════ -->
<template if:true={isPo}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title"><h1 class="slds-page-header__title">PO Intake</h1></div>
            <div class="slds-page-header__col-actions">
                <template if:true={canEdit}>
                    <div class="slds-page-header__controls"><div class="slds-page-header__control">
                        <lightning-button label="New PO" variant="brand" onclick={handleOpenNewPo}></lightning-button>
                    </div></div>
                </template>
            </div>
        </div>
    </div>
    <div class="slds-button-group slds-m-bottom_medium" role="group">
        <template for:each={poFilterChips} for:item="f">
            <button key={f.key} class={f.css} data-key={f.key} onclick={handlePoFilter}>
                {f.label}<template if:true={f.count}>&nbsp;<span class="slds-badge slds-badge_lightest">{f.count}</span></template>
            </button>
        </template>
    </div>
    <lightning-card>
        <span slot="title">PO intake queue&nbsp;<span class="slds-badge slds-badge_lightest">{poRowCount} shown</span></span>
        <div class="slds-card__body">
            <div class="cs-table-scroll">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-no-row-hover">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">PO</div></th>
                            <th scope="col"><div class="slds-truncate">Builder / Community</div></th>
                            <th scope="col"><div class="slds-truncate">Lot</div></th>
                            <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Amount</div></th>
                            <th scope="col"><div class="slds-truncate">Install</div></th>
                            <th scope="col"><div class="slds-truncate">Status</div></th>
                            <th scope="col"><div class="slds-truncate">Actions</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={poRows} for:item="p">
                            <tr key={p.id}>
                                <td data-label="PO">
                                    <div class="slds-truncate">{p.poNumber}</div>
                                    <template if:true={p.noFile}><span class="slds-badge cs-badge-red">No file</span></template>
                                </td>
                                <td data-label="Builder / Community">
                                    <div class="slds-truncate">{p.builder}</div>
                                    <div class="slds-text-body_small slds-text-color_weak">{p.community}</div>
                                    <template if:true={p.mismatchLine}><div class="slds-text-body_small cs-text-red">{p.mismatchLine}</div></template>
                                    <template if:true={p.nfiLine}><div class="slds-text-body_small cs-text-amber">{p.nfiLine}</div></template>
                                </td>
                                <td data-label="Lot"><div class="slds-truncate">{p.lot}</div></td>
                                <td data-label="Amount" class="slds-text-align_right">{p.amountLabel}</td>
                                <td data-label="Install">{p.install}</td>
                                <td data-label="Status"><span class={p.pillCss}>{p.status}</span></td>
                                <td data-label="Actions">
                                    <template if:true={canEdit}>
                                        <div class="cs-row-acts">
                                            <button class="slds-button slds-button_neutral slds-button_small" data-id={p.id} onclick={handleVerify}>Verify</button>
                                            <button class="slds-button slds-button_text-destructive slds-button_small" data-id={p.id} onclick={handleNfi}>NFI</button>
                                            <template if:true={p.isMismatch}>
                                                <button class="slds-button slds-button_neutral slds-button_small" data-id={p.id} onclick={handleEpoFromPo}>Create EPO</button>
                                            </template>
                                            <button class="slds-button slds-button_neutral slds-button_small" data-id={p.id} data-kind="po" onclick={handleOpenEmail}>Email</button>
                                            <button class="slds-button slds-button_neutral slds-button_small" data-id={p.id} onclick={handleEscalate}>Escalate</button>
                                        </div>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <p class="slds-text-body_small slds-text-color_weak slds-p-around_medium">Verify checks the PO against the community package (a PO file must be attached). NFI returns it with the count incrementing. Mismatches resolve by correction or EPO. Verified POs move to Approvals for the CS Approve that gates Work Order creation.</p>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════ APPROVALS ════════════════════════════════════════ -->
<template if:true={isApprovals}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title"><h1 class="slds-page-header__title">Approvals</h1></div>
        </div>
    </div>
    <lightning-card>
        <span slot="title">Waiting on you&nbsp;<span class="slds-badge slds-badge_lightest">{approvalCount}</span></span>
        <div class="slds-card__body">
            <template if:true={noApprovals}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-icon icon-name="utility:check" size="medium" class="slds-m-bottom_small" style="color:#2e844a"></lightning-icon>
                    <p class="slds-text-body_regular slds-text-color_weak">Nothing waiting on you. New POs, quotes, and warranty determinations land here.</p>
                </div>
            </template>
            <template if:false={noApprovals}>
                <div class="cs-table-scroll">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-no-row-hover">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Type</div></th>
                                <th scope="col"><div class="slds-truncate">Record</div></th>
                                <th scope="col"><div class="slds-truncate">Detail</div></th>
                                <th scope="col"><div class="slds-truncate">Decision</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={approvalRows} for:item="i">
                                <tr key={i.key}>
                                    <td><span class={i.kindCss}>{i.kind}</span></td>
                                    <td class="slds-cell-wrap"><b>{i.rec}</b></td>
                                    <td class="slds-cell-wrap">{i.desc}</td>
                                    <td>
                                        <template if:true={canEdit}>
                                            <div class="cs-row-acts">
                                                <button class="slds-button slds-button_success slds-button_small" data-act={i.act} data-id={i.id} onclick={handleApprovalAct}>{i.actLabel}</button>
                                                <button class="slds-button slds-button_text-destructive slds-button_small" data-rej={i.rej} data-id={i.id} onclick={handleApprovalRej}>{i.rejLabel}</button>
                                            </div>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <p class="slds-text-body_small slds-text-color_weak slds-p-horizontal_medium slds-p-bottom_medium">One queue for every CS decision: PO approvals, mismatch resolutions, quote approvals, and warranty determinations. Takeoff approvals are intentionally not here (Meg, Jun 10 2026).</p>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════ CASES ═════════════════════════════════════════════ -->
<template if:true={isCases}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title"><h1 class="slds-page-header__title">Cases</h1></div>
            <div class="slds-page-header__col-actions">
                <template if:true={canEdit}>
                    <div class="slds-page-header__controls"><div class="slds-page-header__control">
                        <lightning-button label="New case" variant="brand" onclick={handleOpenNewCase}></lightning-button>
                    </div></div>
                </template>
            </div>
        </div>
    </div>
    <ul class="slds-accordion slds-m-bottom_medium">
        <template for:each={caseRows} for:item="c">
            <li key={c.id} class={c.liCss}>
                <section class="slds-accordion__section">
                    <div class="slds-accordion__summary">
                        <h3 class="slds-accordion__summary-heading">
                            <button class="slds-button slds-button_reset slds-accordion__summary-action cs-acc-btn" data-id={c.id} onclick={handleToggleCase} aria-expanded={c.expanded}>
                                <lightning-icon icon-name="utility:chevronright" size="x-small" class="slds-accordion__summary-action-icon slds-button__icon slds-button__icon_left"></lightning-icon>
                                <span class="slds-accordion__summary-content">
                                    <b>{c.name} · {c.subject}</b>
                                    <span class="slds-text-body_small slds-text-color_weak cs-acc-meta">{c.account} · {c.lot} · {c.origin}</span>
                                </span>
                            </button>
                        </h3>
                        <div class="slds-shrink-none cs-acc-badges">
                            <span class="slds-badge slds-badge_lightest">{c.statusLabel}</span>
                            <template if:true={c.qiLocked}>
                                <span class="slds-badge cs-badge-red slds-m-left_xx-small">Close locked · QI</span>
                            </template>
                        </div>
                    </div>
                    <template if:true={c.expanded}>
                        <div class="slds-accordion__content">
                            <div class="slds-p-around_medium">
                                <template for:each={c.noteLines} for:item="n">
                                    <div key={n.id} class="slds-box slds-box_x-small slds-m-bottom_x-small slds-text-body_small">{n.text}</div>
                                </template>
                                <template if:true={canEdit}>
                                    <lightning-textarea
                                        label="Add a note"
                                        data-note={c.id}
                                        class="slds-m-top_small"
                                        placeholder="Add a note to the timeline">
                                    </lightning-textarea>
                                    <div class="cs-row-acts slds-m-top_small">
                                        <lightning-button label="Add note" data-id={c.id} onclick={handleCaseNote}></lightning-button>
                                        <lightning-button label="Email" data-id={c.id} data-kind="case" onclick={handleOpenEmail}></lightning-button>
                                        <lightning-button label="Resolve" variant="success" data-id={c.id} onclick={handleCaseResolve}></lightning-button>
                                        <lightning-button label="Close" data-id={c.id} onclick={handleCaseClose}></lightning-button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </section>
            </li>
        </template>
    </ul>
    <p class="slds-text-body_small slds-text-color_weak">QI failures keep Close locked until re-inspection passes with every item at 9 or above (the score posts from the field). Warranty claims, builder disputes, and Outdoor Living issues share the queue.</p>
</template>

<!-- ═══════════════════ QUOTE BUILDER ════════════════════════════════════ -->
<template if:true={isQuotes}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title"><h1 class="slds-page-header__title">Quote Builder</h1></div>
            <div class="slds-page-header__col-actions">
                <template if:true={canEdit}>
                    <div class="slds-page-header__controls"><div class="slds-page-header__control">
                        <lightning-button label="Create EPO" onclick={handleQbStartEpo}></lightning-button>
                    </div></div>
                </template>
            </div>
        </div>
    </div>
    <div class="cs-qb-layout">
        <lightning-card>
            <span slot="title">Calculator&nbsp;<span class={qbKindCss}>{qbKind}</span></span>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            label="Quote type"
                            value={qbKind}
                            options={quoteKindOptions}
                            onchange={handleQbKind}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-grow">
                        <lightning-input
                            label="Lot / client"
                            value={qbLot}
                            placeholder="Lot 96 · Fox Ridge Ph 3"
                            oninput={handleQbLot}>
                        </lightning-input>
                    </div>
                </div>
                <template for:each={qbLineRows} for:item="l">
                    <div key={l.id} class="cs-qb-line slds-m-bottom_x-small">
                        <div class="slds-col slds-grow">
                            <select class="slds-select" data-id={l.id} onchange={handleQbItem}>
                                <template for:each={l.options} for:item="o">
                                    <option key={o.id} value={o.id} selected={o.selected}>{o.name}</option>
                                </template>
                            </select>
                        </div>
                        <div class="cs-qb-num">
                            <input type="number" class="slds-input" value={l.qty} min="0" data-id={l.id} oninput={handleQbQty} placeholder="Qty" />
                        </div>
                        <div class="cs-qb-num">
                            <input type="number" class="slds-input" value={l.price} min="0" step="0.01" data-id={l.id} oninput={handleQbPrice} placeholder="Price" />
                        </div>
                        <span class="slds-text-body_regular slds-m-left_small cs-qb-lt">{l.lineTotal}</span>
                        <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-button_icon-small slds-m-left_x-small" data-id={l.id} onclick={handleQbRemove} title="Remove line">
                            <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Remove"></lightning-icon>
                        </button>
                    </div>
                </template>
                <lightning-button label="Add line" class="slds-m-top_small" onclick={handleQbAdd}></lightning-button>
                <div class="slds-m-top_medium">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                        <span class="slds-text-body_small slds-text-color_weak">Subtotal</span>
                        <span class="slds-text-body_regular">{qbTotals.rev}</span>
                    </div>
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">

                                <button class="slds-button slds-button_neutral slds-button_small" data-name={b.name} onclick={handleBuilderComms}>Communities</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div></div>
    </lightning-card>
</template>

<!-- ═══════════════════ COMMUNITIES ═══════════════════════════════════════ -->
<template if:true={isCommunities}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title"><h1 class="slds-page-header__title">Communities</h1></div>
            <div class="slds-page-header__col-actions">
                <template if:true={canEdit}>
                    <div class="slds-page-header__controls"><div class="slds-page-header__control">
                        <lightning-button label="New community" variant="brand" onclick={handleOpenNewComm}></lightning-button>
                    </div></div>
                </template>
            </div>
        </div>
    </div>
    <div class="slds-button-group slds-m-bottom_medium" role="group">
        <template for:each={terrChips} for:item="t">
            <button key={t.key} class={t.css} data-key={t.key} onclick={handleTerrFilter}>{t.label}</button>
        </template>
    </div>
    <lightning-card>
        <span slot="title">Active communities&nbsp;<span class="slds-badge slds-badge_lightest">{communityCount}</span></span>
        <div class="slds-card__body"><div class="cs-table-scroll">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-no-row-hover">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col"><div class="slds-truncate">Community</div></th>
                        <th scope="col"><div class="slds-truncate">Division</div></th>
                        <th scope="col"><div class="slds-truncate">FM assignment</div></th>
                        <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Lots</div></th>
                        <th scope="col"><div class="slds-truncate">BMG</div></th>
                        <th scope="col"><div class="slds-truncate">Aqua</div></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={communityRows} for:item="c">
                        <tr key={c.id}>
                            <td><div class="slds-truncate">{c.name}</div></td>
                            <td>
                                <div class="slds-truncate">{c.division}</div>
                                <div class="slds-text-body_small slds-text-color_weak">{c.territory}</div>
                            </td>
                            <td>
                                <template if:true={c.fmBlocked}>
                                    <span class="slds-badge cs-badge-red">BLOCKED pending Ops (G6)</span>
                                </template>
                                <template if:false={c.fmBlocked}>{c.fmLabel}</template>
                            </td>
                            <td class="slds-text-align_right">{c.lotsLabel}</td>
                            <td><div class="slds-truncate">{c.bmg}</div></td>
                            <td>
                                <template if:true={c.aqua}><span class="slds-badge cs-badge-aqua">Active</span></template>
                                <template if:false={c.aqua}><span class="slds-badge slds-badge_lightest">Off</span></template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-p-around_medium">FM assignment is community configuration (G6): zones 1, 3, and 4 stay BLOCKED pending Ops and are never guessed, including on newly created communities.</p>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════ ZONE MAP ══════════════════════════════════════════ -->
<template if:true={isZones}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title"><h1 class="slds-page-header__title">Zone Map</h1></div>
            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls"><div class="slds-page-header__control">
                    <span class="slds-badge slds-badge_lightest">Assignment table · map layer pending territory cleanup (Q-020)</span>
                </div></div>
            </div>
        </div>
    </div>
    <lightning-card title="Zone assignments">
        <div class="slds-card__body slds-card__body_inner">
            <template for:each={zoneRows} for:item="z">
                <div key={z.zone} class="slds-media slds-media_center slds-p-vertical_x-small slds-border_bottom">
                    <div class="slds-media__body">
                        <b class="slds-text-body_regular">{z.label}</b>
                        <p class="slds-text-body_small slds-text-color_weak">{z.comms}</p>
                    </div>
                    <div class="slds-media__figure slds-media__figure_reverse">
                        <template if:true={z.blocked}>
                            <span class="slds-badge cs-badge-red">BLOCKED pending Ops (G6)</span>
                        </template>
                        <template if:false={z.blocked}>
                            <span class="slds-badge cs-badge-green">{z.fmLabel}</span>
                        </template>
                    </div>
                </div>
            </template>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium">Zone ownership lives on configuration (gate G6). Zones 1, 3, and 4 FM names stay BLOCKED pending Ops input and are never guessed, here or anywhere else. The geographic layer ships after the community territory backfill (36 communities currently missing territory).</p>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════ KNOWLEDGE ══════════════════════════════════════════ -->
<template if:true={isKnowledge}>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title"><h1 class="slds-page-header__title">Knowledge</h1></div>
            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls"><div class="slds-page-header__control">
                    <span class="slds-badge cs-badge-amber">Draft articles · pending review before publish</span>
                </div></div>
            </div>
        </div>
    </div>
    <ul class="slds-accordion">
        <template for:each={kbRows} for:item="k">
            <li key={k.id} class={k.liCss}>
                <section class="slds-accordion__section">
                    <div class="slds-accordion__summary">
                        <h3 class="slds-accordion__summary-heading">
                            <button class="slds-button slds-button_reset slds-accordion__summary-action cs-acc-btn" data-id={k.id} onclick={handleToggleKb} aria-expanded={k.expanded}>
                                <lightning-icon icon-name="utility:chevronright" size="x-small" class="slds-accordion__summary-action-icon slds-button__icon slds-button__icon_left"></lightning-icon>
                                <span class="slds-accordion__summary-content">
                                    <span class={k.catCss}>{k.cat}</span>
                                    <b class="slds-m-left_x-small">{k.title}</b>
                                    <span class="slds-text-body_small slds-text-color_weak"> {k.id} · draft</span>
                                </span>
                            </button>
                        </h3>
                    </div>
                    <template if:true={k.expanded}>
                        <div class="slds-accordion__content slds-p-around_medium">
                            <p class="slds-text-body_regular">{k.body}</p>
                        </div>
                    </template>
                </section>
            </li>
        </template>
    </ul>
    <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium">Production home for these is Service Cloud Knowledge attached to cases, POs, and quotes. Content above is draft pending Meg review (Section 11, item 14) and is not seeded to records.</p>
</template>

</div><!-- /cs-content -->

<!-- ═══════════════════ RAIL ══════════════════════════════════════════════ -->
<aside class="cs-rail">
    <!-- Agentforce -->
    <lightning-card class="slds-m-bottom_medium">
        <span slot="title">
            <span style="color:#0176d3;font-size:16px">✦</span>
            &nbsp;Agentforce
        </span>
        <p slot="footer" class="slds-text-body_small slds-text-color_weak">READ &amp; ROUTE · CONSOLE DATA ONLY</p>
        <div class="slds-card__body slds-card__body_inner">
            <div class="cs-af-log">
                <template for:each={afLog} for:item="m">
                    <div key={m.id} class={m.css}>{m.text}</div>
                </template>
            </div>
            <div class="cs-af-chips slds-m-vertical_x-small">
                <template for:each={afChips} for:item="c">
                    <button key={c.key} class="slds-button slds-button_neutral slds-button_small cs-af-chip" data-key={c.key} onclick={handleAfChip}>{c.label}</button>
                </template>
            </div>
            <div class="slds-grid slds-gutters_xx-small slds-m-top_x-small">
                <div class="slds-col slds-grow">
                    <input type="text" class="slds-input" data-f="afInput" placeholder="Ask about POs, quotes, zones, warranty" onkeydown={handleAfKey} />
                </div>
                <div class="slds-shrink-none">
                    <button class="slds-button slds-button_brand" onclick={handleAfAsk}>Ask</button>
                </div>
            </div>
        </div>
    </lightning-card>

    <!-- CSM Alerts -->
    <lightning-card title="CSM Alerts" class="slds-m-bottom_medium">
        <div class="slds-card__body slds-card__body_inner">
            <template if:true={alerts.length}>
                <template for:each={alerts} for:item="a">
                    <div key={a.id} class={a.css}>
                        <lightning-icon icon-name={a.icon} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <div>
                            <b class="slds-text-body_small">{a.title}</b>
                            <p class="slds-text-body_small slds-text-color_weak">{a.text}</p>
                        </div>
                    </div>
                </template>
            </template>
            <template if:false={alerts.length}>
                <p class="slds-text-body_small slds-text-color_weak">No active alerts.</p>
            </template>
        </div>
    </lightning-card>

    <!-- Role & Gates -->
    <lightning-card title="Role &amp; Gates">
        <div class="slds-card__body slds-card__body_inner">
            <p class="slds-text-body_small slds-text-color_weak">CS owns PO intake and approval, EPOs, quotes, cases, warranty determination, FJ tracking, onboarding, pipeline, knowledge, and zone visibility. Takeoff approvals are out of CS (Meg, Jun 10 2026). No scheduling, no field execution edits, no QI approval. G6: zone 1/3/4 FM names BLOCKED. G5: no payments. Agentforce here is read-and-route only.</p>
        </div>
    </lightning-card>
</aside>

</div><!-- /cs-body -->
</div><!-- /cs-wrap -->

<!-- ═══════════════════ MODALS ════════════════════════════════════════════ -->
<template if:true={anyModal}>
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- NEW PO -->
            <template if:true={showNewPo}>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseModal} title="Close">
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title">Create new PO</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-combobox label="Community" data-f="npComm" value="" options={communityOptions} placeholder="Select community"></lightning-combobox>
                    <lightning-input label="PO number" data-f="npNum" placeholder="PO-105001" class="slds-m-top_small"></lightning-input>
                    <lightning-input type="number" label="PO amount" data-f="npAmt" placeholder="8500" class="slds-m-top_small"></lightning-input>
                    <lightning-input type="date" label="Requested install date" data-f="npDate" class="slds-m-top_small"></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <lightning-button label="Create PO" variant="brand" onclick={handleCreatePo}></lightning-button>
                </footer>
            </template>

            <!-- NEW CASE -->
            <template if:true={showNewCase}>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseModal} title="Close">
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title">New case</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Subject" data-f="ncSubj" placeholder="What happened, in one line"></lightning-input>
                    <lightning-combobox label="Community (optional)" data-f="ncComm" value="" options={communityOptionsOptional} class="slds-m-top_small" placeholder="—"></lightning-combobox>
                    <lightning-input label="Lot / location" data-f="ncLot" placeholder="Lot 96" class="slds-m-top_small"></lightning-input>
                    <lightning-combobox label="Origin" data-f="ncOrigin" value="Builder call" options={originOptions} class="slds-m-top_small"></lightning-combobox>
                    <lightning-textarea label="First note" data-f="ncNote" placeholder="What was reported and what you committed to" class="slds-m-top_small"></lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <lightning-button label="Create case" variant="brand" onclick={handleCreateCase}></lightning-button>
                </footer>
            </template>

            <!-- ONBOARD BUILDER -->
            <template if:true={showOnboard}>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseModal} title="Close">
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title">Onboard new builder</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Builder division name" data-f="nbName" placeholder="Toll Brothers · Charlotte"></lightning-input>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium">Creates the division Account. Communities, BMG package codes, and POs hang off this record.</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <lightning-button label="Onboard builder" variant="brand" onclick={handleOnboardBuilder}></lightning-button>
                </footer>
            </template>

            <!-- NEW COMMUNITY -->
            <template if:true={showNewComm}>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseModal} title="Close">
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title">New community</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Community name" data-f="ncName" placeholder="Catawba Crossing Ph 1"></lightning-input>
                    <lightning-combobox label="Builder division" data-f="ncDiv" value="" options={builderOptions} class="slds-m-top_small" placeholder="Select division"></lightning-combobox>
                    <lightning-input label="Territory" data-f="ncTerr" placeholder="Charlotte" class="slds-m-top_small"></lightning-input>
                    <lightning-input label="BMG package code" data-f="ncBmg" placeholder="DRH-CLT-13" class="slds-m-top_small"></lightning-input>
                    <div class="slds-m-top_medium">
                        <label class="slds-checkbox">
                            <input type="checkbox" data-f="ncAqua" />
                            <span class="slds-checkbox_faux"></span>
                            <span class="slds-form-element__label">Aqua temporary irrigation active</span>
                        </label>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium">FM assignment is zone configuration (G6) and is never set here — it stays unassigned until Ops provides it.</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <lightning-button label="Create community" variant="brand" onclick={handleCreateCommunity}></lightning-button>
                </footer>
            </template>

            <!-- EMAIL -->
            <template if:true={showEmail}>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseModal} title="Close">
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title">Email · {emailCtx.label}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="To" data-f="emTo" placeholder="contact@builder.com"></lightning-input>
                    <lightning-combobox label="Template" value="" options={emailTemplateOptions} class="slds-m-top_small" onchange={handleEmailTpl}></lightning-combobox>
                    <lightning-input label="Subject" data-f="emSub" placeholder="Subject" class="slds-m-top_small"></lightning-input>
                    <lightning-textarea label="Body" data-f="emBody" placeholder="Plain language: what happened, what happens next, and when." class="slds-m-top_small"></lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                    <lightning-button label="Send email" variant="brand" onclick={handleSendEmail}></lightning-button>
                </footer>
            </template>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseModal}></div>
</template>

<!-- TOAST -->
<template if:true={showToast}>
    <div class="slds-notify_container slds-is-fixed cs-toast-wrap">
        <div class={toastCss} role="status">
            <span class="slds-assistive-text">Info</span>
            <span class="slds-icon_container slds-m-right_small slds-no-flex slds-align-top">
                <lightning-icon icon-name={toastIcon} size="small" alternative-text="toast"></lightning-icon>
            </span>
            <div class="slds-notify__content slds-grow">
                <p class="slds-text-body_regular">{toastMsg}</p>
            </div>
            <div class="slds-notify__close">
                <button class="slds-button slds-button_icon slds-button_icon-inverse" onclick={dismissToast} title="Close">
                    <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Close"></lightning-icon>
                </button>
            </div>
        </div>
    </div>
</template>

</template>
