<template>
    <div class="pipeline-shell">
        <div class="pipeline-header">
            <div class="pipeline-title-block">
                <div class="pipeline-mark">PO</div>
                <div>
                    <div class="pipeline-title">PO Pipeline Board</div>
                    <div class="pipeline-subtitle">{subtitle}</div>
                </div>
            </div>
            <div class="pipeline-actions">
                <span class="total-badge">{totalCount} records</span>
                <button type="button" class="btn btn-primary" onclick={handleNewPO}>+ New PO</button>
                <button class="pipe-btn" onclick={handleRefresh}>Refresh</button>
            </div>
        </div>

        <template if:true={hasError}>
            <div class="error-state">
                <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template if:false={loaded}>
            <div class="loading-state">
                <lightning-spinner alternative-text="Loading pipeline" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={loaded}>
            <div class="kanban-container">
                <template for:each={columns} for:item="col">
                    <div key={col.key} class="kanban-column">
                        <div class={col.headerClass}>
                            <span class="col-label">{col.label}</span>
                            <span class="col-count">{col.count}</span>
                        </div>
                        <div class="col-body">
                            <template for:each={col.cards} for:item="card">
                                <div key={card.id} class={card.cardClass} data-id={card.id} onclick={handleCardClick}>
                                    <div class="card-po-number">{card.name}</div>
                                    <div class="card-meta-row">
                                        <span class="card-builder">{card.builder}</span>
                                        <span class="card-lot">{card.lotName}</span>
                                    </div>
                                    <div class="card-status-label">{card.displayStatus}</div>
                                    <template if:true={card.takeoffStatus}>
                                        <div class="card-takeoff">Takeoff: {card.takeoffStatus}</div>
                                    </template>
                                    <template if:true={card.nextAction}>
                                        <div class="card-next-action">{card.nextAction}</div>
                                    </template>
                                    <div style="margin-top:6px">
                                        <button type="button" class="btn-inline" data-id={card.id} onclick={handleCardClick}>Open</button>
                                    </div>
                                </div>
                            </template>
                            <template if:false={col.hasCards}>
                                <div class="col-empty">No POs</div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
