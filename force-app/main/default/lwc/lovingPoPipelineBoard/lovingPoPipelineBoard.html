<template>
    <div>
        <!-- Page Header -->
        <div class="slds-page-header slds-page-header_record-home slds-m-bottom_small">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:purchase_order_item" size="large"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-meta">{recordEyebrow}</div>
                                <div class="slds-page-header__name-title">
                                    <h1 class="slds-page-header__title">{recordBannerTitle}</h1>
                                </div>
                                <template if:true={recordBannerSub}>
                                    <p class="slds-page-header__name-meta">{recordBannerSub}</p>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <div class="slds-button-group" role="group">
                                <template if:true={isTakeoffView}>
                                    <button type="button" class="slds-button slds-button_neutral" onclick={handleSaveTakeoffReadiness}>Save</button>
                                    <button type="button" class="slds-button slds-button_neutral" onclick={handleOpenTakeoffRecord}>Update Scope</button>
                                    <button type="button" class="slds-button slds-button_brand" onclick={handleCreateWorkOrder}>Create / Sync Children</button>
                                </template>
                                <template if:false={isTakeoffView}>
                                    <template if:true={isRecordContext}>
                                        <button type="button" class="slds-button slds-button_neutral" onclick={handleEditRecord}>Edit</button>
                                        <button type="button" class="slds-button slds-button_neutral" onclick={handleOpenPoRecord}>{recordButtonLabel}</button>
                                        <button type="button" class="slds-button slds-button_brand" onclick={handlePrimaryRecordAction}>{recordPrimaryActionLabel}</button>
                                    </template>
                                    <template if:false={isRecordContext}>
                                        <button type="button" class="slds-button slds-button_brand" onclick={handleNewPo}>+ New Builder PO</button>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- View switcher -->
        <div class="slds-button-group slds-m-bottom_small" role="group">
            <template for:each={views} for:item="view">
                <button type="button" key={view.id} class={view.className} data-id={view.id} onclick={handleViewChange} disabled={view.disabled}>{view.label}</button>
            </template>
        </div>

        <!-- Loading -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <!-- Action result banner -->
        <template if:true={actionResult}>
            <div class={validationBannerClass} role="alert">
                <span class="slds-assistive-text">Notice:</span>
                <strong>{validationIcon}</strong> {actionResult.message}
            </div>
        </template>

        <!-- Pipeline view -->
        <template if:true={isPipelineView}>
            <div class="slds-m-bottom_small">
                <div class="slds-scrollable_x">
                    <div class="slds-button-group slds-m-bottom_x-small" role="group">
                        <template for:each={stageFilters} for:item="filter">
                            <button type="button" key={filter.id} class={filter.className} data-value={filter.id} onclick={handleFilterClick}>
                                {filter.label} ({filter.count})
                            </button>
                        </template>
                    </div>
                </div>
                <div class="slds-grid slds-gutters_x-small slds-m-top_x-small">
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-combobox
                            label="Builder"
                            variant="label-hidden"
                            placeholder="All builders"
                            value={builderFilter}
                            options={builderOptions}
                            onchange={handleBuilderChange}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-input
                            label="Search"
                            variant="label-hidden"
                            type="search"
                            placeholder="Search PO, community, lot, item…"
                            value={searchTerm}
                            onchange={handleSearchInput}>
                        </lightning-input>
                    </div>
                </div>
            </div>

            <lightning-card title="Builder PO Queue" icon-name="standard:list">
                <div slot="actions">
                    <lightning-button variant="brand" label="+ New Builder PO" onclick={handleNewPo}></lightning-button>
                </div>
                <div class="slds-p-horizontal_small">
                    <template if:true={hasFilteredRecords}>
                        <div class="slds-scrollable_x">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">Builder PO</div></th>
                                        <th scope="col"><div class="slds-truncate">Builder</div></th>
                                        <th scope="col"><div class="slds-truncate">Community</div></th>
                                        <th scope="col"><div class="slds-truncate">Lot</div></th>
                                        <th scope="col"><div class="slds-truncate">Status</div></th>
                                        <th scope="col"><div class="slds-truncate">Pipeline Stage</div></th>
                                        <th scope="col"><div class="slds-truncate">Takeoff Status</div></th>
                                        <th scope="col"><div class="slds-truncate">Package Match</div></th>
                                        <th scope="col"><div class="slds-truncate">Total Amount</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={filteredRecords} for:item="po">
                                        <tr key={po.id} class="slds-hint-parent" data-id={po.id} onclick={handlePoSelect}>
                                            <td data-label="Builder PO">{po.name}</td>
                                            <td data-label="Builder">{po.builderName}</td>
                                            <td data-label="Community">{po.communityLabel}</td>
                                            <td data-label="Lot">{po.lotLabel}</td>
                                            <td data-label="Status">{po.status}</td>
                                            <td data-label="Pipeline Stage">{po.pipelineStage}</td>
                                            <td data-label="Takeoff Status">{po.takeoffStatus}</td>
                                            <td data-label="Package Match">{po.packageMatchStatus}</td>
                                            <td data-label="Total Amount">{po.amountFormatted}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={hasFilteredRecords}>
                        <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">
                            0 Builder PO rows match the current filters.
                        </div>
                    </template>
                </div>
            </lightning-card>
        </template>

        <!-- PO Detail view -->
        <template if:true={isPoDetailView}>
            <template if:true={hasPoDetail}>
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v cs-kpi-aqua">{selectedPo.pipelineStage}</div>
                            <div class="slds-text-title">Current stage</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v cs-kpi-green">{selectedPo.packageMatchStatus}</div>
                            <div class="slds-text-title">Package state</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v">{recordPrimaryRoute}</div>
                            <div class="slds-text-title">Primary route</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v cs-kpi-amber">{reviewHoldCount}</div>
                            <div class="slds-text-title">Review holds</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v">{selectedWorkOrderNumber}</div>
                            <div class="slds-text-title">Parent WO</div>
                        </div>
                    </div>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                        <lightning-card title="Builder PO Snapshot" icon-name="standard:opportunity">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Builder PO Number</dt>
                                    <dd class="slds-dl_horizontal__detail"><strong>{selectedPo.name}</strong></dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Purchase Order</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedPurchaseOrderLabel}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Parent Builder</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedPo.builderName}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Division Builder</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedPo.divisionName}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Community</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedPo.communityName}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Lot</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedPo.lotName}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Pipeline Stage</dt>
                                    <dd class="slds-dl_horizontal__detail"><span class={selectedPo.statusChipClass}>{selectedPo.pipelineStage}</span></dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Package Match</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedPo.packageMatchStatus}</dd>
                                </dl>
                            </div>
                        </lightning-card>

                        <lightning-card title="PO Lines and Package Context" icon-name="standard:product">
                            <div class="slds-p-horizontal_small slds-p-bottom_medium">
                                <div class="slds-scrollable_x">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col"><div class="slds-truncate">Description</div></th>
                                                <th scope="col"><div class="slds-truncate">Qty</div></th>
                                                <th scope="col"><div class="slds-truncate">Package</div></th>
                                                <th scope="col"><div class="slds-truncate">Execution Scope</div></th>
                                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={normalizedPoLines} for:item="line">
                                                <tr key={line.id} class="slds-hint-parent">
                                                    <td data-label="Description">{line.description}</td>
                                                    <td data-label="Qty">{line.quantity}</td>
                                                    <td data-label="Package">{line.packageMatch}</td>
                                                    <td data-label="Execution Scope">{line.workType}</td>
                                                    <td data-label="Status">{line.routingResult}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </lightning-card>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                        <lightning-card title="Next Actions" icon-name="standard:task">
                            <div class="slds-p-horizontal_small slds-p-bottom_medium">
                                <div class="po-flow-list">
                                    <template for:each={nextActionList} for:item="gate">
                                        <div key={gate.label} class={gate.className}>
                                            <div class="po-dot">{gate.icon}</div>
                                            <div>
                                                <div class="po-flow-title">{gate.label}</div>
                                                <div class="po-flow-sub">{gate.detail}</div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </lightning-card>

                        <lightning-card title="Customer Success" icon-name="standard:contact">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Review required</dt>
                                    <dd class="slds-dl_horizontal__detail">{customerSuccessReview}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Return required</dt>
                                    <dd class="slds-dl_horizontal__detail">{returnRequiredLabel}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Package variance</dt>
                                    <dd class="slds-dl_horizontal__detail">{packageVarianceLabel}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Builder question</dt>
                                    <dd class="slds-dl_horizontal__detail">{builderQuestionLabel}</dd>
                                </dl>
                            </div>
                        </lightning-card>
                    </div>
                </div>
            </template>
            <template if:false={hasPoDetail}>
                <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">
                    Select a Builder PO to view live detail.
                </div>
            </template>
        </template>

        <!-- Activity view -->
        <template if:true={isActivityView}>
            <template if:true={hasPoDetail}>
                <lightning-card title="Activity" icon-name="standard:log_a_call">
                    <template if:true={hasActivityRows}>
                        <template for:each={activityRows} for:item="row">
                            <div key={row.recordId} class="po-activity-row">
                                <div class={row.tone}></div>
                                <div class="po-activity-copy">
                                    <div class="po-activity-title">{row.label}</div>
                                    <div class="po-activity-detail">{row.detail}</div>
                                </div>
                                <div class="po-activity-side">
                                    <div class="po-activity-time">{row.whenLabel}</div>
                                    <template if:true={row.recordId}>
                                        <button type="button" class="slds-button slds-button_neutral" data-id={row.recordId} onclick={handleOpenActivityRecord}>Open</button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasActivityRows}>
                        <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">
                            0 activity records on this PO branch.
                        </div>
                    </template>
                </lightning-card>
            </template>
        </template>

        <!-- Takeoff view -->
        <template if:true={isTakeoffView}>
            <template if:true={hasTakeoff}>
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v cs-kpi-aqua">{takeoffLineCount}</div>
                            <div class="slds-text-title">Lines</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v cs-kpi-green">{takeoffRoutedCount}</div>
                            <div class="slds-text-title">Routed</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v cs-kpi-amber">{reviewHoldCount}</div>
                            <div class="slds-text-title">Review hold</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v">{blankScopeCount}</div>
                            <div class="slds-text-title">Blank scope</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-5">
                        <div class="slds-box slds-box_x-small cs-kpi-tile">
                            <div class="cs-kpi-v">{selectedChildWorkOrderCount}</div>
                            <div class="slds-text-title">Child WOs</div>
                        </div>
                    </div>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                        <lightning-card title="FM Takeoff Checklist" icon-name="standard:work_order">
                            <div class="slds-p-horizontal_small slds-p-bottom_medium">
                                <div class="slds-scrollable_x">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col"><div class="slds-truncate">Checklist Item</div></th>
                                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                                <th scope="col"><div class="slds-truncate">Notes</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={takeoffChecklistRows} for:item="row">
                                                <tr key={row.label} class="slds-hint-parent">
                                                    <td data-label="Checklist Item">{row.label}</td>
                                                    <td data-label="Status">{row.status}</td>
                                                    <td data-label="Notes">{row.notes}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </lightning-card>

                        <lightning-card title="Takeoff Lines" icon-name="standard:product">
                            <div class="slds-p-horizontal_small slds-p-bottom_medium">
                                <div class="slds-scrollable_x">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col"><div class="slds-truncate">Description</div></th>
                                                <th scope="col"><div class="slds-truncate">Qty</div></th>
                                                <th scope="col"><div class="slds-truncate">Unit</div></th>
                                                <th scope="col"><div class="slds-truncate">Execution Scope</div></th>
                                                <th scope="col"><div class="slds-truncate">Routing Result</div></th>
                                                <th scope="col"><div class="slds-truncate">Review</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={normalizedTakeoffLines} for:item="line">
                                                <tr key={line.id} class="slds-hint-parent">
                                                    <td data-label="Description">{line.description}</td>
                                                    <td data-label="Qty">{line.verifiedQuantity}</td>
                                                    <td data-label="Unit">{line.unit}</td>
                                                    <td data-label="Execution Scope">{line.executionScope}</td>
                                                    <td data-label="Routing Result">{line.routingResult}</td>
                                                    <td data-label="Review">{line.reviewStatus}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </lightning-card>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                        <lightning-card title="Routing Summary" icon-name="standard:route">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Install</dt>
                                    <dd class="slds-dl_horizontal__detail">{takeoffInstallCount} lines</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Aqua</dt>
                                    <dd class="slds-dl_horizontal__detail">{takeoffAquaCount} lines</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Review hold</dt>
                                    <dd class="slds-dl_horizontal__detail">{reviewHoldCount} lines</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Blank scope</dt>
                                    <dd class="slds-dl_horizontal__detail">{blankScopeCount} lines</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Children created</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedChildWorkOrderCount}</dd>
                                </dl>
                            </div>
                        </lightning-card>

                        <lightning-card title="Customer Success Review" icon-name="standard:contact">
                            <div class="slds-p-horizontal_small slds-p-bottom_medium">
                                <div class="po-qa-list">
                                    <template for:each={customerSuccessReviewItems} for:item="item">
                                        <div key={item} class="po-qa-item">{item}</div>
                                    </template>
                                </div>
                            </div>
                        </lightning-card>
                    </div>
                </div>
            </template>
            <template if:false={hasTakeoff}>
                <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">
                    0 takeoff records linked.
                </div>
            </template>
        </template>

        <!-- Work Orders view -->
        <template if:true={isWorkOrdersView}>
            <lightning-card title="Work Orders Created from Builder PO" icon-name="standard:work_order">
                <div class="slds-p-horizontal_small slds-p-bottom_medium">
                    <template if:true={hasWorkOrderRows}>
                        <div class="po-work-card-list">
                            <template for:each={workOrderRows} for:item="row">
                                <div key={row.id} class="po-work-card" data-po-id={row.id} onclick={handleWorkOrderRowSelect}>
                                    <div class="po-work-card-main">
                                        <div class="po-work-card-title">{row.name}</div>
                                        <div class="po-work-card-sub">{row.builderName} · {row.communityLabel} · {row.lotLabel}</div>
                                    </div>
                                    <div class="po-work-card-side">
                                        <span class={row.workOrderTone}>{row.workOrderState}</span>
                                        <span class="slds-text-color_success slds-text-body_small">{row.amountFormatted}</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:false={hasWorkOrderRows}>
                        <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">
                            0 downstream WorkOrders linked.
                        </div>
                    </template>
                </div>
            </lightning-card>
        </template>

        <!-- WO Detail view -->
        <template if:true={isWoDetailView}>
            <template if:true={hasWorkOrder}>
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                        <lightning-card title={selectedWorkOrder.workOrderNumber} icon-name="standard:work_order">
                            <div slot="actions">
                                <lightning-button label="Open WorkOrder" onclick={handleOpenWorkOrderRecord}></lightning-button>
                            </div>
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Subject</dt>
                                    <dd class="slds-dl_horizontal__detail"><strong>{selectedWorkOrder.subject}</strong></dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Description</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedWorkOrder.description}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Status</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedWorkOrder.status}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Field Manager</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedWorkOrder.fieldManagerName}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Work Type</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedWorkOrder.workType}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Territory</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedWorkOrder.serviceTerritoryName}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Scope Lines</dt>
                                    <dd class="slds-dl_horizontal__detail">{selectedWorkOrder.lineItemCount}</dd>
                                </dl>
                            </div>
                        </lightning-card>

                        <lightning-card title="Work Order Lines" icon-name="standard:product">
                            <div class="slds-p-horizontal_small slds-p-bottom_medium">
                                <div class="slds-scrollable_x">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col"><div class="slds-truncate">Description</div></th>
                                                <th scope="col"><div class="slds-truncate">Qty</div></th>
                                                <th scope="col"><div class="slds-truncate">Unit Price</div></th>
                                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={selectedWorkOrder.lines} for:item="line">
                                                <tr key={line.id} class="slds-hint-parent">
                                                    <td data-label="Description">{line.description}</td>
                                                    <td data-label="Qty">{line.quantity}</td>
                                                    <td data-label="Unit Price">{line.unitPrice}</td>
                                                    <td data-label="Status">{line.status}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </lightning-card>

                        <lightning-card title="Scheduling Handoff" icon-name="standard:service_appointment">
                            <div slot="actions">
                                <lightning-button label="Open Service Appointment" onclick={handleOpenServiceAppointmentRecord} disabled={disableOpenServiceAppointment}></lightning-button>
                            </div>
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Service Appointment</dt>
                                    <dd class="slds-dl_horizontal__detail">{serviceAppointmentNumber}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Status</dt>
                                    <dd class="slds-dl_horizontal__detail">{serviceAppointmentStatus}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Scheduled Start</dt>
                                    <dd class="slds-dl_horizontal__detail">{serviceAppointmentScheduledStart}</dd>
                                </dl>
                            </div>
                        </lightning-card>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                        <lightning-card title="WO Actions" icon-name="standard:task2">
                            <div class="slds-p-around_small">
                                <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                                        <lightning-button variant="brand" label="Create Schedule Handoff" onclick={handleCreateScheduleHandoff} disabled={disableCreateScheduleHandoff}></lightning-button>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                                        <lightning-button label="Open WorkOrder" onclick={handleOpenWorkOrderRecord}></lightning-button>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-button label="Open Service Appointment" onclick={handleOpenServiceAppointmentRecord} disabled={disableOpenServiceAppointment}></lightning-button>
                                    </div>
                                </div>
                            </div>
                        </lightning-card>
                    </div>
                </div>
            </template>
            <template if:false={hasWorkOrder}>
                <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">
                    0 WorkOrders linked to this Builder PO.
                </div>
            </template>
        </template>

        <!-- Status change modal -->
        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="po-modal-heading" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container" onclick={handleModalClick}>
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare-inverse"
                            size="large"
                            class="slds-modal__close"
                            onclick={handleCloseModal}>
                        </lightning-button-icon>
                        <h2 id="po-modal-heading" class="slds-modal__title slds-hyphenate">Move Builder PO</h2>
                        <p class="slds-m-top_x-small slds-text-body_small">Select the new status for this Builder PO.</p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox
                            label="Status"
                            value={modalNewStatus}
                            options={statusOptions}
                            onchange={handleStatusChange}>
                        </lightning-combobox>
                        <template if:true={modalError}>
                            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-top_small" role="alert">
                                {modalError}
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                        <lightning-button variant="brand" label={saveLabel} onclick={handleSaveValidation}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={handleModalBackdropClick}></div>
        </template>
    </div>
</template>
