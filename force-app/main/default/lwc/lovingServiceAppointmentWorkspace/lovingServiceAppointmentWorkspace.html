<template>
    <!-- Error state -->
    <template if:true={error}>
        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
            {errorMessage}
        </div>
    </template>

    <template if:true={hasData}>

        <!-- Page header -->
        <div class="slds-page-header slds-page-header_record-home slds-m-bottom_small">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:service_appointment" size="large"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <nav role="navigation">
                                <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
                                    <template for:each={crumbItems} for:item="crumb">
                                        <li key={crumb.value} class="slds-breadcrumb__item">
                                            <span>{crumb.value}</span>
                                        </li>
                                    </template>
                                </ol>
                            </nav>
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-text-color_weak slds-text-body_regular">Home Builder Scheduling</span>
                                        <span class="slds-page-header__title">{header.appointmentNumber}</span>
                                    </h1>
                                </div>
                            </div>
                            <div class="slds-m-top_xx-small">
                                <template for:each={headerMetaItems} for:item="item">
                                    <span key={item.key} class={item.className}>{item.value}</span>
                                    &nbsp;
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button-group>
                                <lightning-button label="Edit" onclick={handleEditAppointment}></lightning-button>
                                <lightning-button label="Email" onclick={handleEmail} disabled={disableEmail}></lightning-button>
                                <lightning-button label="Call" onclick={handleCall} disabled={disableCall}></lightning-button>
                                <lightning-button label="Log Call" onclick={handleLogCall}></lightning-button>
                                <lightning-button label="New Task" onclick={handleNewTask}></lightning-button>
                                <lightning-button label="Add Note" onclick={handleNewNote}></lightning-button>
                                <lightning-button label="Files" onclick={handleOpenFiles}></lightning-button>
                            </lightning-button-group>
                        </div>
                        <div class="slds-page-header__control slds-m-left_x-small">
                            <lightning-button-group>
                                <lightning-button label="Open Account" onclick={openAccount} disabled={disableOpenAccount}></lightning-button>
                                <lightning-button label="Open Contact" onclick={openContact} disabled={disableOpenContact}></lightning-button>
                                <lightning-button label="Schedule Event" onclick={handleNewEvent}></lightning-button>
                                <lightning-button label="Open Work Order" onclick={openWorkOrder} disabled={disableOpenWorkOrder}></lightning-button>
                                <lightning-button label="Create Calendar Event" onclick={openCalendarEvent}></lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- KPI strip -->
        <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
            <template for:each={visionKpis} for:item="kpi">
                <div key={kpi.label} class="slds-col slds-size_1-of-2 slds-large-size_1-of-6 slds-m-bottom_x-small">
                    <div class="slds-box slds-box_x-small cs-kpi-tile">
                        <div class="cs-kpi-v">{kpi.value}</div>
                        <div class="slds-text-title slds-m-top_xx-small">{kpi.label}</div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Tab navigation -->
        <div class="slds-button-group slds-m-bottom_small" role="group">
            <template for:each={tabs} for:item="tab">
                <button key={tab.id} class={tab.className} data-id={tab.id} onclick={handleTab}>{tab.label}</button>
            </template>
        </div>

        <!-- Tab panels -->

        <!-- Overview tab -->
        <template if:true={showOverview}>
            <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-card title="Overview" icon-name="utility:summary" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <dl class="slds-dl_horizontal">
                                <template for:each={overviewRows} for:item="row">
                                    <dt key={row.label} class="slds-dl_horizontal__label slds-text-color_weak">{row.label}</dt>
                                    <dd key={row.label} class="slds-dl_horizontal__detail">{row.value}</dd>
                                </template>
                            </dl>
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-card title="Execution Chain" icon-name="utility:flow" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <dl class="slds-dl_horizontal">
                                <template for:each={typeRows} for:item="row">
                                    <dt key={row.label} class="slds-dl_horizontal__label slds-text-color_weak">{row.label}</dt>
                                    <dd key={row.label} class="slds-dl_horizontal__detail">{row.value}</dd>
                                </template>
                            </dl>
                        </div>
                    </lightning-card>
                </div>
            </div>
        </template>

        <!-- Crew + Route tab -->
        <template if:true={showCrew}>
            <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-card title="Crew + Route" icon-name="utility:routing_offline" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <template for:each={routeTimeline} for:item="row">
                                <div key={row.label} class="sa-timeline-row slds-m-bottom_x-small">
                                    <span class={row.dotClass}>{row.shortLabel}</span>
                                    <div class="slds-m-left_small">
                                        <div class="slds-text-body_regular">{row.label}</div>
                                        <div class="slds-text-color_weak slds-text-body_small">{row.value}</div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-card title="Route Detail" icon-name="utility:routing" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <dl class="slds-dl_horizontal">
                                <template for:each={executionRows} for:item="row">
                                    <dt key={row.label} class="slds-dl_horizontal__label slds-text-color_weak">{row.label}</dt>
                                    <dd key={row.label} class="slds-dl_horizontal__detail">{row.value}</dd>
                                </template>
                            </dl>
                        </div>
                    </lightning-card>
                </div>
            </div>
        </template>

        <!-- Parent Work Order tab -->
        <template if:true={showBuilder}>
            <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-card title="Parent Work Order Context" icon-name="utility:work_order" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <dl class="slds-dl_horizontal">
                                <template for:each={builderRows} for:item="row">
                                    <dt key={row.label} class="slds-dl_horizontal__label slds-text-color_weak">{row.label}</dt>
                                    <dd key={row.label} class="slds-dl_horizontal__detail">{row.value}</dd>
                                </template>
                            </dl>
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-card title="Recent Activity" icon-name="utility:activity" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <template for:each={activityRows} for:item="row">
                                <div key={row.label} class="sa-activity-row slds-m-bottom_x-small">
                                    <div class="sa-dot sa-dot-blue">•</div>
                                    <div class="slds-m-left_small slds-truncate">
                                        <div class="slds-text-body_regular">{row.label}</div>
                                        <div class="slds-text-color_weak slds-text-body_small">{row.detail}</div>
                                    </div>
                                    <div class="slds-text-color_weak slds-text-body_small slds-m-left_auto">{row.whenLabel}</div>
                                </div>
                            </template>
                        </div>
                    </lightning-card>
                </div>
            </div>
        </template>

        <!-- Proof + Closeout tab -->
        <template if:true={showProof}>
            <lightning-card title="Proof + Closeout" icon-name="utility:check" class="slds-m-bottom_small">
                <div class="slds-card__body slds-card__body_inner">
                    <dl class="slds-dl_horizontal">
                        <template for:each={proofRows} for:item="row">
                            <dt key={row.label} class="slds-dl_horizontal__label slds-text-color_weak">{row.label}</dt>
                            <dd key={row.label} class="slds-dl_horizontal__detail">{row.value}</dd>
                        </template>
                    </dl>
                </div>
            </lightning-card>
        </template>

        <!-- Activity tab -->
        <template if:true={showActivity}>
            <lightning-card title="Activity" icon-name="utility:activity" class="slds-m-bottom_small">
                <div class="slds-card__body slds-card__body_inner">
                    <template for:each={activityRows} for:item="row">
                        <div key={row.label} class="sa-activity-row slds-m-bottom_x-small">
                            <div class="sa-dot sa-dot-blue">•</div>
                            <div class="slds-m-left_small slds-truncate">
                                <div class="slds-text-body_regular">{row.label}</div>
                                <div class="slds-text-color_weak slds-text-body_small">{row.detail}</div>
                            </div>
                            <div class="slds-text-color_weak slds-text-body_small slds-m-left_auto">{row.whenLabel}</div>
                        </div>
                    </template>
                </div>
            </lightning-card>
        </template>

    </template>
</template>
