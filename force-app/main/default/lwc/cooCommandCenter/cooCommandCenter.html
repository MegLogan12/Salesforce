<template>
    <div class="slds-p-around_medium">

        <!-- KPI Header Row -->
        <template if:true={kpis}>
            <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_small">Active WOs</p>
                        <p class="slds-text-heading_large">{kpis.activeWOs}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_small">Scheduled Today</p>
                        <p class="slds-text-heading_large">{kpis.scheduledToday}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_small">Pending Proposals</p>
                        <p class="slds-text-heading_large">{kpis.pendingProposals}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_small">Pending Closeout</p>
                        <p class="slds-text-heading_large">{kpis.pendingCloseout}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_small">Paid This Month</p>
                        <p class="slds-text-heading_large">{kpis.paidThisMonth}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_small">Open Escalations</p>
                        <p class="slds-text-heading_large">{kpis.openEscalations}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_small">Open Hire Requests</p>
                        <p class="slds-text-heading_large">{kpis.openHireRequests}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-m-bottom_small">
                    <div class="slds-box slds-text-align_center">
                        <p class="slds-text-heading_small">Site Readiness Overdue</p>
                        <p class="slds-text-heading_large">{kpis.siteReadinessOverdue}</p>
                    </div>
                </div>
            </div>
        </template>

        <lightning-tabset>

            <!-- ── OVERVIEW TAB ── -->
            <lightning-tab label="Overview" value="overview">
                <div class="slds-grid slds-gutters slds-m-top_medium">

                    <!-- WO Pipeline -->
                    <div class="slds-col slds-size_1-of-2">
                        <div class="slds-card">
                            <div class="slds-card__header slds-grid">
                                <h2 class="slds-card__header-title">WO Pipeline by Status</h2>
                            </div>
                            <div class="slds-card__body">
                                <template if:true={pipeline}>
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                        <thead>
                                            <tr>
                                                <th>Status</th>
                                                <th class="slds-text-align_right">Count</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={pipeline} for:item="row">
                                                <tr key={row.status}>
                                                    <td>{row.status}</td>
                                                    <td class="slds-text-align_right">{row.count}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- GP Summary -->
                    <div class="slds-col slds-size_1-of-2">
                        <template if:true={gpSummary}>
                            <div class="slds-card">
                                <div class="slds-card__header slds-grid">
                                    <h2 class="slds-card__header-title">GP Summary</h2>
                                </div>
                                <div class="slds-card__body slds-p-around_medium">
                                    <div class="slds-grid slds-gutters">
                                        <div class="slds-col slds-text-align_center">
                                            <p class="slds-text-color_success slds-text-heading_small">Green</p>
                                            <p class="slds-text-heading_large">{gpSummary.greenCount}</p>
                                        </div>
                                        <div class="slds-col slds-text-align_center">
                                            <p class="slds-text-heading_small" style="color:#f4bc25">Yellow</p>
                                            <p class="slds-text-heading_large">{gpSummary.yellowCount}</p>
                                        </div>
                                        <div class="slds-col slds-text-align_center">
                                            <p class="slds-text-color_error slds-text-heading_small">Red</p>
                                            <p class="slds-text-heading_large">{gpSummary.redCount}</p>
                                        </div>
                                        <div class="slds-col slds-text-align_center">
                                            <p class="slds-text-heading_small" style="color:#706e6b">Blocked</p>
                                            <p class="slds-text-heading_large">{gpSummary.blockedCount}</p>
                                        </div>
                                    </div>
                                    <p class="slds-m-top_small slds-text-align_center">
                                        Pending Revenue: {gpSummary.totalRevenuePendingFormatted}
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>

                </div>
            </lightning-tab>

            <!-- ── BY DIVISION TAB ── -->
            <lightning-tab label="By Division" value="division">
                <div class="slds-m-top_medium">
                    <template if:true={showDivisionBanner}>
                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                            <span class="slds-assistive-text">warning</span>
                            <lightning-icon icon-name="utility:warning" alternative-text="warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Values populate after DivisionKpiRecalcBatch runs nightly.
                        </div>
                    </template>
                    <template if:true={divisions}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                            <thead>
                                <tr>
                                    <th>Division</th>
                                    <th class="slds-text-align_right">Rev T12M</th>
                                    <th class="slds-text-align_right">GP%</th>
                                    <th class="slds-text-align_right">Open WOs</th>
                                    <th class="slds-text-align_right">On-Time%</th>
                                    <th class="slds-text-align_right">Communities</th>
                                    <th class="slds-text-align_right">Lots</th>
                                    <th class="slds-text-align_right">Open POs</th>
                                    <th class="slds-text-align_right">Warranties</th>
                                    <th class="slds-text-align_right">NFIs</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={divisions} for:item="div">
                                    <tr key={div.accountId}>
                                        <td>{div.divisionName}</td>
                                        <td class="slds-text-align_right">{div.revenueT12MFormatted}</td>
                                        <td class="slds-text-align_right">{div.gpPctFormatted}</td>
                                        <td class="slds-text-align_right">{div.openWoCount}</td>
                                        <td class="slds-text-align_right">{div.onTimePctFormatted}</td>
                                        <td class="slds-text-align_right">{div.activeCommunities}</td>
                                        <td class="slds-text-align_right">{div.activeLots}</td>
                                        <td class="slds-text-align_right">{div.openPoCount}</td>
                                        <td class="slds-text-align_right">{div.openWarrantyCount}</td>
                                        <td class="slds-text-align_right">{div.openNfiCount}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                </div>
            </lightning-tab>

            <!-- ── EXCEPTIONS TAB ── -->
            <lightning-tab label="Exceptions" value="exceptions">
                <div class="slds-m-top_medium">
                    <template if:true={kpis}>
                        <div class="slds-grid slds-gutters slds-wrap">
                            <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium">
                                <div class="slds-card">
                                    <div class="slds-card__header">
                                        <h2 class="slds-card__header-title">Pending Closeout WOs</h2>
                                    </div>
                                    <div class="slds-card__body slds-p-around_medium slds-text-align_center">
                                        <p class="slds-text-heading_large">{kpis.pendingCloseout}</p>
                                        <a href="/lightning/o/WorkOrder/list?filterName=Pending_Closeout" target="_blank" class="slds-m-top_small">View in Console</a>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium">
                                <div class="slds-card">
                                    <div class="slds-card__header">
                                        <h2 class="slds-card__header-title">Open Escalations</h2>
                                    </div>
                                    <div class="slds-card__body slds-p-around_medium slds-text-align_center">
                                        <p class="slds-text-heading_large">{kpis.openEscalations}</p>
                                        <a href="/lightning/o/Task/list?filterName=Open_Escalations" target="_blank" class="slds-m-top_small">View in Console</a>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-3 slds-m-bottom_medium">
                                <div class="slds-card">
                                    <div class="slds-card__header">
                                        <h2 class="slds-card__header-title">Site Readiness Overdue</h2>
                                    </div>
                                    <div class="slds-card__body slds-p-around_medium slds-text-align_center">
                                        <p class="slds-text-heading_large">{kpis.siteReadinessOverdue}</p>
                                        <a href="/lightning/o/Task/list?filterName=Site_Readiness_Overdue" target="_blank" class="slds-m-top_small">View in Console</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </lightning-tab>

            <!-- ── GATES TAB ── -->
            <lightning-tab label="Gates" value="gates">
                <div class="slds-m-top_medium">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th>Gate</th>
                                <th>Owner</th>
                                <th>Action Required</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={gates} for:item="gate">
                                <tr key={gate.id}>
                                    <td>
                                        <strong>{gate.id}</strong>
                                        <p class="slds-text-body_small">{gate.label}</p>
                                    </td>
                                    <td>{gate.owner}</td>
                                    <td>{gate.action}</td>
                                    <td>
                                        <lightning-button
                                            label="Escalate"
                                            variant="destructive-text"
                                            data-gate-id={gate.id}
                                            onclick={handleEscalate}>
                                        </lightning-button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </lightning-tab>

        </lightning-tabset>
    </div>
</template>
