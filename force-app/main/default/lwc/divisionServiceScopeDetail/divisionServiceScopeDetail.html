<template>
    <template lwc:if={isLoaded}>

        <!-- Scope of Work -->
        <lightning-card title="Scope of Work" icon-name="utility:description" class="slds-m-bottom_small">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Scope Summary</dt>
                    <dd class="slds-dl_horizontal__detail">{scopeSummary}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Home Types</dt>
                    <dd class="slds-dl_horizontal__detail">{homeTypes}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Scope Applies To</dt>
                    <dd class="slds-dl_horizontal__detail">{scopeApplies}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Scope of Work Source</dt>
                    <dd class="slds-dl_horizontal__detail">{scopeSource}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Cost Categories</dt>
                    <dd class="slds-dl_horizontal__detail">{scopeCats}</dd>
                </dl>
            </div>
        </lightning-card>

        <!-- Scheduling Rules -->
        <lightning-card title="Scheduling Rules" icon-name="utility:event" class="slds-m-bottom_small">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Scheduling Lead Time</dt>
                    <dd class="slds-dl_horizontal__detail">{schedLead}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Service Call Response</dt>
                    <dd class="slds-dl_horizontal__detail">{svcRespHrs}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Lot Readiness Approver</dt>
                    <dd class="slds-dl_horizontal__detail">{lotReadyApprover}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Lot Release Trigger</dt>
                    <dd class="slds-dl_horizontal__detail">{lotReleaseTrigger}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Utility Locate Lead Time</dt>
                    <dd class="slds-dl_horizontal__detail">{utilLocate}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">FWO Required (Out of Scope)</dt>
                    <dd class="slds-dl_horizontal__detail"><span class={fwoChip}>{fwoOos}</span></dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Seasonal Tree Lead Time Notes</dt>
                    <dd class="slds-dl_horizontal__detail">{seasonalTree}</dd>
                </dl>
                <p class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Job Duration Estimates</p>
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">SFD Small</dt>
                    <dd class="slds-dl_horizontal__detail">{durSfdSm}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">SFD Large</dt>
                    <dd class="slds-dl_horizontal__detail">{durSfdLg}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Condo</dt>
                    <dd class="slds-dl_horizontal__detail">{durCondo}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Townhome</dt>
                    <dd class="slds-dl_horizontal__detail">{durTownhome}</dd>
                </dl>
            </div>
        </lightning-card>

        <!-- Site Rules -->
        <lightning-card title="Site Rules" icon-name="utility:location" class="slds-m-bottom_small">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">English-Speaking Crew</dt>
                    <dd class="slds-dl_horizontal__detail"><span class={englishCrewChip}>{englishCrew}</span></dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Speed Limit</dt>
                    <dd class="slds-dl_horizontal__detail">{speedLimit}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Staging Area Rule</dt>
                    <dd class="slds-dl_horizontal__detail">{stagingRule}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Pine Straw or Mulch</dt>
                    <dd class="slds-dl_horizontal__detail">{pineMulch}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Drainage Standard</dt>
                    <dd class="slds-dl_horizontal__detail">{drainageStd}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Erosion Control Rule</dt>
                    <dd class="slds-dl_horizontal__detail">{erosionRule}</dd>
                </dl>
            </div>
        </lightning-card>

        <!-- Warranty & Repair Policies -->
        <lightning-card title="Warranty &amp; Repair Policies" icon-name="utility:shield" class="slds-m-bottom_small">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Warranty Program</dt>
                    <dd class="slds-dl_horizontal__detail">{warrantyPgm}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Warranty Period</dt>
                    <dd class="slds-dl_horizontal__detail">{warrantyPeriod}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Punch Response Window</dt>
                    <dd class="slds-dl_horizontal__detail">{punchDays}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Foundation Water Tolerance</dt>
                    <dd class="slds-dl_horizontal__detail">{foundWaterTol}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Swale Tolerance</dt>
                    <dd class="slds-dl_horizontal__detail">{swaleTol}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Plant Health Warranty</dt>
                    <dd class="slds-dl_horizontal__detail">{plantHealth}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Drainage Warranty Policy</dt>
                    <dd class="slds-dl_horizontal__detail">{drainageWp}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Reseed Policy</dt>
                    <dd class="slds-dl_horizontal__detail">{reseedPol}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Erosion / Gully Repair Policy</dt>
                    <dd class="slds-dl_horizontal__detail">{erosionGully}</dd>
                </dl>
            </div>
        </lightning-card>

        <!-- Care & Notes -->
        <lightning-card title="Care &amp; Notes" icon-name="utility:note">
            <div class="slds-card__body slds-card__body_inner">
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Care Guide Required</dt>
                    <dd class="slds-dl_horizontal__detail"><span class={careGuideChip}>{careGuide}</span></dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Additional Scope Notes</dt>
                    <dd class="slds-dl_horizontal__detail">{additionalNotes}</dd>
                </dl>
            </div>
        </lightning-card>

    </template>
    <template lwc:if={hasError}>
        <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">Unable to load scope data.</div>
    </template>
</template>
