<template>
    <div class="wrap">
        <h3 class="ttl">QI Inspection</h3>
        <div class="thresh">
            <table>
                <thead><tr><th>Score Range</th><th>Dashboard</th><th>Outcome</th></tr></thead>
                <tbody>
                    <template for:each={thresholds} for:item="t">
                        <tr key={t.range}>
                            <td>{t.range}</td>
                            <td>{t.dashboard}</td>
                            <td>{t.outcome}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <template lwc:if={hasInspection}>
            <div class="ins">
                <div class="row"><span class="lbl">FM</span><span class="v">{payload.inspection.fm}</span></div>
                <div class="row"><span class="lbl">Overall Score</span><span class="v">{payload.inspection.overallScore}</span></div>
                <div class="row"><span class="lbl">Status</span><span class="v">{payload.inspection.status}</span></div>
            </div>
            <div class="qi-grid">
                <template for:each={lineItems} for:item="l">
                    <div key={l.id} class={l.rowClass}>
                        <div class="left">
                            <template lwc:if={l.foremanPhotoUrl}>
                                <a href={l.foremanPhotoUrl} target="_blank" rel="noopener">View Foreman Photo</a>
                            </template>
                            <template lwc:else>
                                <span class="muted">No foreman photo</span>
                            </template>
                        </div>
                        <div class="right">
                            <div class="row"><span class="lbl">FM Score</span><span class="v">{l.fmScore}</span></div>
                            <div class="row"><span class="lbl">FM Note</span><span class="v">{l.fmNote}</span></div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        <template lwc:else>
            <div class="empty">QI Inspection not yet submitted.</div>
        </template>
    </div>
</template>
