<template>
    <lightning-card title="Quality Inspection" icon-name="standard:process">

        <template lwc:if={isLoading}>
            <div class="slds-is-relative" style="height:4rem">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:else>

            <template lwc:if={hasNoInspection}>
                <div class="slds-p-around_medium slds-text-color_weak">
                    No Quality Inspection record for this Work Order.
                </div>
            </template>

            <template lwc:else>
                <div class="slds-p-around_medium">

                    <div class="slds-m-bottom_small">
                        <span class={resultBadgeClass}>{inspection.Result__c}</span>
                        <span class="slds-m-left_x-small slds-text-body_small slds-text-color_weak">
                            {inspection.Passed_Lines__c}/{inspection.Total_Lines__c} items passing
                            &bull; Avg score: {inspection.Avg_Score__c}
                        </span>
                    </div>

                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" style="width:30%">Item</th>
                                <th scope="col" style="width:20%">Category</th>
                                <th scope="col" style="width:15%">Score (1–10)</th>
                                <th scope="col" style="width:10%">Result</th>
                                <th scope="col" style="width:25%">Note</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={lines} for:item="line">
                                <tr key={line.Id}>
                                    <td>{line.Item__c}</td>
                                    <td>{line.Category__c}</td>
                                    <td>
                                        <lightning-input
                                            type="number" min="1" max="10" step="1"
                                            value={line.Score__c}
                                            data-id={line.Id}
                                            onchange={handleScoreChange}
                                            variant="label-hidden"
                                            label="Score">
                                        </lightning-input>
                                    </td>
                                    <td>
                                        <span class={line.resultClass}>{line.Result__c}</span>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="text"
                                            value={line.Note__c}
                                            data-id={line.Id}
                                            onchange={handleNoteChange}
                                            variant="label-hidden"
                                            label="Note">
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>

                    <div class="slds-m-top_medium">
                        <lightning-button
                            label="Save Scores"
                            variant="brand"
                            onclick={handleSave}
                            disabled={isSaving}>
                        </lightning-button>
                        <template lwc:if={saveError}>
                            <p class="slds-text-color_error slds-m-top_x-small">{saveError}</p>
                        </template>
                    </div>

                </div>
            </template>

        </template>

    </lightning-card>
</template>
