<template>
    <template lwc:if={hasData}>
        <div class="slds-p-around_small">

            <!-- Page Header -->
            <div class="slds-page-header slds-page-header_record-home slds-m-bottom_small">
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__body">
                                <div class="slds-page-header__name">
                                    <div class="slds-page-header__name-title">
                                        <span class="slds-text-title_caps slds-text-color_weak">Outdoor Living · Opportunity 360</span>
                                        <h1 class="slds-page-header__title slds-truncate">{opportunityRecord.Name}</h1>
                                    </div>
                                </div>
                                <template lwc:if={heroSubtitle}>
                                    <p class="slds-text-body_regular slds-text-color_weak">{heroSubtitle}</p>
                                </template>
                                <div class="slds-m-top_x-small">
                                    <span class="slds-badge slds-m-right_x-small">Design Build</span>
                                    <span class="slds-badge">{opportunityRecord.StageName}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="slds-page-header__col-actions">
                        <div class="slds-page-header__controls">
                            <div class="slds-page-header__control">
                                <div class="slds-button-group" style="flex-wrap:wrap;gap:4px;">
                                    <button class="slds-button slds-button_neutral" onclick={handleEmailHomeowner} disabled={disableEmail}>Email</button>
                                    <button class="slds-button slds-button_neutral" onclick={handleCallHomeowner} disabled={disableCall}>Call</button>
                                    <button class="slds-button slds-button_neutral" onclick={handleLogCall}>Log Call</button>
                                    <button class="slds-button slds-button_neutral" onclick={handleNewTask}>New Task</button>
                                    <button class="slds-button slds-button_neutral" onclick={handleNewEvent}>Schedule Event</button>
                                    <button class="slds-button slds-button_neutral" onclick={handleNewNote}>Add Note</button>
                                    <button class="slds-button slds-button_neutral" onclick={handleOpenAccount}>Open Account</button>
                                    <template lwc:if={hasProperty}>
                                        <button class="slds-button slds-button_neutral" onclick={handleOpenProperty}>Open Property</button>
                                    </template>
                                    <button class="slds-button slds-button_neutral" onclick={handleEditOpportunity}>Edit</button>
                                    <template lwc:if={showNextStageAction}>
                                        <button class="slds-button slds-button_brand" onclick={handleNextStage}>Next Stage</button>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- KPI Tiles -->
            <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_x-small">
                    <div class="slds-box slds-box_x-small cs-kpi-tile">
                        <div class="cs-kpi-v">{quotesCount}</div>
                        <div class="slds-text-title_caps slds-text-color_weak">Quotes</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_x-small">
                    <div class="slds-box slds-box_x-small cs-kpi-tile">
                        <div class="cs-kpi-v">{notesCount}</div>
                        <div class="slds-text-title_caps slds-text-color_weak">Notes</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_x-small">
                    <div class="slds-box slds-box_x-small cs-kpi-tile">
                        <div class="cs-kpi-v">{filesCount}</div>
                        <div class="slds-text-title_caps slds-text-color_weak">Files</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_x-small">
                    <div class="slds-box slds-box_x-small cs-kpi-tile">
                        <div class="cs-kpi-v">{openItemsCount}</div>
                        <div class="slds-text-title_caps slds-text-color_weak">Open Items</div>
                    </div>
                </div>
            </div>

            <!-- Opportunity Path -->
            <template lwc:if={hasStagePath}>
                <lightning-card title="Opportunity Path" class="slds-m-bottom_small">
                    <div slot="actions">
                        <button class="slds-button slds-button_neutral" type="button" onclick={handleEditOpportunity}>Edit Stage</button>
                    </div>
                    <div class="slds-p-around_small" style="display:flex;flex-wrap:wrap;gap:4px;">
                        <template for:each={stagePathItems} for:item="step">
                            <button type="button" key={step.label} class={step.className} data-stage={step.label} disabled={step.disabled} onclick={handleSelectStage}>{step.label}</button>
                        </template>
                    </div>
                </lightning-card>
            </template>

            <!-- Opportunity Snapshot -->
            <lightning-card title="Opportunity Snapshot" class="slds-m-bottom_small">
                <div slot="actions">
                    <button class="slds-button slds-button_neutral" type="button" onclick={handleEditOpportunity}>Edit Snapshot</button>
                    <button class="slds-button slds-button_neutral" type="button" onclick={handleOpenAccount}>Open Account</button>
                </div>
                <dl class="slds-dl_horizontal slds-p-around_small">
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Opportunity Name</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{opportunityRecord.Name}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Account</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small"><a href={accountUrl}>{accountName}</a></dd>
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Record Type</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">Design Build</dd>
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Stage</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{opportunityRecord.StageName}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Estimated Amount</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{formattedAmount}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Close Date</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{opportunityRecord.CloseDate}</dd>
                    <template lwc:if={hasVoucher}>
                        <dt class="slds-dl_horizontal__label slds-text-title_caps">Voucher</dt>
                        <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small"><a href={pageData.voucherRecord.url}>{pageData.voucherRecord.label}</a></dd>
                    </template>
                </dl>
            </lightning-card>

            <!-- Discovery Summary -->
            <lightning-card title="Discovery Summary" class="slds-m-bottom_small">
                <div slot="actions">
                    <button class="slds-button slds-button_neutral" type="button" onclick={handleEditOpportunity}>Edit Discovery</button>
                </div>
                <dl class="slds-dl_horizontal slds-p-around_small">
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Project Vision</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{projectVision}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Budget Comfort</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{budgetComfort}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Decision Makers</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{decisionMakers}</dd>
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Timeline</dt>
                    <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{timelineValue}</dd>
                </dl>
            </lightning-card>

            <!-- Site Visit and Scope -->
            <lightning-card title="Site Visit and Scope" class="slds-m-bottom_small">
                <div slot="actions">
                    <button class="slds-button slds-button_neutral" type="button" onclick={handleNewTask}>New Follow-Up</button>
                    <button class="slds-button slds-button_neutral" type="button" onclick={handleLogCall}>Log Call</button>
                </div>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Item</div></th>
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Status</div></th>
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Owner</div></th>
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Date</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="slds-hint-parent">
                                <td>Next Follow-Up</td>
                                <td>{nextTaskStatus}</td>
                                <td>{opportunityRecord.Owner.Name}</td>
                                <td>{pageData.nextFollowUpDate}</td>
                            </tr>
                            <template for:each={siteVisitRows} for:item="row">
                                <tr key={row.id} class="slds-hint-parent">
                                    <td>{row.label}</td>
                                    <td>{row.status}</td>
                                    <td>{row.interactionType}</td>
                                    <td>{row.dateText}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </lightning-card>

            <!-- Activity and Next Follow-Up -->
            <lightning-card title="Activity and Next Follow-Up" class="slds-m-bottom_small">
                <div slot="actions">
                    <button class="slds-button slds-button_neutral" type="button" onclick={handleLogCall}>Log Call</button>
                    <button class="slds-button slds-button_neutral" type="button" onclick={handleNewTask}>New Task</button>
                    <button class="slds-button slds-button_neutral" type="button" onclick={handleNewEvent}>Schedule Event</button>
                </div>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Last Activity</div></th>
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Date</div></th>
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Voicemail</div></th>
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Next Task</div></th>
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Due</div></th>
                                <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Owner</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="slds-hint-parent">
                                <td>{lastAction}</td>
                                <td>{lastActionDate}</td>
                                <td>{voicemailStatus}</td>
                                <td>{pageData.nextFollowUpSubject}</td>
                                <td>{pageData.nextFollowUpDate}</td>
                                <td>{opportunityRecord.Owner.Name}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </lightning-card>

            <!-- Estimate + Related Property (two-up) -->
            <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-card title="Estimate" data-focus-section="activity">
                        <div slot="actions">
                            <button class="slds-button slds-button_neutral" type="button" onclick={handleOpenQuote}>Open Estimate</button>
                            <button class="slds-button slds-button_neutral" type="button" onclick={handleEditOpportunity}>Edit Estimate</button>
                        </div>
                        <dl class="slds-dl_horizontal slds-p-around_small">
                            <dt class="slds-dl_horizontal__label slds-text-title_caps">Estimate Status</dt>
                            <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{estimateStatus}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-title_caps">Projected Cost</dt>
                            <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{projectedCost}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-title_caps">Projected Price</dt>
                            <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{formattedAmount}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-title_caps">Estimator</dt>
                            <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{opportunityRecord.Owner.Name}</dd>
                        </dl>
                    </lightning-card>
                </div>
                <template lwc:if={hasProperty}>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-card title="Related Property">
                            <div slot="actions">
                                <button class="slds-button slds-button_neutral" type="button" onclick={handleOpenProperty}>Open Property</button>
                                <button class="slds-button slds-button_neutral" type="button" onclick={handleOpenAccount}>Open Account</button>
                            </div>
                            <dl class="slds-dl_horizontal slds-p-around_small">
                                <dt class="slds-dl_horizontal__label slds-text-title_caps">Property</dt>
                                <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small"><a href={pageData.propertyRecord.url}>{pageData.propertyRecord.label}</a></dd>
                                <dt class="slds-dl_horizontal__label slds-text-title_caps">Community</dt>
                                <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{pageData.propertyRecord.status}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-title_caps">Lot</dt>
                                <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{pageData.propertyRecord.subtext}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-title_caps">Homeowner</dt>
                                <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{pageData.propertyRecord.secondaryText}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-title_caps">Property Description</dt>
                                <dd class="slds-dl_horizontal__detail slds-m-bottom_x-small">{pageData.propertyRecord.notesPreview}</dd>
                            </dl>
                        </lightning-card>
                    </div>
                </template>
            </div>

            <!-- Notes -->
            <lightning-card title="Notes" class="slds-m-bottom_small" data-focus-section="notes">
                <template lwc:if={hasNotesSectionRows}>
                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Note</div></th>
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Description</div></th>
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Type</div></th>
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Updated</div></th>
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Open</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={notesSectionRows} for:item="row">
                                    <tr key={row.id} class="slds-hint-parent">
                                        <td>{row.label}</td>
                                        <td>{row.notesPreview}</td>
                                        <td>{row.subtext}</td>
                                        <td>{row.dateText}</td>
                                        <td><a href={row.url}>Open</a></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else><div></div></template>
            </lightning-card>

            <!-- Files and Photos -->
            <lightning-card title="Files and Photos" class="slds-m-bottom_small">
                <template lwc:if={hasFiles}>
                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">File</div></th>
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Type</div></th>
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Updated</div></th>
                                    <th scope="col" class="slds-text-title_caps"><div class="slds-truncate">Open</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={pageData.files} for:item="row">
                                    <tr key={row.id} class="slds-hint-parent">
                                        <td>{row.label}</td>
                                        <td>{row.subtext}</td>
                                        <td>{row.dateText}</td>
                                        <td><a href={row.url}>Open</a></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else>
                    <div class="slds-p-around_small">
                        <lightning-file-upload
                            label="Upload files and photos"
                            name="odlOpportunityFiles"
                            record-id={recordId}
                            multiple>
                        </lightning-file-upload>
                    </div>
                </template>
            </lightning-card>

            <!-- Open Items -->
            <template lwc:if={hasMissingData}>
                <lightning-card title="Open Items" class="slds-m-bottom_small">
                    <ul class="slds-list_dotted slds-p-around_small">
                        <template for:each={missingData} for:item="item">
                            <li key={item} class="slds-item">{item}</li>
                        </template>
                    </ul>
                </lightning-card>
            </template>

        </div>
    </template>
    <template lwc:elseif={error}><div class="slds-notify slds-notify_alert slds-theme_error">{errorMessage}</div></template>
</template>
