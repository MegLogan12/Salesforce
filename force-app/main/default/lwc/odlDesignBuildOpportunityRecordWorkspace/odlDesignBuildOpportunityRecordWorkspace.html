<template>
    <template lwc:if={hasData}>
        <section class="workspace">
            <section class="panel hero">
                <div class="hero-copy">
                    <div class="eyebrow">Outdoor Living · Opportunity 360</div>
                    <h1>{opportunityRecord.Name}</h1>
                    <template lwc:if={heroSubtitle}>
                        <div class="subtitle">{heroSubtitle}</div>
                    </template>
                    <div class="hero-meta">
                        <span class="chip">Design Build</span>
                        <span class="chip">{opportunityRecord.StageName}</span>
                    </div>
                </div>
                <div class="hero-actions">
                    <button class="cta cta-secondary" onclick={handleEmailHomeowner} disabled={disableEmail}>Email</button>
                    <button class="cta cta-secondary" onclick={handleCallHomeowner} disabled={disableCall}>Call</button>
                    <button class="cta cta-secondary" onclick={handleLogCall}>Log Call</button>
                    <button class="cta cta-secondary" onclick={handleNewTask}>New Task</button>
                    <button class="cta cta-secondary" onclick={handleNewEvent}>Schedule Event</button>
                    <button class="cta cta-secondary" onclick={handleNewNote}>Add Note</button>
                    <button class="cta cta-secondary" onclick={handleOpenAccount}>Open Account</button>
                    <template lwc:if={hasProperty}>
                        <button class="cta cta-secondary" onclick={handleOpenProperty}>Open Property</button>
                    </template>
                    <button class="cta cta-secondary" onclick={handleEditOpportunity}>Edit</button>
                    <template lwc:if={showNextStageAction}>
                        <button class="cta" onclick={handleNextStage}>Next Stage</button>
                    </template>
                </div>
            </section>

            <div class="hero-kpis">
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{quotesCount}</div>
                    <div class="hero-kpi-label">Quotes</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{notesCount}</div>
                    <div class="hero-kpi-label">Notes</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{filesCount}</div>
                    <div class="hero-kpi-label">Files</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{openItemsCount}</div>
                    <div class="hero-kpi-label">Open Items</div>
                </article>
            </div>

            <section class="panel" lwc:if={hasStagePath}>
                <div class="panel-header">
                    <span>Opportunity Path</span>
                    <div class="panel-actions">
                        <button class="header-button" type="button" onclick={handleEditOpportunity}>Edit Stage</button>
                    </div>
                </div>
                <div class="path">
                    <template for:each={stagePathItems} for:item="step">
                        <button type="button" key={step.label} class={step.className} data-stage={step.label} disabled={step.disabled} onclick={handleSelectStage}>{step.label}</button>
                    </template>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Opportunity Snapshot</span>
                    <div class="panel-actions">
                        <button class="header-button" type="button" onclick={handleEditOpportunity}>Edit Snapshot</button>
                        <button class="header-button" type="button" onclick={handleOpenAccount}>Open Account</button>
                    </div>
                </div>
                <div class="grid">
                    <div><div class="label">Opportunity Name</div><div class="value">{opportunityRecord.Name}</div></div>
                    <div><div class="label">Account</div><div class="value"><a href={accountUrl}>{accountName}</a></div></div>
                    <div><div class="label">Record Type</div><div class="value">Design Build</div></div>
                    <div><div class="label">Stage</div><div class="value">{opportunityRecord.StageName}</div></div>
                    <div><div class="label">Estimated Amount</div><div class="value">{formattedAmount}</div></div>
                    <div><div class="label">Close Date</div><div class="value">{opportunityRecord.CloseDate}</div></div>
                    <template lwc:if={hasVoucher}>
                        <div><div class="label">Voucher</div><div class="value"><a href={pageData.voucherRecord.url}>{pageData.voucherRecord.label}</a></div></div>
                    </template>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Discovery Summary</span>
                    <div class="panel-actions">
                        <button class="header-button" type="button" onclick={handleEditOpportunity}>Edit Discovery</button>
                    </div>
                </div>
                <div class="grid">
                    <div><div class="label">Project Vision</div><div class="value">{projectVision}</div></div>
                    <div><div class="label">Budget Comfort</div><div class="value">{budgetComfort}</div></div>
                    <div><div class="label">Decision Makers</div><div class="value">{decisionMakers}</div></div>
                    <div><div class="label">Timeline</div><div class="value">{timelineValue}</div></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Site Visit and Scope</span>
                    <div class="panel-actions">
                        <button class="header-button" type="button" onclick={handleNewTask}>New Follow-Up</button>
                        <button class="header-button" type="button" onclick={handleLogCall}>Log Call</button>
                    </div>
                </div>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Status</th>
                            <th>Owner</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Next Follow-Up</td>
                            <td>{nextTaskStatus}</td>
                            <td>{opportunityRecord.Owner.Name}</td>
                            <td>{pageData.nextFollowUpDate}</td>
                        </tr>
                        <template for:each={siteVisitRows} for:item="row">
                            <tr key={row.id}>
                                <td>{row.label}</td>
                                <td>{row.status}</td>
                                <td>{row.interactionType}</td>
                                <td>{row.dateText}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Activity and Next Follow-Up</span>
                    <div class="panel-actions">
                        <button class="header-button" type="button" onclick={handleLogCall}>Log Call</button>
                        <button class="header-button" type="button" onclick={handleNewTask}>New Task</button>
                        <button class="header-button" type="button" onclick={handleNewEvent}>Schedule Event</button>
                    </div>
                </div>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Last Activity</th>
                            <th>Date</th>
                            <th>Voicemail</th>
                            <th>Next Task</th>
                            <th>Due</th>
                            <th>Owner</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>{lastAction}</td>
                            <td>{lastActionDate}</td>
                            <td>{voicemailStatus}</td>
                            <td>{pageData.nextFollowUpSubject}</td>
                            <td>{pageData.nextFollowUpDate}</td>
                            <td>{opportunityRecord.Owner.Name}</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <div class="two-up">
                <section class="panel" data-focus-section="activity">
                    <div class="panel-header">
                        <span>Estimate</span>
                        <div class="panel-actions">
                            <button class="header-button" type="button" onclick={handleOpenQuote}>Open Estimate</button>
                            <button class="header-button" type="button" onclick={handleEditOpportunity}>Edit Estimate</button>
                        </div>
                    </div>
                    <div class="grid two-column-grid">
                        <div><div class="label">Estimate Status</div><div class="value">{estimateStatus}</div></div>
                        <div><div class="label">Projected Cost</div><div class="value">{projectedCost}</div></div>
                        <div><div class="label">Projected Price</div><div class="value">{formattedAmount}</div></div>
                        <div><div class="label">Estimator</div><div class="value">{opportunityRecord.Owner.Name}</div></div>
                    </div>
                </section>

                <section class="panel" lwc:if={hasProperty}>
                    <div class="panel-header action-header">
                        <span>Related Property</span>
                        <div class="panel-actions">
                            <button class="header-button" type="button" onclick={handleOpenProperty}>Open Property</button>
                            <button class="header-button" type="button" onclick={handleOpenAccount}>Open Account</button>
                        </div>
                    </div>
                    <div class="grid two-column-grid">
                        <div><div class="label">Property</div><div class="value"><a href={pageData.propertyRecord.url}>{pageData.propertyRecord.label}</a></div></div>
                        <div><div class="label">Community</div><div class="value">{pageData.propertyRecord.status}</div></div>
                        <div><div class="label">Lot</div><div class="value">{pageData.propertyRecord.subtext}</div></div>
                        <div><div class="label">Homeowner</div><div class="value">{pageData.propertyRecord.secondaryText}</div></div>
                        <div class="full-span"><div class="label">Property Description</div><div class="value">{pageData.propertyRecord.notesPreview}</div></div>
                    </div>
                </section>
            </div>

            <section class="panel" data-focus-section="notes">
                <div class="panel-header">
                    <span>Notes</span>
                </div>
                <template lwc:if={hasNotesSectionRows}>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Note</th>
                                <th>Description</th>
                                <th>Type</th>
                                <th>Updated</th>
                                <th>Open</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={notesSectionRows} for:item="row">
                                <tr key={row.id}>
                                    <td>{row.label}</td>
                                    <td>{row.notesPreview}</td>
                                    <td>{row.subtext}</td>
                                    <td>{row.dateText}</td>
                                    <td><a href={row.url}>Open</a></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template lwc:else>
                    <div class="empty-state empty-state-quiet"></div>
                </template>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Files and Photos</span>
                </div>
                <template lwc:if={hasFiles}>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>File</th>
                                <th>Type</th>
                                <th>Updated</th>
                                <th>Open</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={pageData.files} for:item="row">
                                <tr key={row.id}>
                                    <td>{row.label}</td>
                                    <td>{row.subtext}</td>
                                    <td>{row.dateText}</td>
                                    <td><a href={row.url}>Open</a></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template lwc:else>
                    <div class="empty-state empty-state-stack">
                        <lightning-file-upload
                            label="Upload files and photos"
                            name="odlOpportunityFiles"
                            record-id={recordId}
                            multiple>
                        </lightning-file-upload>
                    </div>
                </template>
            </section>

            <section class="panel" lwc:if={hasMissingData}>
                <div class="panel-header">Open Items</div>
                <div class="issue-list">
                    <template for:each={missingData} for:item="item">
                        <div class="issue" key={item}>{item}</div>
                    </template>
                </div>
            </section>
        </section>
    </template>

    <template lwc:elseif={error}>
        <div class="panel error">{errorMessage}</div>
    </template>
</template>
