<template>
    <template lwc:if={hasData}>
        <section class="workspace">
            <section class="panel hero">
                <div class="hero-copy">
                    <h1>{opportunityRecord.Name}</h1>
                    <template lwc:if={heroSubtitle}>
                        <div class="subtitle">{heroSubtitle}</div>
                    </template>
                    <div class="hero-meta">
                        <template lwc:if={hasProjectPath}>
                            <span class="chip">{projectPath}</span>
                        </template>
                        <span class="chip">{opportunityRecord.StageName}</span>
                    </div>
                </div>
                <div class="hero-actions">
                    <button type="button" class="cta cta-secondary" onclick={handleEmailHomeowner} disabled={disableEmail}>Email</button>
                    <button type="button" class="cta cta-secondary" onclick={handleCallHomeowner} disabled={disableCall}>Call</button>
                    <button type="button" class="cta cta-secondary" onclick={handleLogCall}>Log Call</button>
                    <button type="button" class="cta cta-secondary" onclick={handleNewTask}>New Task</button>
                    <button type="button" class="cta cta-secondary" onclick={handleNewEvent}>Schedule Event</button>
                    <button type="button" class="cta cta-secondary" onclick={handleNewNote}>Add Note</button>
                    <button type="button" class="cta cta-secondary" onclick={handleOpenAccount}>Open Account</button>
                    <template lwc:if={hasProperty}>
                        <button type="button" class="cta cta-secondary" onclick={handleOpenProperty}>Open Property</button>
                    </template>
                    <button type="button" class="cta cta-secondary" onclick={handleEditOpportunity}>Edit</button>
                    <template lwc:if={showNextStageAction}>
                        <button type="button" class="cta" onclick={handleNextStage}>Next Stage</button>
                    </template>
                </div>
            </section>

            <div class="hero-kpis">
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{quotesCount}</div>
                    <div class="hero-kpi-label">Quotes</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{notesCount}</div>
                    <div class="hero-kpi-label">Notes</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{filesCount}</div>
                    <div class="hero-kpi-label">Files</div>
                </article>
                <article class="hero-kpi">
                    <div class="hero-kpi-value">{openItemsCount}</div>
                    <div class="hero-kpi-label">Open Items</div>
                </article>
            </div>

            <section class="panel" lwc:if={hasStagePath}>
                <div class="panel-header">Opportunity Path</div>
                <div class="path">
                    <template for:each={stagePathItems} for:item="step">
                        <button type="button" key={step.label} class={step.className} data-stage={step.label} disabled={step.disabled} onclick={handleSelectStage}>{step.label}</button>
                    </template>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Opportunity Snapshot</span>
                    <div class="panel-actions">
                        <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Snapshot</button>
                        <button type="button" class="header-button" onclick={handleOpenAccount}>Open Account</button>
                        <template lwc:if={hasProperty}>
                            <button type="button" class="header-button" onclick={handleOpenProperty}>Open Property</button>
                        </template>
                    </div>
                </div>
                <div class="grid">
                    <div>
                        <div class="label">Account</div>
                        <div class="value">
                            <template lwc:if={accountUrl}>
                                <a href={accountUrl}>{accountName}</a>
                            </template>
                            <template lwc:else>{accountName}</template>
                        </div>
                    </div>
                    <div><div class="label">Project Path</div><div class="value">{projectPath}</div></div>
                    <div><div class="label">Stage</div><div class="value">{opportunityRecord.StageName}</div></div>
                    <div><div class="label">Amount</div><div class="value">{formattedAmount}</div></div>
                    <div><div class="label">Close Date</div><div class="value">{opportunityRecord.CloseDate}</div></div>
                    <div><div class="label">Opportunity Number</div><div class="value">{opportunityRecord.Opportunity_Number__c}</div></div>
                    <div><div class="label">Package</div><div class="value">{packageDisplay}</div></div>
                    <div><div class="label">Community</div><div class="value">{opportunityRecord.Community_Name__c}</div></div>
                    <template lwc:if={hasVoucher}>
                        <div><div class="label">Voucher</div><div class="value"><a href={pageData.voucherRecord.url}>{pageData.voucherRecord.label}</a></div></div>
                    </template>
                    <div><div class="label">Services</div><div class="value">{opportunityRecord.Services_Selected__c}</div></div>
                    <div><div class="label">Requirements</div><div class="value">{opportunityRecord.Selected_Requirements__c}</div></div>
                    <div><div class="label">Budget</div><div class="value">{opportunityRecord.Budget__c}</div></div>
                    <div><div class="label">Timeline</div><div class="value">{opportunityRecord.Timeline__c}</div></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Discovery Summary</span>
                    <div class="panel-actions">
                        <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Discovery</button>
                    </div>
                </div>
                <div class="grid compact-grid">
                    <div><div class="label">Project Vision</div><div class="value">{opportunityRecord.Project_Vision__c}</div></div>
                    <div><div class="label">Budget Comfort</div><div class="value">{opportunityRecord.Budget__c}</div></div>
                    <div><div class="label">Decision Makers</div><div class="value">{opportunityRecord.Decision_Makers__c}</div></div>
                    <div><div class="label">Timeline</div><div class="value">{opportunityRecord.Timeline__c}</div></div>
                    <div class="wide-field"><div class="label">Description</div><div class="value">{opportunityRecord.Description}</div></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Project Scope and Offer</span>
                    <div class="panel-actions">
                        <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Offer</button>
                        <button type="button" class="header-button" onclick={handleOpenQuote}>Open Estimate</button>
                    </div>
                </div>
                <div class="grid compact-grid">
                    <div><div class="label">Selected Package</div><div class="value">{packageDisplay}</div></div>
                    <div><div class="label">Services</div><div class="value">{opportunityRecord.Services_Selected__c}</div></div>
                    <div><div class="label">Requirements</div><div class="value">{opportunityRecord.Selected_Requirements__c}</div></div>
                    <div><div class="label">Design Link</div><div class="value">{opportunityRecord.Design_Link__c}</div></div>
                </div>
            </section>

            <div class="two-up">
                <section class="panel" data-focus-section="activity">
                    <div class="panel-header">
                        <span>Site Visit and Scope</span>
                        <div class="panel-actions">
                            <button type="button" class="header-button" onclick={handleNewTask}>New Follow-Up</button>
                            <button type="button" class="header-button" onclick={handleLogCall}>Log Call</button>
                        </div>
                    </div>
                    <table class="table">
                        <thead>
                            <tr><th>Item</th><th>Status</th><th>Owner</th><th>Date</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Next Follow-Up</td>
                                <td>{pageData.nextFollowUpSubject}</td>
                                <td>{opportunityRecord.Owner.Name}</td>
                                <td>{pageData.nextFollowUpDate}</td>
                            </tr>
                            <template for:each={siteVisitRows} for:item="row">
                                <tr key={row.id}>
                                    <td>{row.label}</td>
                                    <td>{row.status}</td>
                                    <td>{row.subtext}</td>
                                    <td>{row.dateText}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <span>Activity and Next Follow-Up</span>
                        <div class="panel-actions">
                            <button type="button" class="header-button" onclick={handleLogCall}>Log Call</button>
                            <button type="button" class="header-button" onclick={handleNewTask}>New Task</button>
                            <button type="button" class="header-button" onclick={handleNewEvent}>Schedule Event</button>
                        </div>
                    </div>
                    <table class="table">
                        <thead>
                            <tr><th>Last Action</th><th>Date</th><th>Voicemail</th><th>Next Task</th><th>Due</th><th>Owner</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>{lastAction}</td>
                                <td>{lastActionDate}</td>
                                <td>{voicemailStatus}</td>
                                <td>{pageData.nextFollowUpSubject}</td>
                                <td>{pageData.nextFollowUpDate}</td>
                                <td>{opportunityRecord.Owner.Name}</td>
                            </tr>
                        </tbody>
                    </table>
                    <template lwc:if={hasActivityRows}>
                        <table class="table">
                            <thead>
                                <tr><th>Date</th><th>Type</th><th>Subject</th><th>Status</th><th>Open</th></tr>
                            </thead>
                            <tbody>
                                <template for:each={activityRows} for:item="row">
                                    <tr key={row.id}>
                                        <td>{row.dateText}</td>
                                        <td>{row.interactionType}</td>
                                        <td>{row.label}</td>
                                        <td>{row.status}</td>
                                        <td><a href={row.url}>Open</a></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                </section>

                <section class="panel" lwc:if={hasProperty}>
                    <div class="panel-header">
                        <span>Related Property</span>
                        <div class="panel-actions">
                            <button type="button" class="header-button" onclick={handleOpenProperty}>Open Property</button>
                            <button type="button" class="header-button" onclick={handleOpenAccount}>Open Account</button>
                        </div>
                    </div>
                    <div class="grid">
                        <div><div class="label">Property</div><div class="value"><a href={pageData.propertyRecord.url}>{pageData.propertyRecord.label}</a></div></div>
                        <div><div class="label">Community</div><div class="value">{pageData.propertyRecord.status}</div></div>
                        <div><div class="label">Lot</div><div class="value">{pageData.propertyRecord.subtext}</div></div>
                        <div><div class="label">Homeowner</div><div class="value">{pageData.propertyRecord.secondaryText}</div></div>
                        <div class="wide-field"><div class="label">Property Description</div><div class="value">{pageData.propertyRecord.notesPreview}</div></div>
                    </div>
                </section>
            </div>

            <div class="two-up">
                <section class="panel" lwc:if={hasDesignReviews}>
                    <div class="panel-header">Design Review</div>
                    <table class="table">
                        <thead>
                            <tr><th>Review</th><th>Status</th><th>Updated</th><th>Open</th></tr>
                        </thead>
                        <tbody>
                            <template for:each={pageData.designReviews} for:item="row">
                                <tr key={row.id}>
                                    <td>{row.label}</td>
                                    <td>{row.status}</td>
                                    <td>{row.dateText}</td>
                                    <td><a href={row.url}>Open</a></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </section>

                <section class="panel" lwc:if={hasQuoteOrPaymentData}>
                    <div class="panel-header">
                        <span>Quote, Contract, Payment</span>
                        <div class="panel-actions">
                            <button type="button" class="header-button" onclick={handleOpenQuote}>Open Estimate</button>
                            <button type="button" class="header-button" onclick={handleEditOpportunity}>Edit Pricing</button>
                        </div>
                    </div>
                    <template lwc:if={hasQuotes}>
                        <table class="table">
                            <thead>
                                <tr><th>Quote</th><th>Status</th><th>Total</th><th>Created</th></tr>
                            </thead>
                            <tbody>
                                <template for:each={pageData.quotes} for:item="row">
                                    <tr key={row.id}>
                                        <td><a href={row.url}>{row.label}</a></td>
                                        <td>{row.status}</td>
                                        <td>{row.subtext}</td>
                                        <td>{row.dateText}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template lwc:if={hasPaymentMilestones}>
                        <table class="table">
                            <thead>
                                <tr><th>Payment</th><th>Status</th><th>Amount</th><th>Due</th></tr>
                            </thead>
                            <tbody>
                                <template for:each={pageData.paymentMilestones} for:item="row">
                                    <tr key={row.id}>
                                        <td><a href={row.url}>{row.label}</a></td>
                                        <td>{row.status}</td>
                                        <td>{row.subtext}</td>
                                        <td>{row.dateText}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                </section>
            </div>

            <section class="panel" data-focus-section="notes">
                <div class="panel-header">
                    <span>Notes</span>
                </div>
                <template lwc:if={hasNotesSectionRows}>
                    <table class="table">
                        <thead>
                            <tr><th>Note</th><th>Description</th><th>Type</th><th>Updated</th><th>Open</th></tr>
                        </thead>
                        <tbody>
                            <template for:each={notesSectionRows} for:item="row">
                                <tr key={row.id}>
                                    <td>{row.label}</td>
                                    <td>{row.notesPreview}</td>
                                    <td>{row.subtext}</td>
                                    <td>{row.dateText}</td>
                                    <td><a href={row.url}>Open</a></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template lwc:else>
                    <div class="empty-state empty-state-quiet"></div>
                </template>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Files and Photos</span>
                </div>
                <template lwc:if={hasFiles}>
                    <table class="table">
                        <thead>
                            <tr><th>File</th><th>Type</th><th>Updated</th><th>Open</th></tr>
                        </thead>
                        <tbody>
                            <template for:each={pageData.files} for:item="row">
                                <tr key={row.id}>
                                    <td>{row.label}</td>
                                    <td>{row.subtext}</td>
                                    <td>{row.dateText}</td>
                                    <td><a href={row.url}>Open</a></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template lwc:else>
                    <div class="empty-state empty-state-stack">
                        <lightning-file-upload
                            label="Upload files and photos"
                            name="odlUmbOpportunityFiles"
                            record-id={recordId}
                            multiple>
                        </lightning-file-upload>
                    </div>
                </template>
            </section>

            <section class="panel" lwc:if={hasMissingData}>
                <div class="panel-header">Open Items</div>
                <div class="issue-list">
                    <template for:each={missingData} for:item="item">
                        <div class="issue" key={item}>{item}</div>
                    </template>
                </div>
            </section>
        </section>
    </template>

    <template lwc:elseif={error}>
        <div class="panel error">{errorMessage}</div>
    </template>
</template>
