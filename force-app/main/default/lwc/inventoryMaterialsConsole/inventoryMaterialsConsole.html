<template>
    <lightning-card title="Inventory &amp; Materials Console" icon-name="standard:product">
        <div class="slds-p-around_medium">

            <!-- Console Header with primary CTAs -->
            <div class="imc-header">
                <div>
                    <div class="imc-header-title">Inventory &amp; Materials Console</div>
                    <div class="imc-header-sub">Product catalog, cost tracking, and truck stock management</div>
                </div>
                <div class="imc-header-actions">
                    <button class="btn-header" onclick={handleRefresh}>↺ Refresh</button>
                    <button class="btn-header btn-header-solid" onclick={handleAddProduct}>+ Add Product</button>
                </div>
            </div>

            <!-- Category Filter -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium slds-m-top_medium">
                <div class="slds-col slds-size_1-of-4">
                    <lightning-combobox
                        label="Category"
                        value={selectedCategory}
                        options={categoryOptions}
                        onchange={handleCategoryChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-4 slds-align_absolute-center">
                    <lightning-button
                        label="Refresh"
                        icon-name="utility:refresh"
                        onclick={handleRefresh}>
                    </lightning-button>
                </div>
                <div class="slds-col slds-size_2-of-4 slds-text-align_right slds-align_absolute-center">
                    <button class="btn-inline-lav" onclick={handleExportCatalog}>Export Catalog</button>
                </div>
            </div>

            <!-- Tabs: Catalog / Cost Catalog / Truck Stock -->
            <lightning-tabset active-tab-value={activeTab} onactive={handleTabChange}>

                <lightning-tab label="Product Catalog" value="catalog">
                    <!-- Tab action bar -->
                    <div class="tab-action-bar">
                        <button class="btn-inline" onclick={handleAddProduct}>+ Add Product</button>
                        <button class="btn-inline-lav" onclick={handleExportCatalog}>Export</button>
                    </div>
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading..."></lightning-spinner>
                    </template>
                    <template if:false={isLoading}>
                        <lightning-datatable
                            key-field="productId"
                            data={catalog}
                            columns={catalogColumns}
                            onrowaction={handleCatalogRowAction}>
                        </lightning-datatable>
                    </template>
                </lightning-tab>

                <lightning-tab label="Cost Catalog" value="cost">
                    <!-- Tab action bar -->
                    <div class="tab-action-bar">
                        <button class="btn-inline" onclick={handleAddCostEntry}>+ Add Cost Entry</button>
                        <button class="btn-inline-lav" onclick={handleExportCatalog}>Export</button>
                    </div>
                    <template if:true={selectedProduct}>
                        <template if:true={costDetail}>
                            <div class="cost-detail-box">
                                <div class="cost-detail-head">
                                    <h3>{costDetail.productName} — Cost Detail</h3>
                                    <button class="btn-inline-lav" onclick={handleSavePrice}>Update Price</button>
                                </div>
                                <div class="cost-detail-body">
                                    <div class="slds-grid slds-gutters slds-wrap">
                                        <div class="slds-col slds-size_1-of-2">
                                            <p><strong>Product:</strong> {costDetail.productName}</p>
                                            <p><strong>Vendor:</strong> {costDetail.vendor}</p>
                                            <p><strong>Effective Date:</strong> {costDetail.effectiveDate}</p>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <p><strong>Unit Cost:</strong> {costDetail.unitCost}</p>
                                            <p><strong>Freight:</strong> {costDetail.freight}</p>
                                            <p><strong>Landed Cost:</strong> {costDetail.landedCost}</p>
                                            <p><strong>Standard Price:</strong> {costDetail.standardPrice}</p>
                                            <p class="gp-positive"><strong>GP %:</strong> {gpPctDisplay}</p>
                                        </div>
                                    </div>
                                    <div class="slds-m-top_small">
                                        <lightning-input
                                            type="number"
                                            label="Update Standard Price"
                                            value={newStdPrice}
                                            onchange={handlePriceChange}>
                                        </lightning-input>
                                        <div style="margin-top:10px; display:flex; gap:8px;">
                                            <button class="btn-primary btn" onclick={handleSavePrice}>Save Price</button>
                                            <button class="btn-ghost btn" onclick={handleAddCostEntry}>Add Entry</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template if:false={costDetail}>
                            <div class="slds-p-around_medium">
                                <p class="slds-text-color_weak">No cost catalog entry for this product. Contact purchasing to add one.</p>
                                <div style="margin-top:10px;">
                                    <button class="btn-primary btn" onclick={handleAddCostEntry}>+ Add Cost Entry</button>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:false={selectedProduct}>
                        <p class="slds-p-around_medium slds-text-color_weak">Select a product from the Catalog tab to view cost details.</p>
                    </template>
                </lightning-tab>

                <lightning-tab label="Truck Stock" value="truck">
                    <!-- Tab action bar -->
                    <div class="tab-action-bar">
                        <button class="btn-inline" onclick={handleReorderAll}>Reorder Low Stock</button>
                        <button class="btn-inline-lav" onclick={handleExportCatalog}>Export Stock</button>
                    </div>
                    <template if:true={lowStockItems.length}>
                        <div class="low-stock-banner" role="alert">
                            ⚠ {lowStockItems.length} item(s) at or below reorder point
                            <button class="btn-inline" style="margin-left:auto;" onclick={handleReorderAll}>Reorder All</button>
                        </div>
                    </template>
                    <lightning-datatable
                        key-field="productId"
                        data={catalog}
                        columns={truckStockColumns}
                        onrowaction={handleReorder}>
                    </lightning-datatable>
                </lightning-tab>

            </lightning-tabset>
        </div>
    </lightning-card>
</template>
