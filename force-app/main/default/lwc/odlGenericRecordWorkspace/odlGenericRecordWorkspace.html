<template>
    <section class="workspace">
        <section class="panel hero">
            <div class="hero-copy">
                <div class="eyebrow">{objectApiName}</div>
                <h1>Record Detail</h1>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">Record Fields</div>
            <div class="form-wrap">
                <lightning-record-form
                    record-id={recordId}
                    object-api-name={objectApiName}
                    mode="view"
                    layout-type="Full">
                </lightning-record-form>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">Files</div>
            <div class="related-wrap">
                <lightning-related-list
                    record-id={recordId}
                    related-list-id="AttachedContentDocuments">
                </lightning-related-list>
            </div>
        </section>
    </section>
</template>
