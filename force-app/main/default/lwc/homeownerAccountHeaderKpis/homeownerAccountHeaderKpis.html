<template>
    <template lwc:if={isLoading}>
        <div class="kpi-loading">
            <lightning-spinner alternative-text="Loading KPIs" size="small"></lightning-spinner>
        </div>
    </template>

    <template lwc:elseif={hasError}>
        <div class="kpi-error">
            <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
            <span>{error}</span>
        </div>
    </template>

    <template lwc:else>
        <div class="kpi-strip">
            <!-- Open Opps -->
            <div class="kpi-tile kc-blue" title="Open Opportunities">
                <span class="kpi-num">{openOpps}</span>
                <span class="kpi-lbl">Open Opps</span>
            </div>

            <!-- Total Pipeline -->
            <div class="kpi-tile kc-orange" title="Total Open Pipeline">
                <span class="kpi-num">{totalPipelineFormatted}</span>
                <span class="kpi-lbl">Pipeline</span>
            </div>

            <!-- Won Opps -->
            <div class="kpi-tile kc-teal" title="Won Opportunities">
                <span class="kpi-num">{wonOpps}</span>
                <span class="kpi-lbl">Won Opps</span>
            </div>

            <!-- Total Closed -->
            <div class="kpi-tile kc-purple" title="Total Closed / Won Revenue">
                <span class="kpi-num">{totalClosedFormatted}</span>
                <span class="kpi-lbl">Closed Revenue</span>
            </div>

            <!-- Open Leads -->
            <div class="kpi-tile kc-amber" title="Open Leads associated with this Account">
                <span class="kpi-num">{openLeads}</span>
                <span class="kpi-lbl">Open Leads</span>
            </div>

            <!-- Open Tasks -->
            <div class="kpi-tile kc-slate" title="Open Tasks on Opportunities and Account">
                <span class="kpi-num">{openTasks}</span>
                <span class="kpi-lbl">Open Tasks</span>
            </div>

            <!-- Open Cases -->
            <div class="kpi-tile kc-red" title="Open Cases for this Account">
                <span class="kpi-num">{openCases}</span>
                <span class="kpi-lbl">Open Cases</span>
            </div>
        </div>
    </template>
</template>
