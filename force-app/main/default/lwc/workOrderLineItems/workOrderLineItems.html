<template>
    <div class="wrap">
        <h3 class="ttl">Line Items</h3>
        <template lwc:if={hasItems}>
            <div class="grid">
                <template for:each={items} for:item="li">
                    <div key={li.id} class={li.cardClass}>
                        <div class="hdr">
                            <span class="catalog">{li.catalogItem}</span>
                            <span class={li.scoreClass}>Score: {li.scoreLabel}</span>
                        </div>
                        <div class="body">
                            <div class="row"><span class="lbl">Qty</span><span class="v">{li.quantity}</span></div>
                            <div class="row"><span class="lbl">Time Std</span><span class="v">{li.timeStandard} min/unit</span></div>
                            <div class="row"><span class="lbl">Goal Mins</span><span class="v">{li.goalMinutes}</span></div>
                            <div class="row"><span class="lbl">Billing</span><span class="v">{li.billingType}</span></div>
                        </div>
                        <template lwc:if={li.scoreFlag}>
                            <div class="warn">Score flag: requires FM review</div>
                        </template>
                        <div class="li-actions">
                            <button class="btn-inline" data-id={li.id} onclick={handleViewItem}>View</button>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        <template lwc:else>
            <div class="empty">No line items yet.</div>
        </template>
    </div>
</template>
