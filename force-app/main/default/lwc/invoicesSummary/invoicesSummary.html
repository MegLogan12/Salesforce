<template>
    <div class="inv-card">
        <div class="ch">
            <h3>Invoice Summary</h3>
        </div>
        <div class="inv-summary">
            <div class="inv-kpi">
                <div class="kn" style="color:#2e844a">
                    <lightning-formatted-number value={ytdInvoiced} format-style="currency" currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                </div>
                <div class="kl">YTD invoiced</div>
            </div>
            <div class="inv-kpi">
                <div class="kn" style="color:#0070d2">
                    <lightning-formatted-number value={outstandingBalance} format-style="currency" currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                </div>
                <div class="kl">Outstanding balance</div>
            </div>
            <div class="inv-kpi">
                <div class="kn" style="color:#ba7517">
                    <lightning-formatted-number value={overdueAmount} format-style="currency" currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                </div>
                <div class="kl">Overdue (&gt;30 days)</div>
            </div>
            <div class="inv-kpi">
                <div class="kn" style="color:#2e844a">{avgDaysToPay}</div>
                <div class="kl">Avg days to pay</div>
            </div>
        </div>
        <template lwc:if={error}>
            <div class="err">{error}</div>
        </template>
    </div>
</template>
