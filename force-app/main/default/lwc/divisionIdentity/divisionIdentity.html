<template>
    <template lwc:if={isLoaded}>
        <div class="card">
            <!-- Header -->
            <div class="card-header">
                <div class="ch-icon">🏢</div>
                <div class="ch-titles">
                    <div class="ch-title">{accountName}</div>
                    <div class="ch-chips">
                        <template lwc:if={accountType}>
                            <span class="chip caqua">{accountType}</span>
                        </template>
                        <template lwc:if={tradeTypeCode}>
                            <span class="chip cgr">{tradeTypeCode}</span>
                        </template>
                    </div>
                </div>
                <button type="button" class="action-button" onclick={handleToggleEdit}>{editButtonLabel}</button>
            </div>

            <template lwc:if={isEditing}>
                <div class="edit-panel">
                    <lightning-record-edit-form
                        object-api-name="Account"
                        record-id={recordId}
                        onsuccess={handleSuccess}
                        onerror={handleError}
                    >
                        <div class="section-label">Division Identity</div>
                        <div class="form-grid">
                            <lightning-input-field field-name="Name"></lightning-input-field>
                            <lightning-input-field field-name="Type"></lightning-input-field>
                            <lightning-input-field field-name="Trade_Type_Code__c"></lightning-input-field>
                            <lightning-input-field field-name="Market__c"></lightning-input-field>
                            <lightning-input-field field-name="ParentId"></lightning-input-field>
                        </div>
                        <div class="section-divider"></div>
                        <div class="section-label">LOVING Team</div>
                        <div class="form-grid">
                            <lightning-input-field field-name="Loving_CSM__c"></lightning-input-field>
                            <lightning-input-field field-name="Loving_FM__c"></lightning-input-field>
                            <lightning-input-field field-name="Loving_VP_Field_Ops__c"></lightning-input-field>
                            <lightning-input-field field-name="Loving_Scheduler__c"></lightning-input-field>
                            <lightning-input-field field-name="Loving_AP__c"></lightning-input-field>
                            <lightning-input-field field-name="Loving_Warranty__c"></lightning-input-field>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="action-button action-button_brand">Save Changes</button>
                            <button type="button" class="action-button" onclick={handleCancel}>Cancel</button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </template>
            <template lwc:else>
                <div class="section-label">Classification</div>
                <div class="fields-grid">
                    <div class="field-item">
                        <div class="field-label">Division (Market)</div>
                        <div class="field-value">{division}</div>
                    </div>
                    <div class="field-item">
                        <div class="field-label">Territory</div>
                        <div class="field-value">{territory}</div>
                    </div>
                    <div class="field-item">
                        <div class="field-label">Parent Builder</div>
                        <div class="field-value">{parentName}</div>
                    </div>
                </div>

                <div class="section-divider"></div>
                <div class="section-label">LOVING Team</div>
                <div class="team-grid">
                    <template for:each={teamRows} for:item="row">
                        <div key={row.label} class="team-item">
                            <div class="field-label">{row.label}</div>
                            <div class="field-value">{row.value}</div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </template>

    <template lwc:if={hasError}>
        <div class="card error-state">{errorMessage}</div>
    </template>

    <template lwc:elseif={account.data}><!-- already handled --></template>
</template>
