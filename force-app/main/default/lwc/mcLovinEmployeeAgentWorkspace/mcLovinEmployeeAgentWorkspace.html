<template>
    <lightning-card title="mcLOVIN' Employee Intake Agent" icon-name="standard:bot">
        <div class="slds-p-around_small">

            <!-- Detected Context -->
            <lightning-card class="slds-m-bottom_small">
                <h2 slot="title">
                    <lightning-icon icon-name="utility:connected_apps" size="x-small" class="slds-m-right_x-small" alternative-text="Context"></lightning-icon>
                    {contextLabel}
                </h2>
                <div class="slds-card__body slds-card__body_inner">
                    <p class="slds-text-body_regular slds-m-bottom_x-small">{contextPurpose}</p>
                    <template if:true={detectedContextLabel}>
                        <p class="slds-text-body_small slds-text-color_weak">{detectedContextLabel}</p>
                    </template>
                </div>
            </lightning-card>

            <!-- Context answer cards -->
            <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-m-bottom_small">
                    <lightning-card title="What Is This Page For?">
                        <div class="slds-card__body slds-card__body_inner">
                            <p class="slds-text-body_regular">{contextPurpose}</p>
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-m-bottom_small">
                    <lightning-card title="What Can I Do Right Now?">
                        <div class="slds-card__body slds-card__body_inner">
                            <p class="slds-text-body_regular">{contextDoNow}</p>
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-m-bottom_small">
                    <lightning-card title="What Can Break Here?">
                        <div class="slds-card__body slds-card__body_inner">
                            <p class="slds-text-body_regular">{contextCaution}</p>
                        </div>
                    </lightning-card>
                </div>
            </div>

            <!-- Relevant Prompts -->
            <lightning-card title="Relevant Prompts" class="slds-m-bottom_small">
                <div class="slds-card__body slds-card__body_inner">
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">These are the prompts mcLOVIN should care about on this page, not generic Salesforce filler.</p>
                    <div class="slds-button-group-row">
                        <template for:each={contextPromptRows} for:item="item">
                            <lightning-button
                                key={item.label}
                                label={item.label}
                                variant="neutral"
                                class="slds-m-right_x-small slds-m-bottom_x-small"
                                onclick={handlePromptAction}>
                            </lightning-button>
                        </template>
                    </div>
                </div>
            </lightning-card>

            <!-- Action Hub -->
            <lightning-card title="Action Hub" class="slds-m-bottom_small">
                <div class="slds-card__body slds-card__body_inner">
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">These actions are wired to the real page lane where possible. Use them instead of freehanding a bad record.</p>
                    <div class="slds-button-group-row">
                        <template for:each={contextActionRows} for:item="item">
                            <lightning-button
                                key={item.label}
                                label={item.label}
                                variant="brand-outline"
                                class="slds-m-right_x-small slds-m-bottom_x-small"
                                onclick={handleContextAction}>
                            </lightning-button>
                        </template>
                    </div>
                </div>
            </lightning-card>

            <!-- Intro -->
            <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_small" role="alert">
                <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small" alternative-text="Info"></lightning-icon>
                One stop shop time. Upload a PO, scope, spreadsheet, email, homeowner intake, or new-account packet. mcLOVIN' will sort the details, match what already exists, ask the missing questions, and line up the save.
            </div>

            <!-- Quick Starts -->
            <lightning-card title="Quick Starts" class="slds-m-bottom_small">
                <div class="slds-card__body slds-card__body_inner">
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Pick a lane if you want mcLOVIN' to tee up the right questions faster.</p>
                    <div class="slds-button-group-row">
                        <template for:each={quickStarts} for:item="item">
                            <lightning-button
                                key={item.label}
                                label={item.label}
                                data-prompt={item.prompt}
                                data-source-type={item.sourceType}
                                class="slds-m-right_x-small slds-m-bottom_x-small"
                                onclick={handleQuickStart}>
                            </lightning-button>
                        </template>
                    </div>
                </div>
            </lightning-card>

            <!-- Knowledge Bank + Follow-Up preview -->
            <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small">
                    <lightning-card title="Knowledge Bank">
                        <div class="slds-card__body slds-card__body_inner">
                            <template for:each={knowledgeRows} for:item="section">
                                <div key={section.key} class="slds-m-bottom_small">
                                    <p class="slds-text-body_small slds-text-color_weak" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em">{section.label}</p>
                                    <template for:each={section.values} for:item="row">
                                        <p key={row} class="slds-text-body_regular slds-border_bottom slds-p-vertical_xx-small">{row}</p>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small">
                    <lightning-card title="What mcLOVIN' Will Ask">
                        <div class="slds-card__body slds-card__body_inner">
                            <p class="slds-text-body_regular slds-text-color_weak">Expected follow-up depends on the upload, but the usual suspects are builder account, homeowner household, community, lot, PO number, voucher/UMB number, case subject, opportunity name, and whether parsed scope lines belong on an existing Work Order.</p>
                        </div>
                    </lightning-card>
                </div>
            </div>

            <!-- Input panel -->
            <lightning-card title="Intake" icon-name="utility:upload" class="slds-m-bottom_small">
                <div class="slds-card__body slds-card__body_inner">
                    <lightning-combobox
                        name="sourceType"
                        label="Source Type"
                        value={sourceType}
                        options={sourceTypeOptions}
                        onchange={handleSourceTypeChange}>
                    </lightning-combobox>
                    <div class="slds-m-top_small">
                        <lightning-textarea
                            name="intakeText"
                            label="Paste email, notes, scope, or supporting text"
                            value={intakeText}
                            onchange={handleTextChange}>
                        </lightning-textarea>
                    </div>
                    <template if:true={requestId}>
                        <div class="slds-m-top_small">
                            <lightning-file-upload
                                label="Upload document or spreadsheet"
                                name="fileUploader"
                                record-id={requestId}
                                multiple
                                onuploadfinished={handleUploadFinished}>
                            </lightning-file-upload>
                        </div>
                    </template>
                    <div class="slds-m-top_small">
                        <lightning-button
                            label="Analyze"
                            variant="brand"
                            onclick={handleAnalyze}
                            disabled={isBusy}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        <template if:true={analysis}>
                            <lightning-button
                                label="Save Records"
                                variant="success"
                                onclick={handleSave}
                                disabled={isBusy}>
                            </lightning-button>
                        </template>
                    </div>
                </div>
            </lightning-card>

            <!-- Analysis results -->
            <template if:true={analysis}>
                <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small">
                        <lightning-card title="Analysis">
                            <div class="slds-card__body slds-card__body_inner">
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Status</dt>
                                    <dd class="slds-dl_horizontal__detail">{analysis.status}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Classification</dt>
                                    <dd class="slds-dl_horizontal__detail">{analysis.classification}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Primary Object</dt>
                                    <dd class="slds-dl_horizontal__detail">{analysis.suggestedPrimaryObject}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Suggested Action</dt>
                                    <dd class="slds-dl_horizontal__detail">{analysis.suggestedAction}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Suggested Record</dt>
                                    <dd class="slds-dl_horizontal__detail">{analysis.suggestedRecordName}</dd>
                                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Files Linked</dt>
                                    <dd class="slds-dl_horizontal__detail">{analysis.linkedFileCount}</dd>
                                </dl>
                            </div>
                        </lightning-card>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small">
                        <lightning-card title="Extracted Detail">
                            <div class="slds-card__body slds-card__body_inner">
                                <dl class="slds-dl_horizontal">
                                    <template for:each={extractedRows} for:item="row">
                                        <dt key={row.key} class="slds-dl_horizontal__label slds-text-color_weak">{row.keyLabel}</dt>
                                        <dd class="slds-dl_horizontal__detail">{row.value}</dd>
                                    </template>
                                </dl>
                            </div>
                        </lightning-card>
                    </div>
                </div>

                <template if:true={hasParsedScopeItems}>
                    <lightning-card title="Parsed Work Order Items" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">mcLOVIN' found scope lines in the description. Add an existing Work Order Id before save if these should become real Work Order line items.</p>
                            <lightning-input
                                label="Existing Work Order Id"
                                data-key="workOrderId"
                                value={workOrderIdValue}
                                onchange={handleOverrideChange}>
                            </lightning-input>
                            <div class="slds-m-top_small">
                                <template for:each={parsedScopeItems} for:item="item">
                                    <div key={item.rawLine} class="slds-box slds-box_x-small slds-m-bottom_x-small">
                                        <p class="slds-text-body_regular" style="font-weight:600">{item.subject}</p>
                                        <p class="slds-text-body_small slds-text-color_weak">Qty {item.quantity} · Unit {item.unitOfMeasure}</p>
                                        <p class="slds-text-body_small slds-text-color_weak">{item.rawLine}</p>
                                        <template if:true={item.itemCatalogName}>
                                            <p class="slds-text-body_small slds-text-color_weak">Catalog match: {item.itemCatalogName} · score {item.matchScore}</p>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </lightning-card>
                </template>

                <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small">
                        <lightning-card title="Similar Records">
                            <div class="slds-card__body slds-card__body_inner">
                                <template if:true={candidateRows.length}>
                                    <template for:each={candidateRows} for:item="row">
                                        <div key={row.recordId} class="slds-box slds-box_x-small slds-m-bottom_x-small">
                                            <div class="slds-grid">
                                                <div class="slds-col">
                                                    <p class="slds-text-body_regular" style="font-weight:600">{row.label}</p>
                                                    <p class="slds-text-body_small slds-text-color_weak">{row.objectApiName} · score {row.score}</p>
                                                    <p class="slds-text-body_small slds-text-color_weak">{row.reason}</p>
                                                </div>
                                                <div class="slds-col slds-shrink-none">
                                                    <a href={row.url} target="_blank" class="slds-text-link">Open</a>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={candidateRows.length}>
                                    <p class="slds-text-body_regular slds-text-color_weak">No strong matches yet.</p>
                                </template>
                            </div>
                        </lightning-card>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_small">
                        <lightning-card title="Required Follow-Up">
                            <div class="slds-card__body slds-card__body_inner">
                                <template if:true={missingFieldRows.length}>
                                    <template for:each={missingFieldRows} for:item="field">
                                        <div key={field.apiName} class="slds-m-bottom_small">
                                            <lightning-input
                                                label={field.label}
                                                data-key={field.apiName}
                                                value={field.value}
                                                message-when-value-missing={field.reason}
                                                onchange={handleOverrideChange}>
                                            </lightning-input>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{field.reason}</p>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={missingFieldRows.length}>
                                    <p class="slds-text-body_regular slds-text-color_weak">No mandatory gaps detected. You can save now.</p>
                                </template>
                            </div>
                        </lightning-card>
                    </div>
                </div>

                <!-- Combined Preview -->
                <lightning-card title="Combined Preview" class="slds-m-bottom_small">
                    <div class="slds-card__body slds-card__body_inner">
                        <div class="mcl-preview">{analysis.combinedPreview}</div>
                    </div>
                </lightning-card>
            </template>

            <!-- Save result -->
            <template if:true={saveResult}>
                <div class="slds-notify slds-notify_alert slds-theme_success" role="alert">
                    <lightning-icon icon-name="utility:check" size="x-small" class="slds-m-right_x-small" alternative-text="Saved"></lightning-icon>
                    <strong>Saved:</strong>&nbsp;{saveResult.message}
                    <template if:true={saveResult.primaryRecordUrl}>
                        &nbsp;<a href={saveResult.primaryRecordUrl} target="_blank" class="slds-text-link_faux">{saveResult.primaryRecordName}</a>
                    </template>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
