<template>
    <!-- Loading state -->
    <template if:true={isLoading}>
        <div class="slds-align_absolute-center slds-p-around_large">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <!-- Error state -->
    <template if:true={hasError}>
        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
            <span class="slds-assistive-text">error</span>
            {errorMessage}
        </div>
    </template>

    <!-- Main content -->
    <template if:true={dto}>

        <!-- Lifecycle path -->
        <div class="lwtl-path-wrap slds-m-bottom_small">
            <div class="lwtl-path" style={pathStyle}>
                <template for:each={stagesWithClasses} for:item="stage">
                    <div key={stage.num} class={stage.cssClass}>
                        <small>Stage {stage.num}</small>
                        <b>{stage.label}</b>
                        <span>{stage.sub}</span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Type-specific notice banner -->
        <template if:true={noticeText}>
            <div class={noticeClass} role="alert">{noticeText}</div>
        </template>

        <!-- KPI strip -->
        <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_x-small">
                <div class="slds-box slds-box_x-small cs-kpi-tile">
                    <div class="cs-kpi-v">{statusLabel}</div>
                    <div class="slds-text-title slds-m-top_xx-small">Status</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_x-small">
                <div class="slds-box slds-box_x-small cs-kpi-tile">
                    <div class="cs-kpi-v">{woTypeLabel}</div>
                    <div class="slds-text-title slds-m-top_xx-small">Type</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_x-small">
                <div class="slds-box slds-box_x-small cs-kpi-tile">
                    <div class="cs-kpi-v">{photoCountDisplay}</div>
                    <div class="slds-text-title slds-m-top_xx-small">Photos</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_x-small">
                <div class="slds-box slds-box_x-small cs-kpi-tile">
                    <div class="cs-kpi-v">{divisionDisplay}</div>
                    <div class="slds-text-title slds-m-top_xx-small">Division</div>
                </div>
            </div>
        </div>

        <!-- Two-column grid -->
        <div class="slds-grid slds-wrap slds-gutters_small">

            <!-- Main column -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">

                <!-- Core details card -->
                <lightning-card title="Work Order Details" icon-name="utility:work_order" class="slds-m-bottom_small">
                    <div slot="actions">
                        <span class={statusBadgeClass}>{statusLabel}</span>
                        &nbsp;
                        <span class={typeBadgeClass}>{woTypeLabel}</span>
                        &nbsp;
                        <template if:false={isEditingTypeStage}>
                            <lightning-button label="Edit Type/Stage" onclick={handleEditTypeStage}></lightning-button>
                        </template>
                        <template if:true={isEditingTypeStage}>
                            <lightning-button label="Cancel" onclick={handleCancelTypeStage}></lightning-button>
                            &nbsp;
                            <lightning-button variant="brand" label="Save" onclick={handleSaveTypeStage}></lightning-button>
                        </template>
                        &nbsp;
                        <lightning-button label="Edit" onclick={handleEditRecord}></lightning-button>
                    </div>
                    <div class="slds-card__body slds-card__body_inner">

                        <!-- Identity fields -->
                        <dl class="slds-dl_horizontal">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">WO Number</dt>
                            <dd class="slds-dl_horizontal__detail">{dto.woNumber}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Status</dt>
                            <dd class="slds-dl_horizontal__detail">
                                <template if:true={isEditingTypeStage}>
                                    <lightning-combobox value={selectedStatusValue} options={statusOptions} onchange={handleStatusChange}></lightning-combobox>
                                </template>
                                <template if:false={isEditingTypeStage}>
                                    {statusLabel}
                                </template>
                            </dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Work Type</dt>
                            <dd class="slds-dl_horizontal__detail">
                                <template if:true={isEditingTypeStage}>
                                    <lightning-combobox value={selectedTypeValue} options={woTypeOptions} onchange={handleTypeChange}></lightning-combobox>
                                </template>
                                <template if:false={isEditingTypeStage}>
                                    {woTypeLabel}
                                </template>
                            </dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Priority</dt>
                            <dd class="slds-dl_horizontal__detail">{priorityDisplay}</dd>
                        </dl>

                        <!-- Account / people -->
                        <hr class="slds-m-vertical_small" />
                        <dl class="slds-dl_horizontal">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Builder / Account</dt>
                            <dd class="slds-dl_horizontal__detail">{builderField.value}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Contact</dt>
                            <dd class="slds-dl_horizontal__detail">{contactDisplay}</dd>
                            <template if:true={showCaseLink}>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Source Case</dt>
                                <dd class="slds-dl_horizontal__detail">{caseDisplay}</dd>
                            </template>
                            <template if:true={showParentWoLink}>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Source Work Order</dt>
                                <dd class="slds-dl_horizontal__detail">{parentWoDisplay}</dd>
                            </template>
                        </dl>

                        <!-- Location -->
                        <hr class="slds-m-vertical_small" />
                        <dl class="slds-dl_horizontal">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Division</dt>
                            <dd class="slds-dl_horizontal__detail">{divisionField.value}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Community</dt>
                            <dd class="slds-dl_horizontal__detail">{communityField.value}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Lot</dt>
                            <dd class="slds-dl_horizontal__detail">{lotField.value}</dd>
                        </dl>

                        <!-- Team -->
                        <hr class="slds-m-vertical_small" />
                        <dl class="slds-dl_horizontal">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Field Manager</dt>
                            <dd class="slds-dl_horizontal__detail">{fmField.value}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Foreman</dt>
                            <dd class="slds-dl_horizontal__detail">{foremanField.value}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Proposed Crew</dt>
                            <dd class="slds-dl_horizontal__detail">{crewField.value}</dd>
                        </dl>

                        <!-- PO / Reference -->
                        <hr class="slds-m-vertical_small" />
                        <dl class="slds-dl_horizontal">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">PO Number</dt>
                            <dd class="slds-dl_horizontal__detail">{poField.value}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Builder WO #</dt>
                            <dd class="slds-dl_horizontal__detail">{builderWoField.value}</dd>
                        </dl>

                        <!-- ============================================================ -->
                        <!-- TYPE-SPECIFIC SECTIONS — one block per record type           -->
                        <!-- ============================================================ -->

                        <!-- Finished Job: Return Work Details -->
                        <template if:true={showFinishedJobSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Return Work Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Reason / Return Scope</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Return Crew</dt>
                                <dd class="slds-dl_horizontal__detail">{crewDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">FM Decision</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Billable</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Return Date</dt>
                                <dd class="slds-dl_horizontal__detail">{scheduledDateDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Closeout Gate</dt>
                                <dd class="slds-dl_horizontal__detail">FM approval</dd>
                            </dl>
                        </template>

                        <!-- Warranty: Coverage Review -->
                        <template if:true={showWarrantySection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Coverage Review</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Coverage Status</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Decision Owner</dt>
                                <dd class="slds-dl_horizontal__detail">{fmDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Warranty Reason</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Decision Date</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Billable</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Resolution Owner</dt>
                                <dd class="slds-dl_horizontal__detail">Customer Success</dd>
                            </dl>
                        </template>

                        <!-- Customer Success: CC Details -->
                        <template if:true={showCustomerCareSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Customer Success Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Issue Source</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Issue Type</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Coverage Status</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Communication Status</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Issue Description</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Escalation</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                            </dl>
                        </template>

                        <!-- Aqua Check: Check Results -->
                        <template if:true={showAquaCheckSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Check Results</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Assigned Tech</dt>
                                <dd class="slds-dl_horizontal__detail">{aquaTechDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Check Window</dt>
                                <dd class="slds-dl_horizontal__detail">{aquaRouteWindowDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Sod Score</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Dry Spots</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Brown Patch</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Runoff</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Tampered</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Timer Issue</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Pet Damage</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Builder Escalation</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Check Notes</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                            </dl>
                        </template>

                        <!-- Aqua Pickup: Pickup Details -->
                        <template if:true={showAquaPickupSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Pickup Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Assigned Tech</dt>
                                <dd class="slds-dl_horizontal__detail">{aquaTechDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Pickup Date</dt>
                                <dd class="slds-dl_horizontal__detail">{aquaRouteWindowDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Equipment to Retrieve</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Inventory Status</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Home Status</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Reconciliation</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                            </dl>
                        </template>

                        <!-- Aqua Emergency: Emergency Details -->
                        <template if:true={showAquaEmergencySection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Emergency Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Reported By</dt>
                                <dd class="slds-dl_horizontal__detail">{contactDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Assigned Tech</dt>
                                <dd class="slds-dl_horizontal__detail">{aquaTechDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Issue</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Emergency Source</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">SLA</dt>
                                <dd class="slds-dl_horizontal__detail">Same-day</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Van Inventory Status</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                            </dl>
                        </template>

                        <!-- Site Visit: Visit Details -->
                        <template if:true={showSiteVisitSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Site Visit Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Visit Reason</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Requested Date</dt>
                                <dd class="slds-dl_horizontal__detail">{scheduledDateDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Access</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">811 Status</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Measurements Collected</dt>
                                <dd class="slds-dl_horizontal__detail">{siteVisitMeasurementsDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Ready Decision</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Blocks Scheduling</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                            </dl>
                        </template>

                        <!-- Irrigation: Irrigation Details -->
                        <template if:true={showIrrigationSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Irrigation Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Issue</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Assigned Tech</dt>
                                <dd class="slds-dl_horizontal__detail">{foremanDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Controller / Zone</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Valve</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Solenoid Count</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Sprinkler Heads</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Water Source</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Billable</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Tech Skill Required</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">SLA</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                            </dl>
                        </template>

                        <!-- Grading: Grading Details -->
                        <template if:true={showGradingSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Grading Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Issue</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">FM Owner</dt>
                                <dd class="slds-dl_horizontal__detail">{fmDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Drainage Concern</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Access Issue</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Slope Risk</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>

                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Builder Responsibility</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Blocks Install</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Decision Needed</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                            </dl>
                        </template>

                        <!-- Loading Ticket: Loading Details -->
                        <template if:true={showLoadingSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Loading Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Loader</dt>
                                <dd class="slds-dl_horizontal__detail">{foremanDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Truck / Crew</dt>
                                <dd class="slds-dl_horizontal__detail">{crewDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Route</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Loaded Status</dt>
                                <dd class="slds-dl_horizontal__detail">{dto.status}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Departure Time</dt>
                                <dd class="slds-dl_horizontal__detail">{saScheduledDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Supervisor Approval</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Loading Notes</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Digital Movement</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                            </dl>
                        </template>

                        <!-- QI / Closeout: Inspection Details -->
                        <template if:true={showQiSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">QI / Closeout Details</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Inspector</dt>
                                <dd class="slds-dl_horizontal__detail">{fmDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Completion Status</dt>
                                <dd class="slds-dl_horizontal__detail">{dto.status}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">QI Score</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Failed Items</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Correction Required</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Invoice Handoff</dt>
                                <dd class="slds-dl_horizontal__detail">—</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Closeout Owner</dt>
                                <dd class="slds-dl_horizontal__detail">{fmDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Closeout Notes</dt>
                                <dd class="slds-dl_horizontal__detail">{descriptionDisplay}</dd>
                            </dl>
                        </template>

                        <!-- ============================================================ -->
                        <!-- END TYPE-SPECIFIC SECTIONS                                   -->
                        <!-- ============================================================ -->

                        <!-- Scheduling: Service Appointment (FSL) -->
                        <template if:true={showSaSection}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Service Appointment (FSL)</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">SA Number</dt>
                                <dd class="slds-dl_horizontal__detail">{saNumberDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">SA Status</dt>
                                <dd class="slds-dl_horizontal__detail">{saStatusDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Scheduled Start</dt>
                                <dd class="slds-dl_horizontal__detail">{saScheduledDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Duration</dt>
                                <dd class="slds-dl_horizontal__detail">{saDurationDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Service Territory</dt>
                                <dd class="slds-dl_horizontal__detail">{saTerritoryDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Actual Start</dt>
                                <dd class="slds-dl_horizontal__detail">{saActualStartDisplay}</dd>
                            </dl>
                        </template>

                        <!-- Scheduling fallback (no SA yet) -->
                        <template if:false={showSaSection}>
                            <hr class="slds-m-vertical_small" />
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Scheduled Date</dt>
                                <dd class="slds-dl_horizontal__detail">{scheduledDateDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Schedule Proposal</dt>
                                <dd class="slds-dl_horizontal__detail">{schedProposalDisplay}</dd>
                            </dl>
                        </template>

                        <!-- Financial -->
                        <hr class="slds-m-vertical_small" />
                        <dl class="slds-dl_horizontal">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Total Price</dt>
                            <dd class="slds-dl_horizontal__detail">{totalPriceDisplay}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Invoice Amount</dt>
                            <dd class="slds-dl_horizontal__detail">{invoiceAmountDisplay}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Line Items</dt>
                            <dd class="slds-dl_horizontal__detail">{lineItemCountDisplay}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Job Health</dt>
                            <dd class="slds-dl_horizontal__detail">{jobHealthDisplay}</dd>
                        </dl>

                        <!-- Scope lines -->
                        <hr class="slds-m-vertical_small" />
                        <p class="slds-text-title_caps slds-m-bottom_x-small">Work Order Scope Lines</p>
                        <template if:true={hasLineItems}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-size_1-of-1">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">#</div></th>
                                        <th scope="col"><div class="slds-truncate">Description</div></th>
                                        <th scope="col"><div class="slds-truncate">Status</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={lineItems} for:item="line">
                                        <tr key={line.id}>
                                            <td>{line.lineNumber}</td>
                                            <td>{line.description}</td>
                                            <td>{line.status}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={hasLineItems}>
                            <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">
                                {lineItemEmptyMessage}
                            </div>
                        </template>

                        <!-- Job complete timestamp -->
                        <template if:true={showJobCompleteTimestamp}>
                            <hr class="slds-m-vertical_small" />
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Job Complete Submitted</dt>
                                <dd class="slds-dl_horizontal__detail">{jobCompleteDisplay}</dd>
                            </dl>
                        </template>

                        <!-- Production Install / Plant Sod Install scope -->
                        <template if:true={showInstallScope}>
                            <hr class="slds-m-vertical_small" />
                            <p class="slds-text-title_caps slds-m-bottom_x-small">Scope</p>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Sod Sqft</dt>
                                <dd class="slds-dl_horizontal__detail">{sodDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Mulch CY</dt>
                                <dd class="slds-dl_horizontal__detail">{mulchDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Trees</dt>
                                <dd class="slds-dl_horizontal__detail">{treeDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Plants / Shrubs</dt>
                                <dd class="slds-dl_horizontal__detail">{plantDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Sod Species</dt>
                                <dd class="slds-dl_horizontal__detail">{sodSpeciesDisplay}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Takeoff Complete</dt>
                                <dd class="slds-dl_horizontal__detail">{takeoffLabel}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Takeoff Mismatch</dt>
                                <dd class="slds-dl_horizontal__detail">{takeoffMismatchLabel}</dd>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Delivery QC</dt>
                                <dd class="slds-dl_horizontal__detail">{deliveryQcDisplay}</dd>
                            </dl>
                        </template>

                    </div>
                </lightning-card>

                <!-- Description / Job Description card (generic types only) -->
                <template if:true={showDescriptionSection}>
                    <lightning-card title="Description" icon-name="utility:description" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <div class="slds-text-body_regular">{descriptionDisplay}</div>
                        </div>
                    </lightning-card>
                </template>

                <!-- Additional notes card -->
                <template if:true={hasNotes}>
                    <lightning-card title="Notes" icon-name="utility:note" class="slds-m-bottom_small">
                        <div class="slds-card__body slds-card__body_inner">
                            <template if:true={dto.invoiceNotes}>
                                <p class="slds-text-title_caps slds-m-bottom_x-small">Invoice Notes</p>
                                <div class="slds-text-body_regular slds-m-bottom_small">{dto.invoiceNotes}</div>
                            </template>
                            <template if:true={dto.outsidePoNotes}>
                                <p class="slds-text-title_caps slds-m-bottom_x-small">Outside PO Notes</p>
                                <div class="slds-text-body_regular">{dto.outsidePoNotes}</div>
                            </template>
                        </div>
                    </lightning-card>
                </template>

                <!-- Red flag banner -->
                <template if:true={dto.redFlagNotes}>
                    <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
                        <b>Red Flag</b>
                        <span class="slds-m-left_x-small">{dto.redFlagNotes}</span>
                    </div>
                </template>

                <!-- Submit job complete -->
                <lightning-card title="Submit Job Complete" icon-name="utility:check" class="slds-m-bottom_small">
                    <div class="slds-card__body slds-card__body_inner">
                        <template if:true={dto.canSubmitComplete}>
                            <lightning-button
                                variant="success"
                                label="Submit Job Complete"
                                onclick={handleSubmitComplete}
                                disabled={isSubmitting}>
                            </lightning-button>
                        </template>
                        <template if:false={dto.canSubmitComplete}>
                            <div class="slds-notify slds-notify_alert slds-theme_warning" role="alert">
                                {dto.submitBlockReason}
                            </div>
                        </template>
                    </div>
                </lightning-card>

            </div>

            <!-- Sidebar -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">

                <!-- Quick Actions -->
                <lightning-card title="Quick Actions" icon-name="utility:actions" class="slds-m-bottom_small">
                    <div class="slds-card__body">
                        <template for:each={quickActions} for:item="action">
                            <div key={action.label} class={action.rowClass}
                                 onclick={handleActionClick}
                                 data-label={action.label}
                                 data-target={action.target}
                                 data-type={action.actionType}>
                                <span class="lwtl-action-icon">{action.icon}</span>
                                <div>
                                    <b>{action.label}</b>
                                    <template if:true={action.note}>
                                        <div class="lwtl-action-note">{action.note}</div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </lightning-card>

                <!-- Gate checklist -->
                <lightning-card title="Gate Checklist" icon-name="utility:checklist" class="slds-m-bottom_small">
                    <div class="slds-card__body">
                        <template for:each={gatesWithClasses} for:item="gate">
                            <div key={gate.label} class={gate.rowClass}>
                                <span class={gate.iconClass}>{gate.icon}</span>
                                <div>
                                    <b>{gate.label}</b>
                                    <div class="lwtl-action-note">{gate.note}</div>
                                </div>
                            </div>
                        </template>
                    </div>
                </lightning-card>

                <!-- Record Summary -->
                <lightning-card title="Record Summary" icon-name="utility:summary">
                    <div class="slds-card__body slds-card__body_inner">
                        <dl class="slds-dl_horizontal">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Work Order #</dt>
                            <dd class="slds-dl_horizontal__detail">{dto.woNumber}</dd>
                            <template if:true={showSaSection}>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">SA Number</dt>
                                <dd class="slds-dl_horizontal__detail">{saNumberDisplay}</dd>
                            </template>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Status</dt>
                            <dd class="slds-dl_horizontal__detail">{dto.status}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Type</dt>
                            <dd class="slds-dl_horizontal__detail">{dto.recordTypeLabel}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Photos</dt>
                            <dd class="slds-dl_horizontal__detail">{photoCountDisplay}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Line Items</dt>
                            <dd class="slds-dl_horizontal__detail">{lineItemCountDisplay}</dd>
                            <template if:true={showCaseLink}>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Source Case</dt>
                                <dd class="slds-dl_horizontal__detail">{caseDisplay}</dd>
                            </template>
                            <template if:true={showParentWoLink}>
                                <dt class="slds-dl_horizontal__label slds-text-color_weak">Source WO</dt>
                                <dd class="slds-dl_horizontal__detail">{parentWoDisplay}</dd>
                            </template>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Total Price</dt>
                            <dd class="slds-dl_horizontal__detail">{totalPriceDisplay}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Invoice</dt>
                            <dd class="slds-dl_horizontal__detail">{invoiceAmountDisplay}</dd>
                        </dl>
                    </div>
                </lightning-card>

            </div>
        </div>

    </template>
</template>
