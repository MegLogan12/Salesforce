<template>
    <lightning-card icon-name="standard:opportunity">
        <span slot="title">Open Opportunities {countLabel}</span>
        <template lwc:if={hasRows}>
            <lightning-datatable
                key-field="id"
                data={rows}
                columns={columns}
                hide-checkbox-column
                resize-column-disabled>
            </lightning-datatable>
            <div slot="footer" class="slds-text-align_right slds-text-body_small">
                Pipeline total:
                <lightning-formatted-number
                    value={totalAmount}
                    format-style="currency"
                    currency-code="USD">
                </lightning-formatted-number>
            </div>
        </template>
        <template lwc:elseif={error}>
            <p class="slds-p-around_medium slds-text-color_error">{error}</p>
        </template>
        <template lwc:else>
            <p class="slds-p-around_medium slds-text-color_weak">
                No open opportunities on connected division accounts.
            </p>
        </template>
    </lightning-card>
</template>
