<template>
    <div class="ops-panel">
        <div class="ops-header">Ops Quick Links</div>

        <div class="ops-section">
            <div class="ops-section-label">Fleet / GPS</div>
            <button class="ops-btn wex" onclick={openWex}>
                <span class="ops-icon">🚛</span>
                <span class="ops-text">
                    <span class="ops-name">WEX Fleet GPS</span>
                    <span class="ops-sub">Live truck locations</span>
                </span>
                <span class="ops-arrow">↗</span>
            </button>
        </div>

        <div class="ops-section">
            <div class="ops-section-label">Weather — {weatherLabel}</div>
            <button class="ops-btn weather" onclick={openWeather}>
                <span class="ops-icon">🌤</span>
                <span class="ops-text">
                    <span class="ops-name">Weather Today</span>
                    <span class="ops-sub">{weatherLabel} forecast</span>
                </span>
                <span class="ops-arrow">↗</span>
            </button>
        </div>

        <div class="ops-section">
            <div class="ops-section-label">People / Scheduling</div>
            <button class="ops-btn rippling" onclick={openRippling}>
                <span class="ops-icon">👥</span>
                <span class="ops-text">
                    <span class="ops-name">Rippling</span>
                    <span class="ops-sub">Time, schedules &amp; people ops</span>
                </span>
                <span class="ops-arrow">↗</span>
            </button>
        </div>

        <div class="ops-divider"></div>

        <div class="ops-section">
            <div class="ops-section-label">Map / Routing</div>
            <button class="ops-btn maps" onclick={openMaps}>
                <span class="ops-icon">🗺</span>
                <span class="ops-text">
                    <span class="ops-name">Google Maps — {mapsLabel}</span>
                    <span class="ops-sub">Route planning &amp; traffic</span>
                </span>
                <span class="ops-arrow">↗</span>
            </button>
        </div>
    </div>
</template>
