<template>
    <div class="app-root"
         onclick={handleClick}
         oninput={handleInput}
         onchange={handleChange}>

        <div class="sf-top">
            <div class="sf-waffle"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
            <div class="sf-app"><div class="sf-app-icon">🏗</div>Field Service</div>
            <div class="sf-search">🔍 Search accounts, communities, lots…</div>
            <div class="sf-icons">
                <div class="sf-ico">⚙</div><div class="sf-ico">?</div><div class="sf-ico">🔔</div>
                <div class="sf-avatar">ML</div>
            </div>
        </div>

        <div class="sf-nav">
            <div class={tabAccCls}  data-action="navigate" data-view="accounts">Accounts <span class="num-badge">4</span></div>
            <div class={tabComCls}  data-action="navigate" data-view="communities">Communities <span class="num-badge">86</span></div>
            <div class={tabLotCls}  data-action="navigate" data-view="lots">Lots <span class="num-badge">2,847</span></div>
            <template lwc:if={detailTabVisible}>
                <div class="sf-tab on">{detailTabLabel}</div>
            </template>
            <div class="nav-right">
                <span class="live-pill"><span class="live-dot"></span>LIVE</span>
                <span class="nav-ts">{navTimestamp}</span>
            </div>
        </div>

        <!-- All view content rendered via manual DOM -->
        <div data-id="main-content" lwc:dom="manual"></div>

    </div>

    <div class={toastCls}>{toastMsg}</div>
</template>
