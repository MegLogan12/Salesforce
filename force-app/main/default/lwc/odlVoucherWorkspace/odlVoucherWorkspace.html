<template>
    <section class="workspace-shell">
        <div class="workspace-header">
            <div>
                <p class="eyebrow">Outdoor Living Console</p>
                <h1>ODL Vouchers</h1>
                <p class="subtitle">Lennar and homebuilder-partner vouchers linked to ODL opportunities.</p>
            </div>
            <div class="header-actions">
                <button class="secondary-btn" onclick={handleRefresh}>Refresh</button>
            </div>
        </div>

        <div class="toolbar">
            <div class="chip-row">
                <template for:each={filters} for:item="filter">
                    <button
                        key={filter.value}
                        class={filter.className}
                        data-value={filter.value}
                        onclick={handleFilterClick}
                    >
                        {filter.label}
                    </button>
                </template>
            </div>
            <lightning-input
                class="search-input"
                type="search"
                variant="label-hidden"
                placeholder="Search vouchers"
                value={searchTerm}
                onchange={handleSearchChange}
            ></lightning-input>
        </div>

        <template if:true={isLoading}>
            <div class="state-card">Loading vouchers...</div>
        </template>

        <template if:true={errorMessage}>
            <div class="state-card error">{errorMessage}</div>
        </template>

        <template if:true={hasRows}>
            <div class="list-card">
                <div class="card-heading">
                    <div>
                        <h2>Voucher Operating List</h2>
                        <p>All Voucher__c records ordered by creation date, newest first.</p>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="workspace-table">
                        <thead>
                            <tr>
                                <th>Voucher Name</th>
                                <th>Voucher Code</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Opportunity</th>
                                <th>Account</th>
                                <th>CTA</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={visibleRows} for:item="row">
                                <tr key={row.id}>
                                    <td>
                                        <button class="link-button" data-id={row.id} onclick={handleOpenRecord}>{row.name}</button>
                                    </td>
                                    <td>{row.voucherCode}</td>
                                    <td>{row.voucherType}</td>
                                    <td>
                                        <span class="status-chip">{row.status}</span>
                                    </td>
                                    <td>{row.opportunityName}</td>
                                    <td>{row.accountName}</td>
                                    <td>
                                        <button class="primary-btn" data-id={row.id} onclick={handleOpenRecord}>Open</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>

        <template if:true={showEmptyState}>
            <div class="state-card">No vouchers match the current filters.</div>
        </template>
    </section>
</template>
