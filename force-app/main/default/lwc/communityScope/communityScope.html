<template>
    <template if:true={loaded}>
        <div class="card">
            <div class="card-header">
                <div class="card-icon">S</div>
                <h2 class="card-title">Scope Summary</h2>
            </div>
            <div class="card-body">
                <template if:true={hasWorkTypeRows}>
                    <div class="section-label">Work Orders by Type</div>
                    <table class="odl-table">
                        <thead>
                            <tr>
                                <th>Work Type</th>
                                <th class="num-col">Count</th>
                                <th class="num-col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={workTypeRows} for:item="row">
                                <tr key={row.workType}>
                                    <td>{row.workType}</td>
                                    <td class="num-col">{row.count}</td>
                                    <td class="num-col">
                                        <button class="btn-inline" data-type={row.workType} onclick={handleViewType}>View</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasWorkTypeRows}>
                    <div class="empty-state">No work orders linked to this community.</div>
                </template>
                <template if:true={hasChangeOrders}>
                    <div class="section-label top-gap">Recent Change Orders</div>
                    <table class="odl-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={changeOrders} for:item="co">
                                <tr key={co.id}>
                                    <td>{co.name}</td>
                                    <td>{co.status}</td>
                                    <td>
                                        <template if:true={co.createdDate}>
                                            <lightning-formatted-date-time
                                                value={co.createdDate}
                                                year="numeric" month="short" day="numeric">
                                            </lightning-formatted-date-time>
                                        </template>
                                    </td>
                                    <td>
                                        <button class="btn-inline" data-id={co.id} onclick={handleViewChangeOrder}>View</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
            </div>
            <div class="card-footer">
                <button class="btn btn-primary" onclick={handleViewScope}>View Scope</button>
            </div>
        </div>
    </template>
    <template if:false={loaded}>
        <div class="loading-state">
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </div>
    </template>
</template>
