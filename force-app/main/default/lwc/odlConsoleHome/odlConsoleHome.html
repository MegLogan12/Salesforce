<template>
    <div class="odl-home">

        <!-- Loading skeleton -->
        <template if:true={isLoading}>
            <div class="odl-loading">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error state -->
        <template if:true={hasError}>
            <div class="odl-error-state">
                <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
                <p>{error}</p>
                <lightning-button label="Retry" onclick={handleRefresh}></lightning-button>
            </div>
        </template>

        <!-- Main content -->
        <template if:false={isLoading}>
            <template if:false={hasError}>

                <!-- ── Page Header ─────────────────────────────────────── -->
                <div class="page-header">
                    <div class="page-header-icon">
                        <lightning-icon icon-name="utility:opportunity" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div>
                        <h1 class="page-title">ODL Console</h1>
                        <p class="page-sub">Open opportunities, tasks, and leads at a glance</p>
                    </div>
                    <div class="page-header-actions">
                        <button class="header-btn-primary" onclick={handleNewOpportunity}>+ New Opportunity</button>
                    </div>
                </div>

                <!-- ── KPI Row ─────────────────────────────────────────── -->
                <div class="kpi-row">
                    <div class="kpi-chip kc-orange" onclick={handleOpenOpportunities} title="View all open ODL opportunities">
                        <div class="kpi-number">{totalOpps}</div>
                        <div class="kpi-label">Open Opportunities</div>
                    </div>
                    <div class="kpi-chip kc-blue" onclick={handleOpenOpportunities} title="View UMB opportunities">
                        <div class="kpi-number">{umbCount}</div>
                        <div class="kpi-label">UMB</div>
                    </div>
                    <div class="kpi-chip kc-teal" onclick={handleOpenOpportunities} title="View UpgradeMyBackyard opportunities">
                        <div class="kpi-number">{odlCount}</div>
                        <div class="kpi-label">UpgradeMyBackyard</div>
                    </div>
                    <div class="kpi-chip kc-purple" onclick={handleOpenOpportunities} title="View Design Build opportunities">
                        <div class="kpi-number">{designBuildCount}</div>
                        <div class="kpi-label">Design Build</div>
                    </div>
                    <div class="kpi-chip kc-amber" onclick={handleOpenTasks} title="View overdue follow-up tasks">
                        <div class="kpi-number">{overdueTasks}</div>
                        <div class="kpi-label">Overdue Tasks</div>
                    </div>
                    <div class="kpi-chip kc-slate" onclick={handleOpenLeads} title="View open leads">
                        <div class="kpi-number">{openLeads}</div>
                        <div class="kpi-label">Open Leads</div>
                    </div>
                </div>

                <!-- ── Body: main + rail ───────────────────────────────── -->
                <div class="body-layout">

                    <!-- Main column -->
                    <div class="body-main">

                        <!-- Pipeline by LOB -->
                        <div class="card">
                            <div class="card-header">
                                <div class="card-icon" style="background:var(--odl-orange)">
                                    <lightning-icon icon-name="utility:opportunity" size="x-small" variant="inverse"></lightning-icon>
                                </div>
                                <h2 class="card-title">Pipeline by Line of Business</h2>
                                <lightning-button-icon
                                    icon-name="utility:refresh"
                                    alternative-text="Refresh"
                                    variant="bare"
                                    onclick={handleRefresh}
                                    class="card-refresh"
                                ></lightning-button-icon>
                            </div>
                            <table class="odl-table">
                                <thead>
                                    <tr>
                                        <th>Line of Business</th>
                                        <th class="num-col">Open Opportunities</th>
                                        <th class="num-col">Pipeline</th>
                                        <th class="num-col">Quote Requested</th>
                                        <th class="num-col">Consultation Scheduled</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={lobRows} for:item="row">
                                        <tr key={row.lob}>
                                            <td>
                                                <span class="lob-badge">{row.displayLabel}</span>
                                            </td>
                                            <td class="num-col">
                                                <template if:false={row.isEmpty}>
                                                    <a class="num-link" onclick={handleOpenOpportunities}>{row.openOpps}</a>
                                                </template>
                                                <template if:true={row.isEmpty}>
                                                    <span class="muted">0</span>
                                                </template>
                                            </td>
                                            <td class="num-col">{row.pipelineFormatted}</td>
                                            <td class="num-col">
                                                <template if:false={row.isEmpty}>{row.quotesRequested}</template>
                                                <template if:true={row.isEmpty}><span class="muted">0</span></template>
                                            </td>
                                            <td class="num-col">
                                                <template if:false={row.isEmpty}>{row.consultations}</template>
                                                <template if:true={row.isEmpty}><span class="muted">0</span></template>
                                            </td>
                                            <td>
                                                <button class="btn-inline" onclick={handleOpenOpportunities}>View</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <div class="card-footer">
                                <lightning-button
                                    label="View All Opportunities"
                                    variant="neutral"
                                    onclick={handleOpenOpportunities}
                                ></lightning-button>
                            </div>
                        </div>

                        <!-- Overdue Activity -->
                        <div class="card">
                            <div class="card-header">
                                <div class="card-icon" style="background:var(--odl-purple)">
                                    <lightning-icon icon-name="utility:task" size="x-small" variant="inverse"></lightning-icon>
                                </div>
                                <h2 class="card-title">Overdue Follow-Ups on Open Opportunities</h2>
                                <button class="btn-inline" onclick={handleNewTask}>+ New Task</button>
                            </div>

                            <template if:true={hasActivity}>
                                <table class="odl-table">
                                    <thead>
                                        <tr>
                                            <th>Opportunity</th>
                                            <th>Task</th>
                                            <th>Due</th>
                                            <th>Overdue By</th>
                                            <th>Owner</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={recentActivity} for:item="row">
                                            <tr key={row.id}>
                                                <td>
                                                    <a  class="rec-link"
                                                        data-related={row.relatedId}
                                                        onclick={handleOpenRelated}
                                                    >{row.relatedName}</a>
                                                </td>
                                                <td>
                                                    <a  class="rec-link"
                                                        data-id={row.id}
                                                        onclick={handleOpenRecord}
                                                    >{row.subject}</a>
                                                </td>
                                                <td class="muted">{row.dueDate}</td>
                                                <td>
                                                    <span class="status-chip chip-alert">{row.daysOverdue}</span>
                                                </td>
                                                <td class="muted">{row.ownerName}</td>
                                                <td>
                                                    <button class="btn-inline" data-id={row.id} onclick={handleCompleteTask}>Complete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>

                            <template if:false={hasActivity}>
                                <div class="empty-state">
                                    <lightning-icon icon-name="utility:check" size="small" variant="success"></lightning-icon>
                                    <p>No overdue follow-up tasks on open ODL opportunities.</p>
                                    <button class="btn btn-primary" onclick={handleNewTask}>Create Task</button>
                                </div>
                            </template>

                            <div class="card-footer">
                                <lightning-button
                                    label="View All Tasks"
                                    variant="neutral"
                                    onclick={handleOpenTasks}
                                ></lightning-button>
                            </div>
                        </div>

                    </div><!-- /body-main -->

                    <!-- Rail column -->
                    <div class="body-rail">
                        <div class="card">
                            <div class="card-header">
                                <div class="card-icon" style="background:var(--odl-orange)">
                                    <lightning-icon icon-name="utility:lightning_strike" size="x-small" variant="inverse"></lightning-icon>
                                </div>
                                <h2 class="card-title">Quick Actions</h2>
                            </div>
                            <div class="qa-list">
                                <div class="qa-item" onclick={handleOpenOpportunities}>
                                    <lightning-icon icon-name="utility:opportunity" size="x-small"></lightning-icon>
                                    <span>View open opportunities</span>
                                </div>
                                <div class="qa-item" onclick={handleOpenLeads}>
                                    <lightning-icon icon-name="utility:lead" size="x-small"></lightning-icon>
                                    <span>View open leads</span>
                                </div>
                                <div class="qa-item" onclick={handleOpenTasks}>
                                    <lightning-icon icon-name="utility:task" size="x-small"></lightning-icon>
                                    <span>Review overdue tasks</span>
                                </div>
                                <div class="qa-item" onclick={handleNewOpportunity}>
                                    <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                                    <span>New opportunity</span>
                                </div>
                                <div class="qa-item" onclick={handleNewLead}>
                                    <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                                    <span>New lead</span>
                                </div>
                                <div class="qa-item" onclick={handleOpenReports}>
                                    <lightning-icon icon-name="utility:report" size="x-small"></lightning-icon>
                                    <span>Open reports</span>
                                </div>
                            </div>
                        </div>

                        <!-- Pipeline summary card -->
                        <div class="card card-summary">
                            <div class="card-header">
                                <div class="card-icon" style="background:var(--odl-teal)">
                                    <lightning-icon icon-name="utility:currency" size="x-small" variant="inverse"></lightning-icon>
                                </div>
                                <h2 class="card-title">UMB</h2>
                            </div>
                            <div class="summary-row">
                                <span class="summary-label">Open Opportunities</span>
                                <span class="summary-value">{umbCount}</span>
                            </div>
                            <div class="summary-row">
                                <span class="summary-label">Pipeline Amount</span>
                                <span class="summary-value">{umbPipeline}</span>
                            </div>
                            <div class="summary-divider"></div>
                            <div class="card-header" style="margin-top:12px">
                                <div class="card-icon" style="background:var(--odl-blue)">
                                    <lightning-icon icon-name="utility:currency" size="x-small" variant="inverse"></lightning-icon>
                                </div>
                                <h2 class="card-title">UpgradeMyBackyard</h2>
                            </div>
                            <div class="summary-row">
                                <span class="summary-label">Open Opportunities</span>
                                <span class="summary-value">{odlCount}</span>
                            </div>
                            <div class="summary-row">
                                <span class="summary-label">Pipeline Amount</span>
                                <span class="summary-value">{odlPipeline}</span>
                            </div>
                        </div>

                    </div><!-- /body-rail -->

                </div><!-- /body-layout -->

            </template>
        </template>

    </div>
</template>
