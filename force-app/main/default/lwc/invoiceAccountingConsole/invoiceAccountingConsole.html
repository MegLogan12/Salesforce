<template>
    <div class="inv-wrap">

        <!-- G5 Amber Warning Banner -->
        <div class="flagnote">
            <strong>Gate G5 open:</strong> the accounting system is not selected yet.
            Invoices generate and track here; the export target (QuickBooks or other) is pending Finance.
            Owner: Finance &middot; Action: pick the system, then wire the Paid &rarr; accounting export.
        </div>

        <!-- KPI Strip -->
        <div class="hi">
            <div class="hi-cell">
                <div class="hi-lab">Ready to Invoice</div>
                <div class="hi-val">{readyCount}</div>
            </div>
            <div class="hi-cell">
                <div class="hi-lab">Invoiced</div>
                <div class="hi-val">{invoicedCount}</div>
            </div>
            <div class="hi-cell">
                <div class="hi-lab">Paid</div>
                <div class="hi-val">{paidCount}</div>
            </div>
            <div class="hi-cell">
                <div class="hi-lab">Export (G5)</div>
                <div class="hi-val sm"><span class="chip c-amber">pending G5</span></div>
            </div>
        </div>

        <!-- Subtabs -->
        <div class="subtabs">
            <div class={readyTabClass}    data-tab="ready"    onclick={handleTabClick}>Ready to Invoice</div>
            <div class={invoicedTabClass} data-tab="invoiced" onclick={handleTabClick}>Invoiced</div>
            <div class={paidTabClass}     data-tab="paid"     onclick={handleTabClick}>Paid</div>
        </div>

        <!-- Ready to Invoice -->
        <template if:true={isReadyTab}>
            <div class="cardbox">
                <div class="cardbox-header">
                    Ready to invoice
                    <span class="count">{readyCount} jobs</span>
                </div>
                <lightning-datatable
                    key-field="workOrderId"
                    data={readyRows}
                    columns={readyCols}
                    row-actions={readyActions}
                    onrowaction={handleReadyAction}
                    hide-checkbox-column>
                </lightning-datatable>
                <template if:false={hasReadyRows}>
                    <div class="empty-note">Nothing waiting to invoice.</div>
                </template>
            </div>
        </template>

        <!-- Invoiced -->
        <template if:true={isInvoicedTab}>
            <div class="cardbox">
                <div class="cardbox-header">
                    Invoiced
                    <span class="count">{invoicedCount} open</span>
                </div>
                <lightning-datatable
                    key-field="invoiceId"
                    data={invoicedRows}
                    columns={invoiceCols}
                    row-actions={invoicedActions}
                    onrowaction={handleInvoicedAction}
                    hide-checkbox-column>
                </lightning-datatable>
                <template if:false={hasInvoicedRows}>
                    <div class="empty-note">Invoices you generate appear here. Mark paid when payment clears.</div>
                </template>
            </div>
        </template>

        <!-- Paid -->
        <template if:true={isPaidTab}>
            <div class="cardbox">
                <div class="cardbox-header">
                    Paid
                    <span class="count">{paidCount}</span>
                </div>
                <lightning-datatable
                    key-field="invoiceId"
                    data={paidRows}
                    columns={paidCols}
                    hide-checkbox-column>
                </lightning-datatable>
                <template if:false={hasPaidRows}>
                    <div class="empty-note">Paid invoices export to accounting once G5 is decided.</div>
                </template>
                <div class="inner-note">
                    <div class="flagnote">Paid invoices queue here and export to the accounting system once G5 is resolved.</div>
                </div>
            </div>
        </template>

    </div>
</template>
