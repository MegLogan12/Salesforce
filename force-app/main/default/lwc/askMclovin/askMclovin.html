<template>
    <!-- Viewport overlay — clicks pass through except on .pe elements -->
    <div class={overlayClass}>

        <!-- Main character: positioned by mcStyle (fixed coords) -->
        <div class="mc pe" style={mcStyle}>

            <!-- BADGE: minimized floating head -->
            <template lwc:if={isBadge}>
                <div class="badge grab" onmousedown={onDragStart} ontouchstart={onDragStart} onclick={onBadgeClick} title="Ask mcLOVIN'">
                    <img src={headUrl} alt="Ask mcLOVIN'">
                    <div class="pulse">&#10022;</div>
                </div>
            </template>

            <!-- ENTER / WALKING: full body sliding across screen -->
            <template lwc:if={isEntering}>
                <img class="walker grab" src={fullUrl} alt="mcLOVIN walking"
                     onmousedown={onDragStart} ontouchstart={onDragStart}>
            </template>

            <!-- PERCH: standing on form edge, clickable -->
            <template lwc:if={isPerch}>
                <img class="perched grab" src={fullUrl} alt="mcLOVIN perched"
                     onclick={onPerchClick} onmousedown={onDragStart} ontouchstart={onDragStart}>
            </template>

            <!-- EDGE HANG: gripping screen edge -->
            <template lwc:if={isEdge}>
                <img class="edge-hang grab" src={peekUrl} alt="mcLOVIN"
                     onclick={onEdgeClick} onmousedown={onDragStart} ontouchstart={onDragStart}>
            </template>

            <!-- WELCOME: open card with chat -->
            <template lwc:if={isOpen}>
                <div class="open">
                    <button class="close pe" title="Minimize" onclick={minimize}>&#8211;</button>
                    <img class="body grab" src={fullUrl} alt="mcLOVIN"
                         onmousedown={onDragStart} ontouchstart={onDragStart}>
                    <div class="panel">
                        <div class="bubble show">
                            <span class="spark">&#10022;</span>
                            Hey, I&rsquo;m <b>Ask mcLOVIN&rsquo;</b>. Drop the details here and I&rsquo;ll find the right path.
                            <span class="tail" style="left:18px;bottom:-8px"></span>
                        </div>
                        <div class="chips">
                            <span class="chip pe" data-q="po" onclick={onChip}>Upload PO</span>
                            <span class="chip pe" data-q="scope" onclick={onChip}>Scope</span>
                            <span class="chip pe" data-q="account" onclick={onChip}>New Account</span>
                            <span class="chip pe" data-q="homeowner" onclick={onChip}>Homeowner Intake</span>
                            <span class="chip pe" data-q="find" onclick={onChip}>Find Existing Job</span>
                            <span class="chip pe" data-q="missing" onclick={onChip}>What&rsquo;s Missing?</span>
                        </div>
                        <div class="askbar pe">
                            <input type="text" placeholder="Ask mcLOVIN' anything..." onkeyup={onAskKey} disabled={isThinking}>
                            <button onclick={onSend} disabled={isThinking}>
                                <template lwc:if={isThinking}>...</template>
                                <template lwc:else>Ask</template>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Floating nudge bubble — positioned at fixed screen coords by nudgeStyle -->
        <div class={nudgeClass} style={nudgeStyle}>
            <span class="spark">&#10022;</span><span>{nudgeText}</span>
            <span class="tail" style="right:-8px;bottom:22px"></span>
        </div>

        <!-- Peek from right edge (timer-based) -->
        <div class={peekClass}>
            <div class={peekBubbleClass}>
                <span class="spark">&#10022;</span><span>{nudgeText}</span>
                <span class="tail" style="right:-8px;bottom:24px"></span>
            </div>
            <img src={peekUrl} alt="peek">
        </div>
    </div>
</template>
