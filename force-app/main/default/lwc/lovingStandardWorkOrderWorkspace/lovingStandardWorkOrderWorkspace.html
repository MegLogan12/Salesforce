<template>
    <div class={shellClassName}>
        <template if:true={error}>
            <div class="ab ab-r"><div class="ab-ic">⚠</div><div>{error.body.message}</div></div>
        </template>
        <template if:true={hasData}>
            <div class="hb-top">
                <div class="hb-waffle" aria-hidden="true">
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <div class="hb-app">
                    <div class="hb-app-icon">HB</div>
                    <span>{builderAppLabel}</span>
                </div>
                <div class="hb-search">{builderSearchPlaceholder}</div>
                <div class="hb-icons" aria-hidden="true">
                    <div class="hb-ico">⚙</div>
                    <div class="hb-ico">?</div>
                    <div class="hb-ico">🔔</div>
                    <div class="hb-avatar">{userInitials}</div>
                </div>
            </div>

            <div class="hb-nav">
                <template for:each={builderNavTabs} for:item="tab">
                    <button
                        type="button"
                        key={tab.id}
                        class={tab.className}
                        data-id={tab.id}
                        onclick={handleBuilderTabClick}
                        disabled={tab.disabled}>
                        {tab.label}
                    </button>
                </template>
            </div>

            <div class="hero">
                <div class="hero-band">
                    <div class="hero-kicker">{roleLabel}</div>
                    <div class="hero-actions">
                        <button class="sf-btn primary btn-primary" onclick={handleCompleteTakeoff}>Complete Takeoff</button>
                        <button class="sf-btn primary btn-primary" onclick={handleLogIssue}>Log Issue</button>
                        <button class="sf-btn primary btn-primary" onclick={handleCreateQuoteRequest}>Create Quote Request</button>
                        <button class="sf-btn" onclick={handleEditWorkOrder}>Edit</button>
                        <button class="sf-btn" onclick={handleNewTask}>New Task</button>
                        <button class="sf-btn" onclick={handleNewNote}>Add Note</button>
                        <button class="sf-btn" onclick={handleOpenFiles}>Files</button>
                        <button class="sf-btn" onclick={handleOpenTakeoffRecord} disabled={disableOpenTakeoffRecord}>Open Takeoff</button>
                        <button class="sf-btn primary btn-primary" onclick={openServiceAppointment} disabled={disableOpenServiceAppointment}>Open Appointment</button>
                        <template if:true={isParentMode}>
                            <button class="sf-btn" onclick={handleCreateChildren} disabled={disableCreateChildren}>Create / Sync Sub WorkOrders</button>
                        </template>
                        <template if:true={isChildMode}>
                            <button class="sf-btn" onclick={openParentWorkOrder} disabled={disableOpenParentWorkOrder}>Open Parent</button>
                        </template>
                    </div>
                </div>
                <div class="hero-main">
                    <div class="hero-mark">WO</div>
                    <div class="hero-title-block">
                        <div class="hero-title">{header.workOrderNumber} • {header.subject}</div>
                        <div class="hero-subtitle">{commandSubtitle}</div>
                    </div>
                    <div class="hero-strip">
                        <div class="hero-pill">
                            <span class="hero-pill-label">{isParentMode ? 'Master Status' : 'Execution Status'}</span>
                            <span class="hero-pill-value">{header.status}</span>
                        </div>
                        <div class="hero-pill">
                            <span class="hero-pill-label">Billing</span>
                            <span class="hero-pill-value">{header.billingState}</span>
                        </div>
                        <div class="hero-pill">
                            <span class="hero-pill-label">QI Outcome</span>
                            <span class="hero-pill-value">{header.qiStatus}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="kpi-grid">
                <template for:each={kpis} for:item="kpi">
                    <div key={kpi.label} class={kpi.className}>
                        <div class="kn">{kpi.value}</div>
                        <div class="kl">{kpi.label}</div>
                        <div class="ksub">{kpi.detail}</div>
                    </div>
                </template>
            </div>

            <div class="sf-nav">
                <template for:each={tabs} for:item="tab">
                    <button key={tab.id} class={tab.className} data-id={tab.id} onclick={handleTab}>{tab.label}</button>
                </template>
            </div>

            <div class="sf-body">
                <template if:true={showSummary}>
                    <div class="grid-stack two-up">
                        <div class="card">
                            <div class="ch"><div class="ci">◎</div><h3>{isParentMode ? 'Lot Identity' : 'Execution Identity'}</h3></div>
                            <div class="cb meta-grid">
                                <template for:each={identityRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="card">
                            <div class="ch"><div class="ci">#</div><h3>{isParentMode ? 'Master State' : 'Execution State'}</h3></div>
                            <div class="cb meta-grid">
                                <template for:each={stateRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="grid-stack two-up top-gap">
                        <div class="card">
                            <div class="ch"><div class="ci">↳</div><h3>{isParentMode ? 'Execution Chain' : 'Parent Execution Chain'}</h3></div>
                            <div class="cb meta-grid">
                                <template for:each={executionChainRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="card">
                            <div class="ch"><div class="ci">$</div><h3>Financial Truth</h3></div>
                            <div class="cb meta-grid">
                                <template for:each={financialOverviewRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="card top-gap">
                        <div class="ch"><div class="ci">▣</div><h3>Proof + Records</h3></div>
                        <div class="cb meta-grid four-up">
                            <template for:each={recordOverviewRows} for:item="row">
                                <div key={row.label} class="meta-item">
                                    <div class="meta-label">{row.label}</div>
                                    <div class="meta-value">{row.value}</div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <template if:true={showExecution}>
                    <template if:true={isParentMode}>
                        <div class="grid-stack two-up">
                            <div class="card">
                                <div class="ch"><div class="ci">↳</div><h3>Sub WorkOrders</h3></div>
                                <div class="cb">
                                    <template if:true={childWorkOrders.length}>
                                        <table class="tbl">
                                            <thead><tr><th>WorkOrder</th><th>Type</th><th>Status</th><th>QI Status</th><th>Blocker</th><th class="num">Appointments</th><th class="num">Line Items</th><th>Subject</th><th></th></tr></thead>
                                            <tbody>
                                                <template for:each={childWorkOrders} for:item="row">
                                                    <tr key={row.workOrderId}>
                                                        <td>{row.workOrderNumber}</td>
                                                        <td>{row.workType}</td>
                                                        <td>{row.status}</td>
                                                        <td>{row.qiStatus}</td>
                                                        <td>{row.blockerState}</td>
                                                        <td class="num">{row.serviceAppointmentCount}</td>
                                                        <td class="num">{row.lineItemCount}</td>
                                                        <td>{row.subject}</td>
                                                        <td><button class="sf-btn dark" data-id={row.workOrderId} onclick={handleOpenChildWorkOrder}>Open</button></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </template>
                                    <template if:false={childWorkOrders.length}>
                                        <div class="empty-note">0 sub work orders linked.</div>
                                    </template>
                                </div>
                            </div>

                            <div class="card">
                                <div class="ch"><div class="ci">⧉</div><h3>Sub WorkOrder Appointments</h3></div>
                                <div class="cb">
                                    <template if:true={childAppointments.length}>
                                        <table class="tbl">
                                            <thead><tr><th>Appointment</th><th>Status</th><th>Child WorkOrder</th><th>Type</th><th>Assigned Resource</th><th>Scheduled Window</th><th></th></tr></thead>
                                            <tbody>
                                                <template for:each={childAppointments} for:item="row">
                                                    <tr key={row.serviceAppointmentId}>
                                                        <td>{row.appointmentNumber}</td>
                                                        <td>{row.status}</td>
                                                        <td>{row.workOrderNumber}</td>
                                                        <td>{row.workType}</td>
                                                        <td>{row.assignedResource}</td>
                                                        <td>{row.scheduledWindow}</td>
                                                        <td><button class="sf-btn dark" data-id={row.serviceAppointmentId} onclick={handleOpenServiceAppointmentRow}>Open</button></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </template>
                                    <template if:false={childAppointments.length}>
                                        <div class="empty-note">0 sub work order appointments linked.</div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={isChildMode}>
                        <div class="card">
                            <div class="ch"><div class="ci">⧉</div><h3>Assigned Appointments</h3></div>
                            <div class="cb">
                                <template if:true={relatedAppointments.length}>
                                    <table class="tbl">
                                        <thead><tr><th>Appointment</th><th>Status</th><th>Scheduled Window</th><th>Territory</th><th>Assigned Resource</th><th></th></tr></thead>
                                        <tbody>
                                            <template for:each={relatedAppointments} for:item="row">
                                                <tr key={row.serviceAppointmentId}>
                                                    <td>{row.appointmentNumber}</td>
                                                    <td>{row.status}</td>
                                                    <td>{row.scheduledWindow}</td>
                                                    <td>{row.serviceTerritory}</td>
                                                    <td>{row.assignedResource}</td>
                                                    <td><button class="sf-btn dark" data-id={row.serviceAppointmentId} onclick={handleOpenServiceAppointmentRow}>Open</button></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                                <template if:false={relatedAppointments.length}>
                                    <div class="empty-note">0 Appointments linked.</div>
                                </template>
                            </div>
                        </div>
                    </template>
                </template>

                <template if:true={showTakeoff}>
                    <div class="grid-stack two-up">
                        <div class="card">
                            <div class="ch"><div class="ci">△</div><h3>{isParentMode ? 'Parent Takeoff' : 'Parent Takeoff Header'}</h3></div>
                            <div class="cb meta-grid">
                                <template for:each={takeoffHeaderRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="card">
                            <div class="ch"><div class="ci">↯</div><h3>Routing + Sub WorkOrder Summary</h3></div>
                            <div class="cb meta-grid">
                                <template for:each={takeoffRoutingRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="grid-stack two-up top-gap">
                        <div class="card">
                            <div class="ch"><div class="ci">☰</div><h3>{isParentMode ? 'Takeoff Review' : 'Parent Takeoff Review'}</h3></div>
                            <div class="cb">
                                <template if:true={showTakeoffEditor}>
                                    <div class="form-grid">
                                        <label class="form-field">
                                            <span class="meta-label">Takeoff Review Status</span>
                                            <select class="field-input" data-field="status" value={takeoffDraft.status} onchange={handleTakeoffFieldChange}>
                                                <template for:each={takeoffStatusOptions} for:item="option">
                                                    <option key={option.value} value={option.value}>{option.label}</option>
                                                </template>
                                            </select>
                                        </label>
                                        <div class="meta-item">
                                            <div class="meta-label">Package Match State</div>
                                            <div class="meta-value">{packageMatchState}</div>
                                        </div>
                                        <template for:each={takeoffStateRows} for:item="row">
                                            <div key={row.label} class="meta-item">
                                                <div class="meta-label">{row.label}</div>
                                                <div class="meta-value">{row.value}</div>
                                            </div>
                                        </template>
                                        <div class="meta-item">
                                            <div class="meta-label">Lines Requiring Review</div>
                                            <div class="meta-value">{routedReviewCount}</div>
                                        </div>
                                        <label class="form-field checkbox-row">
                                            <input type="checkbox" data-field="mismatchFound" checked={takeoffDraft.mismatchFound} onchange={handleTakeoffFieldChange} />
                                            <span>Customer Success Review Required</span>
                                        </label>
                                        <label class="form-field checkbox-row">
                                            <input type="checkbox" data-field="csApproved" checked={takeoffDraft.csApproved} onchange={handleTakeoffFieldChange} />
                                            <span>Customer Success Approved</span>
                                        </label>
                                        <label class="form-field">
                                            <span class="meta-label">Return Reason</span>
                                            <textarea class="field-input field-textarea" data-field="returnReason" value={takeoffDraft.returnReason} onchange={handleTakeoffFieldChange}></textarea>
                                        </label>
                                        <label class="form-field">
                                            <span class="meta-label">Mismatch Notes</span>
                                            <textarea class="field-input field-textarea" data-field="mismatchNotes" value={takeoffDraft.mismatchNotes} onchange={handleTakeoffFieldChange}></textarea>
                                        </label>
                                        <label class="form-field">
                                            <span class="meta-label">Takeoff Notes</span>
                                            <textarea class="field-input field-textarea" data-field="notes" value={takeoffDraft.notes} onchange={handleTakeoffFieldChange}></textarea>
                                        </label>
                                    </div>
                                    <div class="action-row">
                                        <button class="sf-btn primary" onclick={handleSaveTakeoffReview} disabled={isSavingTakeoff}>Save Takeoff Review</button>
                                        <button class="sf-btn" onclick={handleOpenTakeoffRecord} disabled={disableOpenTakeoffRecord}>Open Takeoff Record</button>
                                        <button class="sf-btn" onclick={handleCreateChildren} disabled={disableCreateChildren}>Create / Sync Sub WorkOrders</button>
                                    </div>
                                </template>
                                <template if:false={showTakeoffEditor}>
                                    <div class="meta-grid">
                                        <template for:each={takeoffStateRows} for:item="row">
                                            <div key={row.label} class="meta-item">
                                                <div class="meta-label">{row.label}</div>
                                                <div class="meta-value">{row.value}</div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="card">
                            <div class="ch"><div class="ci">☑</div><h3>Takeoff Checklist</h3></div>
                            <div class="cb">
                                <div class="meta-grid">
                                    <div class="meta-item"><div class="meta-label">Checklist Status</div><div class="meta-value">{takeoffChecklist.status}</div></div>
                                    <div class="meta-item"><div class="meta-label">Checklist Type</div><div class="meta-value">{takeoffChecklist.checklistType}</div></div>
                                    <div class="meta-item"><div class="meta-label">Completed By</div><div class="meta-value">{takeoffChecklist.completedBy}</div></div>
                                    <div class="meta-item"><div class="meta-label">Completed Date</div><div class="meta-value">{takeoffChecklist.completedDate}</div></div>
                                </div>
                                <template if:true={checklistItems.length}>
                                    <table class="tbl">
                                        <thead><tr><th>Checklist Item</th><th>Status</th><th>Requirement</th><th>Notes</th><th></th></tr></thead>
                                        <tbody>
                                            <template for:each={checklistItems} for:item="item">
                                                <tr key={item.checklistItemId}>
                                                    <td>{item.label}</td>
                                                    <td>
                                                        <template if:true={showTakeoffEditor}>
                                                            <select class="field-input" data-id={item.checklistItemId} value={item.statusValue} onchange={handleChecklistStatusChange}>
                                                                <template for:each={item.statusOptions} for:item="option">
                                                                    <option key={option.value} value={option.value}>{option.label}</option>
                                                                </template>
                                                            </select>
                                                        </template>
                                                        <template if:false={showTakeoffEditor}>{item.status}</template>
                                                    </td>
                                                    <td>{item.requiredLabel} · {item.photoRequiredLabel}</td>
                                                    <td>
                                                        <template if:true={showTakeoffEditor}>
                                                            <textarea class="field-input field-textarea mini" data-id={item.checklistItemId} value={item.notesValue} onchange={handleChecklistNotesChange}></textarea>
                                                        </template>
                                                        <template if:false={showTakeoffEditor}>{item.notes}</template>
                                                    </td>
                                                    <td>
                                                        <template if:true={showTakeoffEditor}>
                                                            <button class="sf-btn" data-id={item.checklistItemId} onclick={handleSaveChecklistItem}>Save</button>
                                                        </template>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                                <template if:false={checklistItems.length}>
                                    <div class="empty-note">0 checklist items linked.</div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="card top-gap">
                        <div class="ch"><div class="ci">≡</div><h3>Takeoff Line Items</h3></div>
                        <div class="cb">
                            <template if:true={takeoffLines.length}>
                                <table class="tbl">
                                    <thead><tr><th>Description</th><th class="num">Ordered</th><th class="num">Verified</th><th class="num">Measured</th><th>Unit</th><th class="num">Unit Price</th><th>Execution Scope</th><th>Routing Result</th><th>Determination</th><th>Substitution</th><th>Variance</th><th>Notes</th><th></th></tr></thead>
                                    <tbody>
                                        <template for:each={takeoffLines} for:item="line">
                                            <tr key={line.takeoffLineId}>
                                                <td>{line.description}</td>
                                                <td class="num">{line.orderedQuantity}</td>
                                                <td class="num">{line.verifiedQuantity}</td>
                                                <td class="num">{line.measuredQuantity}</td>
                                                <td>{line.unit}</td>
                                                <td class="num">{line.unitPrice}</td>
                                                <td>
                                                    <template if:true={showTakeoffEditor}>
                                                        <select class="field-input" data-id={line.takeoffLineId} value={line.executionScopeValue} onchange={handleTakeoffLineScopeChange}>
                                                            <template for:each={line.scopeOptions} for:item="option">
                                                                <option key={option.value} value={option.value}>{option.label}</option>
                                                            </template>
                                                        </select>
                                                    </template>
                                                    <template if:false={showTakeoffEditor}>{line.executionScope}</template>
                                                </td>
                                                <td>{line.routeState}</td>
                                                <td>{line.determination}</td>
                                                <td>{line.substitutionState}</td>
                                                <td>{line.variance}</td>
                                                <td>{line.notes}</td>
                                                <td>
                                                    <template if:true={showTakeoffEditor}>
                                                        <button class="sf-btn" data-id={line.takeoffLineId} onclick={handleSaveTakeoffLineScope}>Save</button>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template if:false={takeoffLines.length}>
                                <div class="empty-note">0 takeoff lines linked.</div>
                            </template>
                        </div>
                    </div>
                </template>

                <template if:true={showScope}>
                    <div class="card">
                        <div class="ch"><div class="ci">≡</div><h3>{isParentMode ? 'Lot-Wide Scope + Line Items' : 'Child Scope + Line Items'}</h3></div>
                        <div class="cb">
                            <template if:true={lineItems.length}>
                                <table class="tbl">
                                    <thead><tr><th>Description</th><th>Scope</th><th class="num">Qty</th><th>Unit</th><th class="num">Unit Price</th><th class="num">Extended Price</th><th>Review</th><th>Substitution</th><th>Variance</th><th>Status</th><th></th></tr></thead>
                                    <tbody>
                                        <template for:each={lineItems} for:item="line">
                                            <tr key={line.description}>
                                                <td>{line.description}</td>
                                                <td>{line.executionScope}</td>
                                                <td class="num">{line.quantity}</td>
                                                <td>{line.unit}</td>
                                                <td class="num">{line.unitPrice}</td>
                                                <td class="num">{line.extendedPrice}</td>
                                                <td>{line.reviewStatus}</td>
                                                <td>{line.substitutionState}</td>
                                                <td>{line.variance}</td>
                                                <td>{line.status}</td>
                                                <td><button class="btn-inline" data-id={line.description} onclick={handleEditWorkOrder}>Edit</button></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template if:false={lineItems.length}>
                                <div class="empty-note">0 line items linked.</div>
                            </template>
                        </div>
                    </div>
                </template>

                <template if:true={showRecords}>
                    <div class="card">
                        <div class="ch"><div class="ci">▣</div><h3>Files + Notes + Proof Records</h3></div>
                        <div class="cb meta-grid four-up">
                            <template for:each={recordsRows} for:item="row">
                                <div key={row.label} class="meta-item">
                                    <div class="meta-label">{row.label}</div>
                                    <div class="meta-value">{row.value}</div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <template if:true={showBlockers}>
                    <div class="grid-stack two-up">
                        <div class="card">
                            <div class="ch"><div class="ci">!</div><h3>Execution Controls</h3><button class="btn-inline" style="margin-left:auto;" onclick={handleEditWorkOrder}>Edit Controls</button></div>
                            <div class="cb meta-grid">
                                <template for:each={blockerRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="card">
                            <div class="ch"><div class="ci">✓</div><h3>Readiness</h3></div>
                            <div class="cb check-stack">
                                <template for:each={readinessChecks} for:item="item">
                                    <div key={item.label} class="check-row">
                                        <span class={item.className}></span>
                                        <div class="check-copy">
                                            <div class="meta-value">{item.label}</div>
                                            <div class="meta-note">{item.detail}</div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <template if:true={showProof}>
                    <div class="grid-stack two-up">
                        <div class="card">
                            <div class="ch"><div class="ci">◎</div><h3>Billing + QI</h3><button class="btn-inline" style="margin-left:auto;" onclick={handleEditWorkOrder}>Update Billing</button></div>
                            <div class="cb meta-grid">
                                <template for:each={proofFinancialRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="card">
                            <div class="ch"><div class="ci">⇄</div><h3>Appointment Handoff</h3><button class="btn-inline" style="margin-left:auto;" onclick={openServiceAppointment}>Open Appointment</button></div>
                            <div class="cb meta-grid">
                                <template for:each={handoffRows} for:item="row">
                                    <div key={row.label} class="meta-item">
                                        <div class="meta-label">{row.label}</div>
                                        <div class="meta-value">{row.value}</div>
                                    </div>
                                </template>
