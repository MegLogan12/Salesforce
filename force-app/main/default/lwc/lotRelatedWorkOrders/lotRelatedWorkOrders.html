<template>
    <lightning-card title="Work Orders for this Lot" icon-name="standard:work_order">
        <div slot="actions">
            <lightning-button label="New Work Order" icon-name="utility:add" onclick={handleNewWorkOrder}></lightning-button>
        </div>
        <div class="slds-p-horizontal_small">
            <template if:true={rows.length}>
                <lightning-datatable
                    key-field="id"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>
            <template if:false={rows.length}>
                <p class="slds-p-around_small slds-text-color_weak">0 work orders linked to this lot.</p>
            </template>
        </div>
    </lightning-card>
</template>
