<template>
    <div class="console-home">

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="odl-loading">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error -->
        <template if:true={hasError}>
            <div class="odl-error-state">
                <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
                <p>{error}</p>
                <lightning-button label="Retry" onclick={handleRefresh}></lightning-button>
            </div>
        </template>

        <!-- Main -->
        <template if:false={isLoading}>
            <template if:false={hasError}>

                <!-- Page header -->
                <div class="page-header">
                    <div class="page-header-icon" style="background:#2c7a4b">
                        <lightning-icon icon-name="utility:map" size="small" variant="inverse"></lightning-icon>
                    </div>
                    <div>
                        <h1 class="page-title">Field Manager Workspace</h1>
                        <p class="page-sub">Today's service appointments and open work</p>
                    </div>
                    <div class="page-cta-row">
                        <button type="button" class="btn btn-primary" onclick={handleViewCrew}>View Crew</button>
                        <button type="button" class="btn btn-lav" onclick={handleDispatch}>Dispatch</button>
                        <button type="button" class="btn btn-rose" onclick={handleFlagIssue}>Flag Issue</button>
                    </div>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh"
                        variant="bare"
                        onclick={handleRefresh}
                        class="page-refresh"
                    ></lightning-button-icon>
                </div>

                <!-- KPI row -->
                <div class="kpi-row">
                    <div class="kpi-chip kc-blue" title="Today's service appointments">
                        <div class="kpi-number">{todayAppointments}</div>
                        <div class="kpi-label">Today's Appointments</div>
                    </div>
                    <div class="kpi-chip kc-orange" title="Unassigned service appointments">
                        <div class="kpi-number">{unassignedAppointments}</div>
                        <div class="kpi-label">Unassigned</div>
                    </div>
                    <div class="kpi-chip kc-amber" title="Overdue appointments">
                        <div class="kpi-number">{overdueAppointments}</div>
                        <div class="kpi-label">Overdue</div>
                    </div>
                    <div class="kpi-chip kc-slate" title="Open work orders">
                        <div class="kpi-number">{openWorkOrders}</div>
                        <div class="kpi-label">Open Work Orders</div>
                    </div>
                </div>

                <!-- Body layout -->
                <div class="body-layout">

                    <!-- Main: Appointments table -->
                    <div class="body-main">
                        <div class="card">
                            <div class="card-header">
                                <div class="card-icon" style="background:#2c7a4b">
                                    <lightning-icon icon-name="utility:date_input" size="x-small" variant="inverse"></lightning-icon>
                                </div>
                                <h2 class="card-title">Today's Service Appointments</h2>
                                <lightning-button-icon
                                    icon-name="utility:refresh"
                                    alternative-text="Refresh"
                                    variant="bare"
                                    onclick={handleRefresh}
                                    class="card-refresh"
                                ></lightning-button-icon>
                            </div>

                            <template if:true={hasAppointments}>
                                <table class="odl-table">
                                    <thead>
                                        <tr>
                                            <th>Subject</th>
                                            <th>Status</th>
                                            <th>Start</th>
                                            <th>End</th>
                                            <th>Resource</th>
                                            <th>Work Order</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={appointments} for:item="row">
                                            <tr key={row.id}>
                                                <td>
                                                    <a class="rec-link" data-id={row.id} onclick={handleOpenRecord}>{row.subject}</a>
                                                    <template if:true={row.isOverdue}>
                                                        <span class="status-chip chip-overdue ml-6">Overdue</span>
                                                    </template>
                                                </td>
                                                <td>
                                                    <span class={row.statusChipFull}>{row.status}</span>
                                                </td>
                                                <td class="muted">{row.schedStartLabel}</td>
                                                <td class="muted">{row.schedEndLabel}</td>
                                                <td>
                                                    <template if:true={row.isUnassigned}>
                                                        <span class="status-chip chip-alert">Unassigned</span>
                                                    </template>
                                                    <template if:false={row.isUnassigned}>
                                                        {row.serviceResourceName}
                                                    </template>
                                                </td>
                                                <td class="muted">{row.workOrderSubject}</td>
                                                <td>
                                                    <button type="button" class="btn-inline" data-id={row.id} onclick={handleOpenRecord}>Open</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>

                            <template if:false={hasAppointments}>
                                <div class="empty-state">
                                    <lightning-icon icon-name="utility:check" size="small" variant="success"></lightning-icon>
                                    <p>No service appointments scheduled for today.</p>
                                </div>
                            </template>

                            <div class="card-footer">
                                <lightning-button
                                    label="View All Service Appointments"
                                    variant="neutral"
                                    onclick={handleOpenAppointments}
                                ></lightning-button>
                            </div>
                        </div>
                    </div>

                    <!-- Rail: Quick Actions -->
                    <div class="body-rail">
                        <div class="card">
                            <div class="card-header">
                                <div class="card-icon" style="background:#e8936a">
                                    <lightning-icon icon-name="utility:lightning_strike" size="x-small" variant="inverse"></lightning-icon>
                                </div>
                                <h2 class="card-title">Quick Actions</h2>
                            </div>
                            <div class="qa-list">
                                <div class="qa-item" onclick={handleViewCrew}>
                                    <lightning-icon icon-name="utility:groups" size="x-small"></lightning-icon>
                                    <span>View Crew</span>
                                </div>
                                <div class="qa-item" onclick={handleDispatch}>
                                    <lightning-icon icon-name="utility:routing_offline" size="x-small"></lightning-icon>
                                    <span>Dispatch</span>
                                </div>
                                <div class="qa-item" onclick={handleFlagIssue}>
                                    <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                                    <span>Flag Issue</span>
                                </div>
                                <div class="qa-item" onclick={handleOpenAppointments}>
                                    <lightning-icon icon-name="utility:date_input" size="x-small"></lightning-icon>
                                    <span>View all appointments</span>
                                </div>
                                <div class="qa-item" onclick={handleOpenWorkOrders}>
                                    <lightning-icon icon-name="utility:work_order" size="x-small"></lightning-icon>
                                    <span>View open work orders</span>
                                </div>
                                <div class="qa-item" onclick={handleNewWorkOrder}>
                                    <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                                    <span>New work order</span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </template>
        </template>

    </div>
</template>
