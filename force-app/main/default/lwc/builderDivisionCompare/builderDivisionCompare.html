<template>
    <lightning-card title="Division Compare" icon-name="standard:bar_chart">
        <div class="slds-card__body slds-card__body_inner">

            <!-- Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <!-- Error -->
            <template if:true={error}>
                <p class="slds-text-color_error slds-m-around_medium">{error}</p>
            </template>

            <!-- Blocked state -->
            <template if:true={isBlocked}>
                <div class="slds-box slds-theme_warning slds-m-around_medium">
                    <p class="slds-text-heading_small slds-m-bottom_x-small">KPI batch prerequisite not met</p>
                    <p class="slds-text-body_regular slds-m-bottom_x-small">
                        Revenue_MTD__c, On_Time_Pct__c, and GP_Pct__c fields must be populated by the COO KPI batch before this widget activates.
                    </p>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Owner: COO build track. Action: schedule the KPI aggregation batch.
                    </p>
                </div>
            </template>

            <!-- Active content -->
            <template if:false={isBlocked}>
                <template if:true={compareView}>

                    <!-- Metric selector -->
                    <div class="slds-button-group slds-m-bottom_medium" role="group">
                        <button
                            class={revenueButtonClass}
                            data-metric="revenue"
                            onclick={handleMetric}>
                            Revenue
                        </button>
                        <button
                            class={ontimeButtonClass}
                            data-metric="ontime"
                            onclick={handleMetric}>
                            On-time %
                        </button>
                        <button
                            class={gpButtonClass}
                            data-metric="gp"
                            onclick={handleMetric}>
                            GP %
                        </button>
                    </div>

                    <!-- Ranked bar list -->
                    <ul class="slds-list_vertical">
                        <template for:each={rows} for:item="row">
                            <li key={row.divisionId} class="slds-item slds-p-vertical_x-small slds-border_bottom">
                                <div class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
                                    <div class="slds-col slds-size_3-of-12">
                                        <span class="slds-text-body_regular slds-text-color_default">{row.divisionName}</span>
                                    </div>
                                    <div class="slds-col slds-size_7-of-12">
                                        <div class="slds-progress-bar slds-progress-bar_circular" role="progressbar">
                                            <span class="slds-progress-bar__value" style={row.barStyle}></span>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12 slds-text-align_right">
                                        <span class="slds-text-body_small slds-text-color_weak">{row.metricFormatted}</span>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>

                    <!-- Empty state -->
                    <template if:false={hasRows}>
                        <p class="slds-text-color_weak slds-m-around_medium">No division data available.</p>
                    </template>

                </template>
            </template>

        </div>
    </lightning-card>
</template>
