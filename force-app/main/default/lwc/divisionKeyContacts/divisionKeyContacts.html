<template>
    <template lwc:if={isLoaded}>
        <lightning-card title="Key Builder Contacts" icon-name="utility:people">
            <div class="slds-card__body">
                <div class="slds-grid slds-wrap">
                    <template for:each={contacts} for:item="contact">
                        <div key={contact.id} class="slds-col slds-size_1-of-2 slds-border_right slds-border_bottom div-contact-cell">
                            <p class="slds-text-body_small slds-text-color_weak div-contact-role">{contact.role}</p>
                            <p class="slds-text-body_regular" style="font-weight:600">{contact.name}</p>
                            <template lwc:if={contact.email}>
                                <p class="slds-m-top_xx-small"><a href={contact.emailHref} class="slds-text-link">✉ {contact.email}</a></p>
                            </template>
                            <template lwc:if={contact.phone}>
                                <p><a href={contact.phoneHref} class="slds-text-link">📞 {contact.phone}</a></p>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </lightning-card>
    </template>
    <template lwc:if={hasError}>
        <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">Unable to load contact data.</div>
    </template>
</template>
