<template>
    <lightning-card title="Photo Gallery" icon-name="standard:photo">
        <lightning-button slot="actions" label="Upload Photo" icon-name="utility:upload" variant="brand" onclick={openUploadModal}></lightning-button>
        <div class="slds-p-around_small">
            <template if:true={loading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <template if:true={emptyState}>
                <p class="slds-text-color_weak">No photos uploaded for this work order.</p>
            </template>
            <template for:each={sections} for:item="sec">
                <div key={sec.key} class="photo-section">
                    <header class="section-head">
                        <span class="section-label">{sec.label}</span>
                        <span class="section-count">{sec.count}</span>
                    </header>
                    <div class="photo-grid">
                        <template for:each={sec.items} for:item="p">
                            <article key={p.id} class="photo-card">
                                <div class="thumb">
                                    <template if:true={p.s3Url}>
                                        <img src={p.s3Url} alt={p.photoType} />
                                    </template>
                                    <template if:false={p.s3Url}>
                                        <div class="thumb-placeholder">No preview</div>
                                    </template>
                                </div>
                                <div class="meta">
                                    <span class={p.badgeClass}>{p.badge}</span>
                                    <span class="taken-by">{p.takenBy}</span>
                                    <span class="taken-at">{p.takenAt}</span>
                                </div>
                                <template if:true={p.notes}>
                                    <p class="notes">{p.notes}</p>
                                </template>
                            </article>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <template if:true={uploadModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" onclick={closeUploadModal} title="Close">
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate">Upload Photo</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox
                            name="photoType"
                            label="Photo Type"
                            required
                            value={selectedType}
                            options={typeOptions}
                            onchange={handleTypeChange}>
                        </lightning-combobox>
                        <lightning-textarea
                            name="notes"
                            label="Notes"
                            value={notesInput}
                            onchange={handleNotesChange}
                            class="slds-m-top_small">
                        </lightning-textarea>
                        <div class="slds-m-top_small">
                            <lightning-file-upload
                                label="Attach Photos"
                                name="fileUploader"
                                accept={acceptedFormats}
                                record-id={recordId}
                                onuploadfinished={handleUploadFinished}
                                multiple>
                            </lightning-file-upload>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                Files attach to this Work Order, then a Photo record is created with the selected type and notes.
                            </p>
                        </div>
                        <template if:true={uploading}>
                            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Done" variant="brand" onclick={closeUploadModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
