<template>

<!-- ── Identity banner ── -->
<div class="sc-banner">
    <div class="sc-banner-icon">🌿</div>
    <div class="sc-banner-text">
        <div class="sc-banner-title">LOVING Field Service — Scheduling Console</div>
        <div class="sc-banner-sub">{todayDisplay} · {territory}</div>
    </div>
    <div class="sc-banner-kpis">
        <div class="sc-bk">
            <span class="sc-bk-n">{todayKpi.crewsOut}</span>
            <span class="sc-bk-l">Crews Out</span>
        </div>
        <div class="sc-bk">
            <span class="sc-bk-n">{unscheduledCount}</span>
            <span class="sc-bk-l">Unscheduled</span>
        </div>
        <div class={blockedBannerCls}>
            <span class="sc-bk-n">{blockedCount}</span>
            <span class="sc-bk-l">Blocked</span>
        </div>
        <div class={requestBannerCls}>
            <span class="sc-bk-n">{requestCount}</span>
            <span class="sc-bk-l">Requests</span>
        </div>
    </div>
</div>

<!-- ── Tab navigation (15 tabs) ── -->
<div class="sf-nav">
    <template for:each={tabs} for:item="t">
        <button key={t.id} data-id={t.id} class={t.cls} onclick={handleTab}>
            {t.label}
            <template if:true={t.badge}><span class="num-badge">{t.badge}</span></template>
        </button>
    </template>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:4px">
        <template for:each={divisionChips} for:item="dc">
            <button key={dc.value} data-div={dc.value} class={dc.cls} onclick={handleDivChip}>{dc.label}</button>
        </template>
        <button class="sf-btn" onclick={handleRefreshAll} style="margin-left:8px">↻ Refresh</button>
    </div>
</div>

<!-- Loading -->
<template if:true={isLoading}>
    <div class="sc-spinner"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
</template>


<!-- ══════════════════════════════════════════════════════
     DASHBOARD
══════════════════════════════════════════════════════ -->
<template if:true={isDashboard}>
<div class="sf-body">

    <!-- KPI strip -->
    <div class="g6" style="margin-bottom:14px">
        <div class="kpi kb"><div class="kn big">{todayKpi.crewsOut}</div><div class="kl">Crews Out</div></div>
        <div class="kpi kb"><div class="kn big">{todayKpi.stopsTotal}</div><div class="kl">Stops Today</div></div>
        <div class="kpi kg"><div class="kn big">{todayKpi.stopsCompleted}</div><div class="kl">Completed</div></div>
        <div class="kpi ka"><div class="kn big">{todayKpi.stopsRemaining}</div><div class="kl">Remaining</div></div>
        <div class="kpi kr"><div class="kn big">{todayKpi.issueCount}</div><div class="kl">Issues</div></div>
        <div class="kpi kp"><div class="kn big">{todayKpi.readyCount}</div><div class="kl">Takeoff Ready</div></div>
    </div>

    <div class="g2" style="margin-bottom:14px">

        <!-- Scheduling Health -->
        <div class="card" style="margin-bottom:0">
            <div class="ch">
                <div class="ci" style="background:#2c7a4b">📋</div>
                <h3>Scheduling Health</h3>
                <span class="ch-note">Field Manager summary</span>
            </div>
            <div class="cb" style="padding:0">
                <template if:true={hasTodayFMs}>
                    <table class="tbl">
                        <thead><tr>
                            <th>Field Manager</th><th class="num">Open</th>
                            <th class="num">Sched</th><th class="num">Blocked</th><th>Status</th>
                        </tr></thead>
                        <tbody>
                            <template for:each={todayFMCards} for:item="fm">
                                <tr key={fm.id}>
                                    <td>
                                        <div style="display:flex;align-items:center;gap:6px">
                                            <div class="fm-avatar">{fm.initials}</div>
                                            <span>{fm.name}</span>
                                        </div>
                                    </td>
                                    <td class="num">{fm.openWOs}</td>
                                    <td class="num">{fm.scheduledWOs}</td>
                                    <td class="num"><span style={fm.blockedStyle}>{fm.blockedWOs}</span></td>
                                    <td><span class={fm.statusCls}>{fm.statusLabel}</span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasTodayFMs}>
                    <div class="empty-state">No field manager data available</div>
                </template>
            </div>
        </div>

        <!-- FSL Appointment Queue -->
        <div class="card" style="margin-bottom:0">
            <div class="ch">
                <div class="ci" style="background:#1f6fb2">📅</div>
                <h3>FSL Appointment Queue</h3>
                <span class="ch-note">Today's scheduled SAs</span>
            </div>
            <div class="cb" style="padding:0">
                <template if:true={hasScheduledRows}>
                    <table class="tbl">
                        <thead><tr>
                            <th>SA #</th><th>Work Order</th><th>Crew</th><th>Status</th>
                        </tr></thead>
                        <tbody>
                            <template for:each={scheduledRows} for:item="sa">
                                <tr key={sa.id}>
                                    <td><span class="nl" data-id={sa.id} onclick={handleNavigateSA}>{sa.saNumber}</span></td>
                                    <td>{sa.woName}</td>
                                    <td>{sa.crew}</td>
                                    <td><span class={sa.statusCls}>{sa.statusLabel}</span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasScheduledRows}>
                    <div class="empty-state">No service appointments scheduled for today</div>
                </template>
            </div>
        </div>

    </div><!-- /g2 -->

    <!-- Unscheduled + Blocked alerts row -->
    <div class="g2">
        <div class="card" style="margin-bottom:0">
            <div class="ch">
                <div class="ci" style="background:#cf5f1c">⏳</div>
                <h3>Unscheduled Work</h3>
                <span class="num-chip">{unscheduledCount}</span>
            </div>
            <div class="cb" style="padding:0">
                <template if:true={hasUnscheduledRows}>
                    <table class="tbl">
                        <thead><tr>
                            <th>Work Order</th><th>FM</th><th class="num">Days</th><th>Actions</th>
                        </tr></thead>
                        <tbody>
                            <template for:each={unscheduledRows} for:item="wo">
                                <tr key={wo.id}>
                                    <td><span class="nl" data-id={wo.id} onclick={handleNavigateWO}>{wo.woName}</span></td>
                                    <td>{wo.fm}</td>
                                    <td class="num"><span style={wo.daysStyle}>{wo.daysWaiting}</span></td>
                                    <td>
                                        <button class="sf-btn primary sm" data-id={wo.id} onclick={handleSendToScheduling}>Send to FSL</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasUnscheduledRows}>
                    <div class="empty-state ok-state">✓ All work orders scheduled</div>
                </template>
            </div>
        </div>

        <div class="card" style="margin-bottom:0">
            <div class="ch">
                <div class="ci" style="background:#c23934">🚫</div>
                <h3>Blocked Work</h3>
                <span class="num-chip alert-chip">{blockedCount}</span>
            </div>
            <div class="cb" style="padding:0">
                <template if:true={hasBlockedRows}>
                    <table class="tbl">
                        <thead><tr>
                            <th>Work Order</th><th>FM</th><th>Reason</th><th>Actions</th>
                        </tr></thead>
                        <tbody>
                            <template for:each={blockedRows} for:item="wo">
                                <tr key={wo.id}>
                                    <td><span class="nl" data-id={wo.id} onclick={handleNavigateWO}>{wo.woName}</span></td>
                                    <td>{wo.fm}</td>
                                    <td>{wo.blockReason}</td>
                                    <td>
                                        <button class="sf-btn sm" data-id={wo.id} onclick={handleClearBlocker}>Clear</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasBlockedRows}>
                    <div class="empty-state ok-state">✓ No blocked work orders</div>
                </template>
            </div>
        </div>
    </div><!-- /g2 -->

</div><!-- /sf-body dashboard -->
</template><!-- /isDashboard -->


<!-- ══════════════════════════════════════════════════════
     AUTO-SCHEDULE
══════════════════════════════════════════════════════ -->
<template if:true={isAutoSchedule}>
<div class="sf-body">

    <div class="ab ab-b" style="margin-bottom:14px">
        <div class="ab-ic">ℹ</div>
        <div>The FSL Optimizer assigns unscheduled work orders to crews based on territory, capacity, and travel time. Review the validation checklist before running.</div>
    </div>

    <div class="g2">

        <div class="card" style="margin-bottom:0">
            <div class="ch"><div class="ci" style="background:#1f6fb2">⚙</div><h3>Optimizer Settings</h3></div>
            <div class="cb">
                <div class="rule-row">
                    <span class="rule-label">Optimization horizon</span>
                    <span class="rule-value">7 days</span>
                </div>
                <div class="rule-row">
                    <span class="rule-label">Territory filter</span>
                    <span class="rule-value">{territory}</span>
                </div>
                <div class="rule-row">
                    <span class="rule-label">Mode</span>
                    <span class="rule-value">Fill gaps, preserve pinned SAs</span>
                </div>
                <div class="rule-row">
                    <span class="rule-label">OT guard</span>
                    <span class="rule-value">Hard stop at 40 hrs / employee</span>
                </div>
                <div class="rule-row">
                    <span class="rule-label">Weather hold</span>
                    <span class="rule-value">Recommend only — never auto-apply</span>
                </div>
                <div style="margin-top:14px;display:flex;gap:8px">
                    <button class="sf-btn primary" onclick={handleRunOptimizer}>Run FSL Optimizer</button>
                    <button class="sf-btn" onclick={handleDraftPreview}>Preview Draft</button>
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom:0">
            <div class="ch"><div class="ci" style="background:#2c7a4b">✓</div><h3>Pre-Run Validation</h3></div>
            <div class="cb" style="padding:0">
                <div class="val-row">
                    <span class="val-icon cg-icon">✓</span>
                    <span class="val-label">Unscheduled work orders ready</span>
                    <span class="chip cg">{unscheduledCount} queued</span>
                </div>
                <div class="val-row">
                    <span class="val-icon" style="color:#cf5f1c">⚠</span>
                    <span class="val-label">Crew availability (Rippling)</span>
                    <span class="chip ca">Check time off</span>
                </div>
                <div class="val-row">
                    <span class="val-icon cg-icon">✓</span>
                    <span class="val-label">WEX GPS vehicles active</span>
                    <span class="chip cg">Live</span>
                </div>
                <div class="val-row">
                    <span class="val-icon cg-icon">✓</span>
                    <span class="val-label">Territory capacity</span>
                    <span class="chip cg">Within limits</span>
                </div>
                <div class="val-row" style="border-bottom:none">
                    <span class="val-icon" style="color:#cf5f1c">⚠</span>
                    <span class="val-label">NWS weather alerts</span>
                    <span class="chip ca">Review Weather tab</span>
                </div>
            </div>
        </div>

    </div><!-- /g2 -->

    <template if:true={showOptimizerModal}>
    <div class="flow-modal-backdrop" onclick={handleOptimizerBackdrop}>
        <div class="flow-modal-container" onclick={handleModalStopProp}>
            <div class="flow-modal-header">
                <span class="flow-modal-title">Run FSL Optimizer — Confirm</span>
                <button class="flow-modal-close" onclick={handleCloseOptimizerModal}>✕</button>
            </div>
            <div class="flow-modal-body" style="padding:18px">
                <div class="ab ab-a" style="margin-bottom:14px">
                    <div class="ab-ic">⚠</div>
                    <div><strong>This will schedule unscheduled work orders in FSL.</strong> Pinned service appointments will not be moved. Review draft before confirming.</div>
                </div>
                <div class="rule-row"><span class="rule-label">Territory</span><span class="rule-value">{territory}</span></div>
                <div class="rule-row"><span class="rule-label">Unscheduled WOs</span><span class="rule-value">{unscheduledCount}</span></div>
                <div class="rule-row"><span class="rule-label">Horizon</span><span class="rule-value">7 days from {todayDisplay}</span></div>
                <div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
                    <button class="sf-btn" onclick={handleCloseOptimizerModal}>Cancel</button>
                    <button class="sf-btn primary" onclick={handleConfirmOptimizer}>Confirm &amp; Run</button>
                </div>
            </div>
        </div>
    </div>
    </template>

</div><!-- /sf-body auto-schedule -->
</template><!-- /isAutoSchedule -->


<!-- ══════════════════════════════════════════════════════
     SCHEDULE ISSUES
══════════════════════════════════════════════════════ -->
<template if:true={isScheduleIssues}>
<div class="sf-body">

    <template if:true={highSeverityCount}>
        <div class="ab ab-r" style="margin-bottom:14px">
            <div class="ab-ic">!</div>
            <div><strong>{highSeverityCount} high-severity blockers</strong> require immediate FM review before scheduling can proceed.</div>
        </div>
    </template>

    <!-- Blocked work -->
    <div class="card" style="margin-bottom:14px">
        <div class="ch"><div class="ci" style="background:#c23934">🚫</div><h3>Blocked Work Orders</h3></div>
        <div class="cb" style="padding:0">
            <template if:true={hasBlockedRows}>
                <table class="tbl">
                    <thead><tr>
                        <th>Work Order</th><th>Type</th><th>Community</th><th>Lot</th>
                        <th>FM</th><th>Block Reason</th><th>Blocked Since</th><th>Severity</th><th>Actions</th>
                    </tr></thead>
                    <tbody>
                        <template for:each={blockedRows} for:item="wo">
                            <tr key={wo.id}>
                                <td><span class="nl" data-id={wo.id} onclick={handleNavigateWO}>{wo.woName}</span></td>
                                <td>{wo.woType}</td><td>{wo.community}</td><td>{wo.lot}</td><td>{wo.fm}</td>
                                <td>{wo.blockReason}</td><td>{wo.blockedSince}</td>
                                <td><span class={wo.blockCls}>{wo.blockLabel}</span></td>
                                <td>
                                    <button class="sf-btn sm" data-id={wo.id} onclick={handleClearBlocker}>Clear Blocker</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:false={hasBlockedRows}>
                <div class="empty-state ok-state">✓ No blocked work orders — all clear</div>
            </template>
        </div>
    </div>

    <!-- Data quality issues -->
    <template if:true={highIssueCount}>
        <div class="ab ab-r" style="margin-bottom:14px">
            <div class="ab-ic">!</div>
            <div><strong>{highIssueCount} high-severity data issues</strong> are blocking scheduling. Resolve these first.</div>
        </div>
    </template>

    <div class="card last">
        <div class="ch"><div class="ci" style="background:#cf5f1c">⚠</div><h3>Data Quality Issues</h3></div>
        <div class="cb" style="padding:0">
            <template if:true={hasDataIssueRows}>
                <table class="tbl">
                    <thead><tr>
                        <th>Record</th><th>Object</th><th>Field</th><th>Issue Type</th>
                        <th>Description</th><th>Severity</th><th>Suggested Fix</th>
                    </tr></thead>
                    <tbody>
                        <template for:each={dataIssueRows} for:item="i">
                            <tr key={i.id}>
                                <td><span class="nl">{i.recordName}</span></td>
                                <td>{i.objectType}</td><td>{i.fieldName}</td><td>{i.issueType}</td>
                                <td>{i.description}</td>
                                <td><span class={i.severityCls}>{i.severity}</span></td>
                                <td style="font-size:11px;color:#54698d">{i.suggestedFix}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:false={hasDataIssueRows}>
                <div class="empty-state ok-state">✓ No data issues found — all records valid</div>
            </template>
        </div>
    </div>

</div><!-- /sf-body schedule-issues -->
</template><!-- /isScheduleIssues -->


<!-- ══════════════════════════════════════════════════════
     PENDING
══════════════════════════════════════════════════════ -->
<template if:true={isPending}>
<div class="sf-body">

    <!-- WO type filters -->
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        <template for:each={woTypeFilters} for:item="f">
            <button key={f.value} data-type={f.value} class={f.cls} onclick={handleWoTypeFilter}>{f.label}</button>
        </template>
    </div>

    <!-- Schedule Requests -->
    <div class="card" style="margin-bottom:14px">
        <div class="ch"><div class="ci" style="background:#1f6fb2">📨</div><h3>Pending Schedule Requests</h3>
            <span class="num-chip">{requestCount}</span>
        </div>
        <div class="cb" style="padding:0">
            <template if:true={hasRequestRows}>
                <table class="tbl">
                    <thead><tr>
                        <th>Work Order</th><th>Type</th><th>Community</th><th>Lot</th>
                        <th>FM</th><th>Requested Date</th><th>Notes</th><th>Status</th><th>Actions</th>
                    </tr></thead>
                    <tbody>
                        <template for:each={requestRows} for:item="r">
                            <tr key={r.id}>
                                <td><span class="nl">{r.woName}</span></td>
                                <td>{r.woType}</td><td>{r.community}</td><td>{r.lot}</td>
                                <td>{r.fm}</td><td>{r.requestedDate}</td><td>{r.notes}</td>
                                <td><span class={r.statusCls}>{r.statusLabel}</span></td>
                                <td style="display:flex;gap:4px">
                                    <button class="sf-btn success sm" data-id={r.id} onclick={handleApproveRequest}>Approve</button>
                                    <button class="sf-btn warning sm" data-id={r.id} onclick={handleRejectRequest}>Reject</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:false={hasRequestRows}>
                <div class="empty-state ok-state">✓ No pending schedule requests</div>
            </template>
        </div>
    </div>

    <!-- Unscheduled Work Orders -->
    <div class="card last">
        <div class="ch"><div class="ci" style="background:#cf5f1c">⏳</div><h3>Unscheduled Work Orders</h3>
            <span class="num-chip">{unscheduledCount}</span>
        </div>
        <div class="cb" style="padding:0">
            <template if:true={hasUnscheduledRows}>
                <table class="tbl">
                    <thead><tr>
                        <th>Work Order</th><th>Type</th><th>Community</th><th>Lot</th>
                        <th>FM</th><th class="num">Days Waiting</th><th>Readiness</th><th>Status</th><th>Actions</th>
                    </tr></thead>
                    <tbody>
                        <template for:each={unscheduledRows} for:item="wo">
                            <tr key={wo.id}>
                                <td><span class="nl" data-id={wo.id} onclick={handleNavigateWO}>{wo.woName}</span></td>
                                <td>{wo.woType}</td><td>{wo.community}</td><td>{wo.lot}</td><td>{wo.fm}</td>
                                <td class="num"><span style={wo.daysStyle}>{wo.daysWaiting}</span></td>
                                <td><span class={wo.readinessCls}>{wo.readiness}</span></td>
                                <td><span class={wo.statusCls}>{wo.statusLabel}</span></td>
                                <td>
                                    <button class="sf-btn primary sm" data-id={wo.id} onclick={handleSendToScheduling}>Send to FSL</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:false={hasUnscheduledRows}>
                <div class="empty-state ok-state">✓ No unscheduled work orders — all caught up</div>
            </template>
        </div>
    </div>

</div><!-- /sf-body pending -->
</template><!-- /isPending -->


<!-- ══════════════════════════════════════════════════════
     SCHEDULE BOARD
══════════════════════════════════════════════════════ -->
<template if:true={isScheduleBoard}>
<div class="sf-body">

    <div class="card last">
        <div class="ch"><div class="ci" style="background:#2c7a4b">📅</div><h3>Scheduled Service Appointments</h3>
            <span class="ch-note">FSL · pinned SAs cannot be moved by optimizer</span>
        </div>
        <div class="cb" style="padding:0">
            <template if:true={hasScheduledRows}>
                <table class="tbl">
                    <thead><tr>
                        <th>SA #</th><th>Work Order</th><th>Community</th>
                        <th>Territory</th><th>Crew</th><th>Scheduled Date</th><th class="num">Duration</th><th>Pin</th><th>Status</th>
                    </tr></thead>
                    <tbody>
                        <template for:each={scheduledRows} for:item="sa">
                            <tr key={sa.id}>
                                <td><span class="nl" data-id={sa.id} onclick={handleNavigateSA}>{sa.saNumber}</span></td>
                                <td>{sa.woName}</td><td>{sa.community}</td>
                                <td>{sa.territory}</td><td>{sa.crew}</td><td>{sa.scheduledDate}</td>
                                <td class="num">{sa.duration}</td>
                                <td><span class={sa.pinnedCls}>{sa.pinnedLabel}</span></td>
                                <td><span class={sa.statusCls}>{sa.statusLabel}</span></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:false={hasScheduledRows}>
                <div class="empty-state">No scheduled service appointments found</div>
            </template>
        </div>
    </div>

</div><!-- /sf-body schedule-board -->
</template><!-- /isScheduleBoard -->


<!-- ══════════════════════════════════════════════════════
     CALENDAR
══════════════════════════════════════════════════════ -->
<template if:true={isCalendar}>
<div class="sf-body">
    <div class="card last">
        <div class="ch"><div class="ci" style="background:#1f6fb2">🗓</div><h3>Scheduling Calendar</h3>
            <span class="ch-note">Opens Salesforce Calendar view</span>
        </div>
        <div class="cb" style="text-align:center;padding:32px">
            <p style="color:#54698d;margin-bottom:16px">Use the Salesforce Calendar for a visual weekly/monthly view of scheduled appointments.</p>
            <button class="sf-btn primary" onclick={handleOpenCalendar}>Open Salesforce Calendar</button>
        </div>
    </div>
</div>
</template><!-- /isCalendar -->


<!-- ══════════════════════════════════════════════════════
     ROUTE + GPS
══════════════════════════════════════════════════════ -->
<template if:true={isGps}>
<div class="sf-body">

    <div class="card last">
        <div class="ch">
            <div class="ci" style="background:#1f6fb2">🛰</div>
            <h3>Route + GPS — {todayDisplay}</h3>
            <span class="ch-note">WEX GPS · refreshes on reload</span>
        </div>
        <template if:true={gpsEmpty}>
            <div class="empty-state">No GPS data available. Verify WEX integration and that vehicles have active ignition signals.</div>
        </template>
        <template if:false={gpsEmpty}>
            <table class="tbl">
                <thead><tr>
                    <th>Crew</th><th>Speed</th><th>Ignition</th><th>Last Seen</th><th>Status</th><th>Lat / Lng</th>
                </tr></thead>
                <tbody>
                    <template for:each={gpsRows} for:item="g">
                        <tr key={g.markerId}>
                            <td><strong>{g.crewName}</strong></td>
                            <td>{g.speedMph} mph</td>
                            <td>{g.ignitionStatus}</td>
                            <td>{g.lastSeen}</td>
                            <td><span class="chip cg">{g.status}</span></td>

<!-- ══════════════════════════════════════════════════════
     OVERTIME
══════════════════════════════════════════════════════ -->
<template if:true={isOvertime}>
<div class="sf-body">

    <div class="card" style="margin-bottom:14px">
        <div class="ch"><div class="ci" style="background:#c23934">⚠</div><h3>Overtime Risk</h3></div>
        <template if:true={otEmpty}>
            <div class="empty-state ok-state">No overtime risks detected this week.</div>
        </template>
        <template if:false={otEmpty}>
            <table class="tbl">
                <thead><tr>
                    <th>Employee</th><th>Crew</th><th>Scheduled hrs</th>
                    <th>Actual hrs</th><th>Projected hrs</th><th>OT Risk</th>
                </tr></thead>
                <tbody>
                    <template for:each={otRows} for:item="r">
                        <tr key={r.employeeId}>
                            <td><strong>{r.resourceName}</strong></td>
                            <td>{r.crewName}</td>
                            <td>{r.scheduledHours}</td>
                            <td>{r.actualHours}</td>
                            <td>{r.projectedHours}</td>
                            <td><span class={r.chipCss}>{r.otLabel}</span></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
    </div>

    <div class="card" style="margin-bottom:14px">
        <div class="ch"><div class="ci" style="background:#1f6fb2">📊</div><h3>Crew Utilization — This Week</h3></div>

            <div class="empty-state">No utilization data available yet.</div>
        </template>
        <template if:false={utilizationEmpty}>
            <table class="tbl">
                <thead><tr>
                    <th>Crew</th><th>Foreman</th><th>Goal hrs</th><th>Scheduled hrs</th>
                    <th>Actual hrs</th><th>Efficiency</th><th>OT</th><th>Time Off</th>
                </tr></thead>
                <tbody>
                    <template for:each={utilizationRows} for:item="u">
                        <tr key={u.crewId}>
                            <td><strong>{u.crewName}</strong></td>
                            <td>{u.foremanName}</td>
                            <td>{u.goalHoursWeek}</td>
                            <td>{u.scheduledHoursWeek}</td>
                            <td>{u.actualHoursWeek}</td>
                            <td><span class={u.effCss}>{u.efficiencyPct}%</span></td>
                            <td><span class={u.otCss}>{u.otLabel}</span></td>
                            <td>{u.timeOffStatus}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
    </div>

    <div class="card">
        <div class="ch"><div class="ci" style="background:#54698d">📅</div><h3>Time Off — Next 7 Days</h3>
            <span class="ch-note">Rippling sync</span>
        </div>
        <template if:true={timeOffEmpty}>
            <div class="empty-state ok-state">No time off scheduled in the next 7 days.</div>
        </template>
        <template if:false={timeOffEmpty}>
            <table class="tbl">
                <thead><tr>
                    <th>Employee</th><th>Crew</th><th>Role</th><th>Type</th>
                    <th>Start</th><th>End</th><th>Status</th>
                </tr></thead>
                <tbody>
                    <template for:each={timeOffRows} for:item="t">
                        <tr key={t.employeeId}>
                            <td><strong>{t.employeeName}</strong></td>
                            <td>{t.crewName}</td>
                            <td>{t.role}</td>
                            <td>{t.timeOffType}</td>
                            <td>{t.startDate}</td>
                            <td>{t.endDate}</td>
                            <td><span class={t.chipCss}>{t.status}</span></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
    </div>

</div><!-- /sf-body overtime -->
</template><!-- /isOvertime -->


<!-- ══════════════════════════════════════════════════════
     CREW OPTIMIZATION
══════════════════════════════════════════════════════ -->
<template if:true={isCrewOpt}>
<div class="sf-body">

    <div class="card" style="margin-bottom:14px">
        <div class="ch"><div class="ci" style="background:#1f6fb2">🗺</div><h3>Territory Capacity Overview</h3></div>
        <div class="cb" style="padding:0">
            <template if:true={hasTerritoryRows}>
                <table class="tbl">
                    <thead><tr>
                        <th>Territory</th><th>Division</th><th class="num">Weekly Cap (hrs)</th>
                        <th class="num">Scheduled SAs</th><th class="num">Open WOs</th>
                        <th class="num">Blocked WOs</th><th>Utilization</th><th>Status</th>
                    </tr></thead>
                    <tbody>
                        <template for:each={territoryRows} for:item="t">
                            <tr key={t.id}>
                                <td>{t.name}</td><td>{t.division}</td>
                                <td class="num">{t.capacity}</td>
                                <td class="num">{t.scheduledSA}</td>
                                <td class="num">{t.openWOs}</td>
                                <td class="num">{t.blockedWOs}</td>
                                <td>
                                    <div style="display:flex;align-items:center;gap:8px">

        <div class="ch"><div class="ci" style="background:#2c7a4b">👥</div><h3>Field Manager Overview</h3></div>

            <template if:true={hasFMRows}>
                <table class="tbl">

                    <tbody>

                            <tr key={fm.id}>
                                <td>

                                        <div class="fm-avatar">{fm.initials}</div>
                                        <span class="nl">{fm.name}</span>

                                </td>
                                <td>{fm.territory}</td>

                                <td class="num">{fm.scheduledWOs}</td>

<!-- ══════════════════════════════════════════════════════

══════════════════════════════════════════════════════ -->
<template if:true={isDraftReview}>
<div class="sf-body">

    <div class="ab ab-a" style="margin-bottom:14px">
        <div class="ab-ic">⚠</div>
        <div>Draft schedule proposals must be reviewed and confirmed before they take effect in FSL. Proposed SAs are shown here before committing.</div>

    <div class="card last">

            <template if:true={hasScheduledRows}>
                <table class="tbl">
                    <thead><tr>

                    </tr></thead>
                    <tbody>
                        <template for:each={scheduledRows} for:item="sa">

</div><!-- /sf-body draft-review -->

<!-- ══════════════════════════════════════════════════════
     DECISION RULES
══════════════════════════════════════════════════════ -->
<template if:true={isDecisionRules}>
<div class="sf-body">

    <div class="ab ab-b" style="margin-bottom:14px">
        <div class="ab-ic">ℹ</div>
        <div>Decision rules govern how the FSL optimizer and scheduling console behave. These are read-only here — changes require admin access in FSL configuration.</div>
    </div>

    <div class="g2">

        <div class="card" style="margin-bottom:0">
            <div class="ch"><div class="ci" style="background:#2c7a4b">✓</div><h3>Scheduling Gates</h3></div>
            <div class="cb" style="padding:0">
                <div class="rule-row"><span class="rule-label">Takeoff required before scheduling</span><span class="chip cg">On</span></div>
                <div class="rule-row"><span class="rule-label">Site readiness check required</span><span class="chip cg">On</span></div>
                <div class="rule-row"><span class="rule-label">Red flag blocks scheduling</span><span class="chip cg">On</span></div>
                <div class="rule-row"><span class="rule-label">QI escalation on red hold</span><span class="chip cg">On</span></div>
                <div class="rule-row" style="border-bottom:none"><span class="rule-label">Closeout photos required</span><span class="chip cg">On</span></div>
            </div>
        </div>

        <div class="card" style="margin-bottom:0">
            <div class="ch"><div class="ci" style="background:#cf5f1c">⚙</div><h3>Optimizer Constraints</h3></div>
            <div class="cb" style="padding:0">
                <div class="rule-row"><span class="rule-label">Hard OT cap</span><span class="rule-value">40 hrs / employee</span></div>
                <div class="rule-row"><span class="rule-label">Weather holds</span><span class="rule-value">Recommend only</span></div>
                <div class="rule-row"><span class="rule-label">Pinned SA override</span><span class="rule-value">Never move pinned SAs</span></div>
                <div class="rule-row"><span class="rule-label">Travel time source</span><span class="rule-value">FSL routing engine</span></div>
                <div class="rule-row" style="border-bottom:none"><span class="rule-label">Rollback window</span><span class="rule-value">24 hrs after optimizer run</span></div>
            </div>
        </div>

        <div class="card" style="margin-bottom:0">
            <div class="ch"><div class="ci" style="background:#1f6fb2">🔔</div><h3>Escalation Timers</h3></div>
            <div class="cb" style="padding:0">
                <div class="rule-row"><span class="rule-label">Health check escalation</span><span class="rule-value">Daily</span></div>
                <div class="rule-row"><span class="rule-label">QI escalation</span><span class="rule-value">48 hrs after closeout</span></div>
                <div class="rule-row"><span class="rule-label">Takeoff overdue alert</span><span class="rule-value">Per lot target start date</span></div>
                <div class="rule-row" style="border-bottom:none"><span class="rule-label">NFI loop</span><span class="rule-value">Every 24 hrs until resolved</span></div>
            </div>
        </div>

        <div class="card" style="margin-bottom:0">
            <div class="ch"><div class="ci" style="background:#54698d">🔗</div><h3>Integration Sources</h3></div>
            <div class="cb" style="padding:0">
                <div class="rule-row"><span class="rule-label">Weather</span><span class="chip cg">NWS / Windy.com</span></div>
                <div class="rule-row"><span class="rule-label">GPS</span><span class="chip cg">WEX Fleet</span></div>
                <div class="rule-row"><span class="rule-label">Crew time off</span><span class="chip cg">Rippling</span></div>
                <div class="rule-row" style="border-bottom:none"><span class="rule-label">Scheduling engine</span><span class="chip cg">Salesforce FSL</span></div>
            </div>
        </div>

    </div><!-- /g2 -->

</div><!-- /sf-body decision-rules -->
</template><!-- /isDecisionRules -->


</template>
