<template>
    <div class="po-wrap">

        <!-- ── Record banner ─────────────────────────────────── -->
        <div class="record-banner">
            <div class="record-title-row">
                <div class="object-icon">📋</div>
                <div class="banner-text">
                    <div class="eyebrow">Purchase Orders · Pipeline View</div>
                    <div class="record-title">PO Pipeline Board</div>
                    <div class="record-sub">{kpiAll} open POs · {kpiValidate} in review · {kpiForecast} in takeoff · {kpiValue} total value</div>
                </div>
                <div class="banner-actions">
                    <template if:true={showDetail}>
                        <button class="btn" onclick={handleBackToBoard}>← Board</button>
                    </template>
                    <button class="btn primary" onclick={handleNewPo}>+ Create New PO</button>
                </div>
            </div>
        </div>

        <!-- ── Spinner (additive) ────────────────────────────── -->
        <template if:true={isLoading}>
            <div class="loading-wrap">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- ── Body ──────────────────────────────────────────── -->
        <div class="body">

            <!-- ── Board view ──────────────────────────────── -->
            <template if:false={showDetail}>

                <!-- KPI strip -->
                <div class="kpis">
                    <div class="kpi amber">
                        <div class="kpi-n">{kpiValidate}</div>
                        <div class="kpi-l">Needs Review</div>
                    </div>
                    <div class="kpi aqua">
                        <div class="kpi-n">{kpiAll}</div>
                        <div class="kpi-l">Open POs</div>
                    </div>
                    <div class="kpi aqua">
                        <div class="kpi-n">{kpiForecast}</div>
                        <div class="kpi-l">Takeoff Queue</div>
                    </div>
                    <div class="kpi green">
                        <div class="kpi-n">{kpiClear}</div>
                        <div class="kpi-l">Clear for Schedule</div>
                    </div>
                    <div class="kpi blue">
                        <div class="kpi-n">{kpiSched}</div>
                        <div class="kpi-l">WorkOrder Queue</div>
                    </div>
                    <div class="kpi green">
                        <div class="kpi-n">{kpiValue}</div>
                        <div class="kpi-l">Total Value</div>
                    </div>
                </div>

                <!-- Toolbar -->
                <div class="toolbar">
                    <template for:each={filterOptions} for:item="f">
                        <button key={f.value} class={f.cssClass} data-value={f.value} onclick={handleFilterClick}>{f.label}</button>
                    </template>
                    <span class="spacer"></span>
                    <button class="btn primary" onclick={handleNewPo}>+ Create New PO</button>
                    <select class="input select-sm" onchange={handleBuilderChange}>
                        <option value="">All builders</option>
                        <template for:each={builderNames} for:item="b">
                            <option key={b} value={b}>{b}</option>
                        </template>
                    </select>
                    <input type="text" class="input search-sm" placeholder="Search PO, community, item…" oninput={handleSearchInput} />
                </div>

                <!-- Board -->
                <div class="board-outer" data-layout-version="object-home-grid-v6">
                    <div class="board compact-board">
                        <template for:each={stageColumns} for:item="stage">
                            <div key={stage.key} class={stage.cssClass}>
                                <div class="stage-head">
                                    <div class="stage-top">
                                        <span class="stage-num">{stage.num}</span>
                                        <span class="stage-title">{stage.label}</span>
                                        <span class="stage-count">{stage.count}</span>
                                    </div>
                                    <div class="stage-rule">{stage.rule}</div>
                                </div>
                                <div class="stage-body">
                                    <template if:true={stage.hasRecords}>
                                        <template for:each={stage.records} for:item="po">
                                            <div key={po.id} class={po.cardClass} data-id={po.id} onclick={handlePoSelect}>
                                                <div class="po-title"><span>{po.name}</span></div>
                                                <div class="po-meta"><span class="po-meta-name">{po.communityName}</span></div>
                                                <div class="po-row">
                                                    <span class="money">{po.amountFormatted}</span>
                                                    <span class={po.statusChipClass}>{po.statusLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={stage.hasRecords}>
                                        <div class="empty">No POs</div>
                                    </template>
                                </div>
                            </div>
                        </template>

                    </div><!-- /.board -->
                </div><!-- /.board-outer -->

            </template><!-- /if:false showDetail -->

            <!-- ── Detail view ──────────────────────────────── -->
            <template if:true={showDetail}>

                <!-- Action result banner -->
                <template if:true={actionResult}>
                    <div class={validationBannerClass}>
                        <strong>{validationIcon}</strong> {actionResult.message}
                    </div>
                </template>

                <div class="detail-layout">

                    <!-- Main column -->
                    <div class="detail-main">

                        <!-- PO identity panel -->
                        <div class="panel">
                            <div class="panel-head">
                                <div class="panel-icon">📋</div>
                                <h3>{detailTitle}</h3>
                                <button class="btn" onclick={handleOpenRecord}>Open Record</button>
                            </div>
                            <div class="panel-body fields">
                                <div>
                                    <div class="label">Builder</div>
                                    <div class="value emph">{selectedPo.builderName}</div>
                                </div>
                                <div>
                                    <div class="label">Community</div>
                                    <div class="value">{selectedPo.communityName}</div>
                                </div>
                                <div>
                                    <div class="label">Division</div>
                                    <div class="value">{selectedPo.divisionName}</div>
                                </div>
                                <div>
                                    <div class="label">Status</div>
                                    <div class="value"><span class={selectedPo.statusChipClass}>{selectedPo.statusLabel}</span></div>
                                </div>
                                <div>
                                    <div class="label">Pipeline Stage</div>
                                    <div class="value emph">{selectedPo.pipelineStage}</div>
                                </div>
                                <div>
                                    <div class="label">Estimated Start Date</div>
                                    <div class="value">{selectedPo.estimatedStartDate}</div>
                                </div>
                                <div>
                                    <div class="label">Total Amount</div>
                                    <div class="value emph">{selectedPo.amountFormatted}</div>
                                </div>
                                <div>
                                    <div class="label">Item</div>
                                    <div class="value">{selectedPo.itemName}</div>
                                </div>
                                <div>
                                    <div class="label">Quantity</div>
                                    <div class="value">{selectedPo.quantity}</div>
                                </div>
                                <div>
                                    <div class="label">Takeoff Status</div>
                                    <div class="value">{selectedPo.takeoffStatus}</div>
                                </div>
                                <div>
                                    <div class="label">Work Order</div>
                                    <div class="value">{selectedPo.workOrderId}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Readiness checklist -->
                        <div class="panel">
                            <div class="panel-head">
                                <div class="panel-icon">✓</div>
                                <h3>Readiness checklist</h3>
                            </div>
                            <div class="panel-body">
                                <div class="flow-list">
                                    <template for:each={validationChecklist} for:item="item">
                                        <div key={item.label} class={item.flowClass}>
                                            <div class="dot">{item.icon}</div>
                                            <div>
                                                <div class="flow-title">{item.label}</div>
                                                <div class="flow-sub">{item.value}</div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Pipeline stages -->
                        <div class="panel">
                            <div class="panel-head">
                                <div class="panel-icon">→</div>
                                <h3>Pipeline stages</h3>
                            </div>
                            <div class="panel-body">
                                <div class="flow-list">
                                    <template for:each={stageFlows} for:item="stage">
                                        <div key={stage.label} class={stage.flowClass}>
                                            <div class="dot">{stage.icon}</div>
                                            <div>
                                                <div class="flow-title">{stage.label}</div>
                                                <div class="flow-sub">{stage.rule}</div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                    </div><!-- /.detail-main -->

                    <!-- Rail column -->
                    <div class="detail-rail">
                        <div class="panel">
                            <div class="panel-head">
                                <div class="panel-icon">⚡</div>
                                <h3>Actions</h3>
                            </div>
                            <div class="panel-body panel-actions">
                                <button class={primaryActionClass} onclick={handlePrimaryAction}>{primaryActionLabel}</button>
                                <button class="btn wide" onclick={handleOpenModal}>Move Status</button>
                                <button class="btn wide" onclick={handleOpenRecord}>View full record</button>
                            </div>
                        </div>
                    </div>

                </div><!-- /.detail-layout -->

            </template><!-- /if:true showDetail -->

        </div><!-- /.body -->

        <!-- ── Move Status modal ──────────────────────────────── -->
        <template if:true={showModal}>
            <div class="modal-backdrop" onclick={handleModalBackdropClick}>
                <div class="modal" onclick={handleModalClick}>
                    <div class="modal-head">
                        <div class="modal-title">Move Purchase Order</div>
                        <div class="modal-sub">Select the new status to move this PO to.</div>
                    </div>
                    <div class="modal-body">
                        <div class="label">New Status <span class="required">*</span></div>
                        <select class="input" style="width:100%;margin-top:6px;" onchange={handleStatusChange}>
                            <option value="">Select status...</option>
                            <template for:each={statusOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                        <template if:true={modalError}>
                            <div class="notice red" style="margin-top:12px;">{modalError}</div>
                        </template>
                    </div>
                    <div class="modal-foot">
                        <button class="btn" onclick={handleCloseModal}>Cancel</button>
                        <button class="btn success" onclick={handleSaveValidation} disabled={isSaving}>{saveLabel}</button>
                    </div>
                </div>
            </div>
        </template>

    </div><!-- /.po-wrap -->
</template>
