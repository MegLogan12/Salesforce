<template>

<!-- Internal tab nav — shown only in legacy single-page mode (no pinned section) -->
<template if:true={showInternalTabs}>
    <div class="slds-scrollable_x sco-tab-bar">
        <div class="slds-button-group" role="group">
            <template for:each={tabs} for:item="t">
                <button key={t.id} type="button" class={t.cls} data-id={t.id} onclick={handleTab}>
                    {t.label}
                    <template if:true={t.badge}><span class={t.badgeCls}>{t.badge}</span></template>
                </button>
            </template>
        </div>
    </div>
</template>

<!-- Loading -->
<template if:true={isLoading}>
    <div class="slds-is-relative slds-p-around_large">
        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
    </div>
</template>

<div class="slds-p-around_small">

<!-- ═══════════════════════════════════════════════════════
     TAB 1 — DASHBOARD
═══════════════════════════════════════════════════════ -->
<template if:true={isDashboard}>
    <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-6">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-aqua">{dashKpi.scheduledThisMonth}</div>
                <div class="slds-text-title">Scheduled this month</div>
                <div class="slds-text-body_small slds-text-color_weak">Appointments</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-6">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-green">{dashKpi.activeToday}</div>
                <div class="slds-text-title">Active today</div>
                <div class="slds-text-body_small slds-text-color_weak">In Progress / Dispatched</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-6">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-amber">{dashKpi.readyToSchedule}</div>
                <div class="slds-text-title">Ready to schedule</div>
                <div class="slds-text-body_small slds-text-color_weak">Clear-to-schedule queue</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-6">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-red">{dashKpi.issueCount}</div>
                <div class="slds-text-title">Needs review</div>
                <div class="slds-text-body_small slds-text-color_weak">Weather, PTO, GPS</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-6">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-aqua">{dashKpi.crewsActive}</div>
                <div class="slds-text-title">Crews active</div>
                <div class="slds-text-body_small slds-text-color_weak">Crews</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-6">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v">{dashKpi.capacityPct}%</div>
                <div class="slds-text-title">Capacity used</div>
                <div class="slds-text-body_small slds-text-color_weak">Territories</div>
            </div>
        </div>
    </div>

    <template if:true={dashAlert.message}>
        <div class={dashAlert.cls} role="alert"><strong>{dashAlert.headline}</strong> {dashAlert.message}</div>
    </template>

    <div class="slds-grid slds-wrap slds-gutters_small">
        <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
            <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <lightning-card title="Today's scheduling health" icon-name="standard:metrics">
                        <div slot="actions"><span class="slds-badge cs-badge-green">Live</span></div>
                        <div class="slds-p-around_small">
                            <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <div class="slds-text-body_small slds-text-color_weak">Released</div>
                                    <div class="slds-text-body_regular slds-text-title_bold">{dashHealth.releaseStatus}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <div class="slds-text-body_small slds-text-color_weak">Next release</div>
                                    <div class="slds-text-body_regular slds-text-title_bold">{dashHealth.nextRelease}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                    <div class="slds-text-body_small slds-text-color_weak">Open stops</div>
                                    <div class="slds-text-body_regular slds-text-title_bold">{dashHealth.openStops}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-m-top_x-small">
                                    <div class="slds-text-body_small slds-text-color_weak">Weather hold</div>
                                    <div class="slds-text-body_regular slds-text-title_bold">{dashHealth.weatherHold}</div>
                                </div>
                            </div>
                            <div class="sco-progress"><span class="sco-progress-fill" style={dashHealth.progressStyle}></span></div>
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <div class="weather-card slds-box">
                        <div class="weather-top">
                            <div class="weather-ico">{wx.icon}</div>
                            <div class="weather-tempwrap">
                                <div class="weather-temp">{wx.tempLabel}</div>
                                <div class="weather-desc">{wx.desc}</div>
                            </div>
                            <div class="weather-loc">Charlotte metro<br/><span class="weather-live">&#9679; Live radar</span></div>
                        </div>
                        <img class="weather-radar" src="https://radar.weather.gov/ridge/standard/KGSP_loop.gif" alt="Live weather radar"/>
                        <template if:true={hasWeatherAlert}>
                            <div class="weather-alert">
                                <span class={topWeatherAlert.sevClass}>{topWeatherAlert.severity}</span>
                                <span class="weather-alert-txt">{topWeatherAlert.shortHeadline}</span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <lightning-card title="FSL appointment queue" icon-name="standard:service_appointment">
                <div slot="actions">
                    <lightning-button label="Open board" onclick={handleShowBoard}></lightning-button>
                </div>
                <div class="slds-p-horizontal_small">
                    <template if:true={hasDashQueue}>
                        <div class="slds-scrollable_x">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">Appointment</div></th>
                                        <th scope="col"><div class="slds-truncate">Work Order</div></th>
                                        <th scope="col"><div class="slds-truncate">Community / Lot</div></th>
                                        <th scope="col"><div class="slds-truncate">Window</div></th>
                                        <th scope="col"><div class="slds-truncate">Assigned</div></th>
                                        <th scope="col"><div class="slds-truncate">Status</div></th>
                                        <th scope="col"><div class="slds-truncate">Risk</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={dashQueue} for:item="a">
                                        <tr key={a.saId} class="slds-hint-parent">
                                            <td data-label="Appointment"><span class="slds-text-link" data-id={a.saId} onclick={handleNavigateSA}>{a.saNumber}</span></td>
                                            <td data-label="Work Order"><span class="slds-text-link" data-id={a.workOrderId} onclick={handleNavigateWO}>{a.workOrderName}</span></td>
                                            <td data-label="Community / Lot">{a.community} · Lot {a.lot}<br/><span class="slds-text-color_weak">{a.builder}</span></td>
                                            <td data-label="Window">{a.window}</td>
                                            <td data-label="Assigned">{a.foremanName}<br/><span class="slds-text-color_weak">{a.crewName}</span></td>
                                            <td data-label="Status"><span class={a.statusCss}>{a.status}</span></td>
                                            <td data-label="Risk"><span class={a.riskCss}>{a.risk}</span></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={hasDashQueue}>
                        <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">No Appointments records for today.</div>
                    </template>
                </div>
            </lightning-card>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
            <lightning-card title="Quick actions" icon-name="standard:task2">
                <div class="slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                            <button type="button" class="slds-button slds-button_brand slds-button_stretch" onclick={handleRunOptimizer}>Run FSL Optimizer</button>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                            <button type="button" class="slds-button slds-button_neutral slds-button_stretch" onclick={handleCreateIssue}>Create schedule issue</button>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                            <button type="button" class="slds-button slds-button_neutral slds-button_stretch" onclick={handleRecalcRoute}>Recalculate route</button>
                        </div>
                        <div class="slds-col slds-size_1-of-1">
                            <button type="button" class="slds-button slds-button_neutral slds-button_stretch" onclick={handleNotifyForemen}>Notify foremen</button>
                        </div>
                    </div>
                </div>
            </lightning-card>
            <lightning-card title="Integration status" icon-name="standard:connected_apps">
                <div class="slds-p-around_small">
                    <div class="pill-row">
                        <span class={integStatus.fslCss}>{integStatus.fslLabel}</span>
                        <span class={integStatus.weatherCss}>{integStatus.weatherLabel}</span>
                        <span class={integStatus.trafficCss}>{integStatus.trafficLabel}</span>
                        <span class={integStatus.wexCss}>{integStatus.wexLabel}</span>
                        <span class={integStatus.ripplingCss}>{integStatus.ripplingLabel}</span>
                    </div>
                </div>
            </lightning-card>
        </div>
    </div>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 2 — AUTO-SCHEDULE
═══════════════════════════════════════════════════════ -->
<template if:true={isAutoSchedule}>
    <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_small" role="alert">
        <strong>Auto-Schedule overlays standard FSL.</strong> Proposes changes to Appointments and Crews. Does not replace FSL Dispatch.
    </div>
    <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-green">{autoSchedule.eligibleJobs}</div>
                <div class="slds-text-title">Eligible jobs</div>
                <div class="slds-text-body_small slds-text-color_weak">Ready-to-schedule</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v">{autoSchedule.crewsAvailable}</div>
                <div class="slds-text-title">Crews available</div>
                <div class="slds-text-body_small slds-text-color_weak">time off checked</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-amber">{autoSchedule.humanReviewCount}</div>
                <div class="slds-text-title">Human review</div>
                <div class="slds-text-body_small slds-text-color_weak">Weather + PTO</div>
            </div>
        </div>
    </div>

    <lightning-card title="System-proposed schedule" icon-name="standard:shift">
        <div slot="actions">
            <div class="slds-button-group" role="group">
                <button type="button" class="slds-button slds-button_neutral" onclick={handleRunOptimizer}>Run again</button>
                <button type="button" class="slds-button slds-button_brand" onclick={handleApproveAllProposed}>Approve proposed</button>
            </div>
        </div>
        <div class="slds-p-around_small">
            <template if:true={hasAutoProposals}>
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <template for:each={autoSchedule.proposals} for:item="p">
                        <div key={p.dateStr} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <div class="job-card slds-box slds-box_x-small">
                                <div class="job-head">
                                    <div class="job-ico">{p.icon}</div>
                                    <div>
                                        <div class="job-title">{p.label}</div>
                                        <div class="job-sub">{p.reviewNote}</div>
                                    </div>
                                </div>
                                <div class="pill-row slds-m-top_x-small">
                                    <span class={p.chipCss}>{p.chipLabel}</span>
                                    <span class="slds-badge cs-badge-aqua">{p.stops} stops</span>
                                </div>
                                <div class="job-actions slds-m-top_x-small">
                                    <button type="button" class="slds-button slds-button_brand" data-date={p.dateStr} onclick={handleApproveProposal}>Approve</button>
                                    <button type="button" class="slds-button slds-button_neutral" onclick={handleShowBoard}>Review board</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasAutoProposals}>
                <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">Run the FSL Optimizer to generate schedule proposals.</div>
            </template>
        </div>
    </lightning-card>

    <lightning-card title="Rippling PTO / FSL time off check" icon-name="standard:timesheet">
        <div class="slds-p-horizontal_small">
            <template if:true={hasResourceAvailability}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Resource</div></th>
                                <th scope="col"><div class="slds-truncate">Mon</div></th>
                                <th scope="col"><div class="slds-truncate">Tue</div></th>
                                <th scope="col"><div class="slds-truncate">Wed</div></th>
                                <th scope="col"><div class="slds-truncate">Thu</div></th>
                                <th scope="col"><div class="slds-truncate">Fri</div></th>
                                <th scope="col"><div class="slds-truncate">Status</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={autoSchedule.resourceAvailability} for:item="r">
                                <tr key={r.resourceId} class="slds-hint-parent">
                                    <td data-label="Resource">{r.resourceName}</td>
                                    <td data-label="Mon"><span class={r.monCss}>{r.monLabel}</span></td>
                                    <td data-label="Tue"><span class={r.tueCss}>{r.tueLabel}</span></td>
                                    <td data-label="Wed"><span class={r.wedCss}>{r.wedLabel}</span></td>
                                    <td data-label="Thu"><span class={r.thuCss}>{r.thuLabel}</span></td>
                                    <td data-label="Fri"><span class={r.friCss}>{r.friLabel}</span></td>
                                    <td data-label="Status"><span class={r.weekCss}>{r.weekStatus}</span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template if:false={hasResourceAvailability}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">No time off data found for this week.</div>
            </template>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 3 — SCHEDULE ISSUES
═══════════════════════════════════════════════════════ -->
<template if:true={isIssues}>
    <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-red">{issueKpi.weather}</div>
                <div class="slds-text-title">Weather issues</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-amber">{issueKpi.pto}</div>
                <div class="slds-text-title">PTO conflicts</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-amber">{issueKpi.gps}</div>
                <div class="slds-text-title">GPS stale</div>
            </div>
        </div>
    </div>

    <template if:true={hasIssues}>
        <template for:each={scheduleIssues} for:item="si">
            <lightning-card key={si.id} title={si.name} icon-name="standard:case">
                <div slot="actions"><span class={si.severityCss}>{si.issueType}</span></div>
                <div class="slds-p-around_small">
                    <p class="slds-m-bottom_small">{si.summary}</p>
                    <div class="slds-button-group" role="group">
                        <button type="button" class="slds-button slds-button_brand" data-id={si.id} onclick={handleResolveIssue}>Resolve</button>
                        <button type="button" class="slds-button slds-button_neutral" data-id={si.id} onclick={handleReassignFromIssue}>Reassign</button>
                        <span class="slds-badge slds-m-left_x-small">{si.status}</span>
                    </div>
                </div>
            </lightning-card>
        </template>
    </template>
    <template if:false={hasIssues}>
        <div class="slds-notify slds-notify_alert slds-theme_success" role="alert"><strong>All clear.</strong> No open schedule issues records for the current period.</div>
    </template>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 4 — PENDING
═══════════════════════════════════════════════════════ -->
<template if:true={isPending}>
    <div class="slds-m-bottom_small slds-grid slds-gutters_x-small slds-wrap">
        <div class="slds-col">
            <div class="slds-button-group" role="group">
                <button type="button" class={filterAllCss}       onclick={handlePendingAll}>All</button>
                <button type="button" class={filterInventoryCss} onclick={handlePendingInventory}>Inventory</button>
                <button type="button" class={filterSiteCss}      onclick={handlePendingSite}>Site</button>
                <button type="button" class={filterClearCss}     onclick={handlePendingClear}>Clear to Schedule</button>
            </div>
        </div>
        <div class="slds-col_bump-left">
            <button type="button" class="slds-button slds-button_brand" onclick={handleOpenBacklog}>Open backlog</button>
        </div>
    </div>

    <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
            <lightning-card title="Waiting for inventory" icon-name="standard:product">
                <div slot="actions"><span class="slds-badge cs-badge-amber">{pendingData.inventoryCount}</span></div>
                <div class="slds-p-around_small">
                    <template if:true={hasInventoryPending}>
                        <template for:each={pendingData.inventoryBlocked} for:item="item">
                            <div key={item.workOrderId} class="job-card slds-box slds-box_x-small slds-m-bottom_x-small">
                                <div class="job-title">{item.communityName} · {item.name}</div>
                                <div class="job-sub">{item.blockDetail}</div>
                                <span class={item.chipCss}>{item.chipLabel}</span>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasInventoryPending}>
                        <div class="slds-text-color_weak slds-text-body_small">No inventory blocks.</div>
                    </template>
                </div>
            </lightning-card>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
            <lightning-card title="Waiting for site" icon-name="standard:home">
                <div slot="actions"><span class="slds-badge cs-badge-red">{pendingData.siteCount}</span></div>
                <div class="slds-p-around_small">
                    <template if:true={hasSitePending}>
                        <template for:each={pendingData.siteReadinessBlocked} for:item="item">
                            <div key={item.workOrderId} class="job-card slds-box slds-box_x-small slds-m-bottom_x-small">
                                <div class="job-title">{item.communityName} · {item.name}</div>
                                <div class="job-sub">{item.blockDetail}</div>
                                <span class={item.chipCss}>{item.chipLabel}</span>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasSitePending}>
                        <div class="slds-text-color_weak slds-text-body_small">No site readiness blocks.</div>
                    </template>
                </div>
            </lightning-card>
        </div>
    </div>

    <lightning-card title="Clear to schedule backlog" icon-name="standard:work_order">
        <div slot="actions"><span class="slds-badge cs-badge-aqua">{pendingData.clearCount}</span></div>
        <div class="slds-p-horizontal_small">
            <template if:true={hasClearPending}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Work Order</div></th>
                                <th scope="col"><div class="slds-truncate">Community</div></th>
                                <th scope="col"><div class="slds-truncate">Work Type</div></th>
                                <th scope="col"><div class="slds-truncate">Ready Since</div></th>
                                <th scope="col"><div class="slds-truncate">Action</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={pendingData.sameDayUrgent} for:item="item">
                                <tr key={item.workOrderId} class="slds-hint-parent">
                                    <td data-label="Work Order">{item.name}</td>
                                    <td data-label="Community">{item.communityName}</td>
                                    <td data-label="Work Type">{item.chipLabel}</td>
                                    <td data-label="Ready Since">{item.blockDetail}</td>
                                    <td data-label="Action">
                                        <button type="button" class="slds-button slds-button_neutral" data-id={item.workOrderId} onclick={handleScheduleWO}>Schedule</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template if:false={hasClearPending}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">No urgent pending work orders.</div>
            </template>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 5 — SCHEDULE BOARD
═══════════════════════════════════════════════════════ -->
<template if:true={isBoard}>
    <div class="slds-notify slds-notify_alert slds-theme_success slds-m-bottom_small" role="alert">
        <strong>Schedule Board:</strong> cards are Appointments records with Crews context. Assignments update through FSL-safe paths only.
    </div>
    <div class="slds-grid slds-gutters_x-small slds-m-bottom_small slds-wrap">
        <div class="slds-col">
            <lightning-combobox
                label="Date"
                variant="label-hidden"
                value={_boardDate}
                options={boardDateOptions}
                onchange={handleBoardDateChange}>
            </lightning-combobox>
        </div>
        <div class="slds-col">
            <div class="slds-button-group" role="group">
                <button type="button" class="slds-button slds-button_neutral" onclick={handleRefreshBoard}>↻ Refresh</button>
                <button type="button" class="slds-button slds-button_brand" onclick={handleReleaseSchedule}>Release Day</button>
            </div>
        </div>
        <div class="slds-col slds-m-top_xx-small">
            <span class={boardSummary.chipCss}>{boardSummary.totalCrews} crews · {boardSummary.totalStops} stops</span>
        </div>
    </div>
    <template if:true={hasBoardCrews}>
        <div class="fsl-board slds-scrollable_x">
            <template for:each={boardCrews} for:item="crew">
                <div key={crew.crewId} class="crew-col">
                    <div class="crew-head">
                        <div class="crew-name">{crew.crewName}</div>
                        <div class="crew-meta">{crew.foremanName} · {crew.stopCount} stops · <span class={crew.summaryChipCss}>{crew.summaryChip}</span></div>
                    </div>
                    <div class="crew-body">
                        <template for:each={crew.stops} for:item="stop">
                            <div key={stop.stopId} class="appt-card">
                                <div class="appt-time">Stop {stop.stopNumber}</div>
                                <div class="appt-title">{stop.workType} · {stop.workOrderName}</div>
                                <div class="appt-sub">{stop.communityName} · {stop.address}</div>
                                <div class="appt-actions">
                                    <template if:true={stop.hasWarning}>
                                        <span class="slds-badge cs-badge-amber">{stop.warningNote}</span>
                                    </template>
                                    <button type="button" class="slds-button slds-button_neutral" data-id={stop.workOrderId} onclick={handleNavigateWO}>Open WO</button>
                                    <button type="button" class="slds-button slds-button_neutral" data-id={stop.stopId} onclick={handleReassignStop}>Reassign</button>
                                </div>
                            </div>
                        </template>
                        <template if:false={crew.hasStops}>
                            <div class="appt-card">
                                <div class="appt-title">Open capacity</div>
                                <div class="appt-sub">No assigned Appointments.</div>
                                <span class="slds-badge cs-badge-green">Available</span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </template>
    <template if:false={hasBoardCrews}>
        <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">No Appointments records found for the selected date.</div>
    </template>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 6 — CALENDAR
═══════════════════════════════════════════════════════ -->
<template if:true={isCalendar}>
    <div class="slds-button-group slds-m-bottom_small" role="group">
        <button type="button" class="slds-button slds-button_neutral" onclick={handlePrevWeek}>‹ Previous</button>
        <button type="button" class="slds-button slds-button_brand" onclick={handleThisWeek}>This Week</button>
        <button type="button" class="slds-button slds-button_neutral" onclick={handleNextWeek}>Next ›</button>
        <button type="button" class="slds-button slds-button_neutral slds-m-left_small" onclick={handleNewAppointment}>+ Manual Appointment</button>
    </div>
    <div class="cal-grid">
        <template for:each={calDays} for:item="day">
            <div key={day.dateStr} class="day-card">
                <div class="day-title">
                    <span>{day.label}</span>
                    <span class={day.chipCss}>{day.chipLabel}</span>
                </div>
                <template for:each={day.items} for:item="item">
                    <div key={item.id} class={item.css}>{item.label}</div>
                </template>
                <template if:false={day.hasItems}>
                    <div class="day-item day-item-gray">No scheduled SAs</div>
                </template>
            </div>
        </template>
    </div>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 7 — ROUTE + GPS
═══════════════════════════════════════════════════════ -->
<template if:true={isRoute}>
    <div class="slds-grid slds-wrap slds-gutters_small">
        <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
            <lightning-card title="Live vehicle map" icon-name="standard:location">
                <div slot="actions"><span class="slds-badge cs-badge-green">&#9679; Live · WEX GPS</span></div>
                <div class="slds-p-bottom_small">
                    <c-loving-google-dispatch-map
                        markers={googleMapMarkers}
                        show-traffic
                        map-height="420px"
                        zoom="10">
                    </c-loving-google-dispatch-map>
                </div>
            </lightning-card>

            <lightning-card title="Route + GPS overlay" icon-name="standard:routing_offline">
                <div slot="actions"><span class={gpsHealth.chipCss}>{gpsHealth.label}</span></div>
                <div class="slds-p-horizontal_small">
                    <template if:true={hasGpsData}>
                        <div class="slds-scrollable_x">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">Crew / Vehicle</div></th>
                                        <th scope="col"><div class="slds-truncate">Speed</div></th>
                                        <th scope="col"><div class="slds-truncate">Ignition</div></th>
                                        <th scope="col"><div class="slds-truncate">Last Seen</div></th>
                                        <th scope="col"><div class="slds-truncate">Status</div></th>
                                        <th scope="col"><div class="slds-truncate">Coordinates</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={gpsRows} for:item="g">
                                        <tr key={g.markerId} class="slds-hint-parent">
                                            <td data-label="Crew"><strong>{g.crewName}</strong></td>
                                            <td data-label="Speed">{g.speedMph}</td>
                                            <td data-label="Ignition">{g.ignitionStatus}</td>
                                            <td data-label="Last Seen">{g.lastSeen}</td>
                                            <td data-label="Status"><span class={g.statusCss}>{g.status}</span></td>
                                            <td data-label="Coordinates" class="slds-text-font_monospace slds-text-body_small">{g.lat}, {g.lng}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={hasGpsData}>
                        <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">
                            No Live GPS records within the last 24 hours. Verify WEX/GPSInsights integration and vehicle ignition signals.
                        </div>
                    </template>
                    <div class="map-legend slds-m-top_small">
                        <span class="legend-item"><span class="sco-dot" style="background: #1265cf"></span>Route</span>
                        <span class="legend-item"><span class="sco-dot" style="background: #5a3ec8"></span>WEX/GPSInsights vehicle</span>
                        <span class="legend-item"><span class="sco-dot" style="background: #b27508"></span>Traffic delay</span>
                        <span class="legend-item"><span class="sco-dot" style="background: #13854e"></span>Completed stop</span>
                    </div>
                </div>
            </lightning-card>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
            <lightning-card title="Route sources" icon-name="standard:service_territory">
                <div class="slds-p-around_small">
                    <dl class="slds-dl_horizontal">
                        <dt class="slds-dl_horizontal__label slds-text-color_weak">Route source</dt>
                        <dd class="slds-dl_horizontal__detail">Appointments sequence + Optimizer</dd>
                        <dt class="slds-dl_horizontal__label slds-text-color_weak">Vehicle source</dt>
                        <dd class="slds-dl_horizontal__detail">Live GPS</dd>
                        <dt class="slds-dl_horizontal__label slds-text-color_weak">Traffic source</dt>
                        <dd class="slds-dl_horizontal__detail">Traffic feed</dd>
                        <dt class="slds-dl_horizontal__label slds-text-color_weak">Weather source</dt>
                        <dd class="slds-dl_horizontal__detail">Weather service</dd>
                    </dl>
                    <div class="slds-m-top_small">
                        <button type="button" class="slds-button slds-button_brand slds-button_stretch" onclick={handleRecalcRoute}>Re-optimize route</button>
                    </div>
                </div>
            </lightning-card>
            <lightning-card title="GPS health" icon-name="standard:location">
                <div class="slds-p-around_small">
                    <div class="pill-row slds-m-bottom_small">
                        <span class="slds-badge cs-badge-green">{gpsHealth.active} active</span>
                        <span class={gpsHealth.staleCss}>{gpsHealth.stale} stale</span>
                        <span class="slds-badge cs-badge-aqua">WEX source</span>
                    </div>
                    <button type="button" class="slds-button slds-button_neutral slds-button_stretch" onclick={handleRefreshGps}>↻ Refresh GPS</button>
                </div>
            </lightning-card>
        </div>
    </div>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 8 — DAY-OF MONITOR
═══════════════════════════════════════════════════════ -->
<template if:true={isDayOf}>
    <lightning-card title="Day-of refresh cadence" icon-name="standard schedule" class="slds-m-bottom_small">
        <div class="slds-p-around_small">
            <div class="slds-grid slds-wrap slds-gutters_x-small">
                <template for:each={dayOfCadence} for:item="c">
                    <div key={c.slotTime} class="slds-col slds-size_1-of-3 slds-large-size_1-of-5">
                        <div class={c.css}>
                            <div class="cs-kpi-v">{c.slotTime}</div>
                            <div class="slds-text-title">{c.label}</div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>

    <lightning-card title="Health check monitor" icon-name="standard:task2">
        <div slot="actions"><span class={dayOfSummary.redCss}>{dayOfSummary.redLabel}</span></div>
        <div class="slds-p-around_small">
            <template if:true={hasDayOfChecks}>
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <template for:each={dayOfChecks} for:item="h">
                        <div key={h.crewName} class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                            <div class="job-card slds-box slds-box_x-small">
                                <div class="job-title">{h.crewName}</div>
                                <span class={h.statusCss}>{h.status} · {h.checkTime}</span>
                                <div class="job-sub">{h.note}</div>
                                <template if:true={h.isRed}>
                                    <div class="job-actions slds-m-top_x-small">
                                        <button type="button" class="slds-button slds-button_destructive" data-crew={h.crewName} onclick={handleEscalateDayOf}>Escalate</button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasDayOfChecks}>
                <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">No health check data. Foreman submissions sync from Appointments status updates.</div>
            </template>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 9 — MEASURING CUP
═══════════════════════════════════════════════════════ -->
<template if:true={isMeasuringCup}>
    <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v">{mcKpi.goalHours}</div>
                <div class="slds-text-title">Goal hours</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-green">{mcKpi.actualHours}</div>
                <div class="slds-text-title">Actual so far</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-amber">{mcKpi.dayVariance}</div>
                <div class="slds-text-title">Day variance</div>
            </div>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
            <div class="slds-box slds-box_x-small cs-kpi-tile">
                <div class="cs-kpi-v cs-kpi-green">{mcKpi.crewsGreen} / {mcKpi.crewsTotal}</div>
                <div class="slds-text-title">Crews green</div>
            </div>
        </div>
    </div>

    <lightning-card title="Measuring Cup live crew rollup" icon-name="standard:metrics">
        <div class="slds-p-horizontal_small">
            <template if:true={hasMcRows}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Crew</div></th>
                                <th scope="col"><div class="slds-truncate">Work Type</div></th>
                                <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Goal</div></th>
                                <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Actual</div></th>
                                <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Variance</div></th>
                                <th scope="col"><div class="slds-truncate">Source</div></th>
                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={mcRows} for:item="r">
                                <tr key={r.crewName} class="slds-hint-parent">
                                    <td data-label="Crew">{r.crewName}</td>
                                    <td data-label="Work Type">{r.workType}</td>
                                    <td data-label="Goal" class="slds-text-align_right">{r.goalHours}</td>
                                    <td data-label="Actual" class="slds-text-align_right">{r.actualHours}</td>
                                    <td data-label="Variance" class="slds-text-align_right"><span class={r.varianceCss}>{r.variance}</span></td>
                                    <td data-label="Source" class="slds-text-color_weak slds-text-body_small">{r.source}</td>
                                    <td data-label="Status"><span class={r.statusCss}>{r.status}</span></td>
                                    <td>
                                        <template if:true={r.workOrderId}>
                                            <button type="button" class="slds-button slds-button_neutral" data-id={r.workOrderId} onclick={handleViewMcWo}>View WO</button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template if:false={hasMcRows}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">No crew utilization data. Source: WorkOrderLineItem, TimeSheetEntry, Rippling time entries.</div>
            </template>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 10 — TRAFFIC
═══════════════════════════════════════════════════════ -->
<template if:true={isTraffic}>
    <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_small" role="alert">
        <strong>Traffic overlay:</strong> Live Google traffic across all markets. Zoom in or out to inspect each market. ETA deltas below come from the Traffic feed and Optimizer; if that source is unavailable a warning state is shown, never a fake ETA.
    </div>
    <lightning-card title="Live traffic map — all markets" icon-name="standard:location" class="slds-m-bottom_small">
        <div slot="actions"><span class="slds-badge cs-badge-green">Live traffic layer</span></div>
        <c-loving-google-dispatch-map
            markers={marketMapMarkers}
            show-traffic
            map-height="460px"
            zoom="8">
        </c-loving-google-dispatch-map>
    </lightning-card>

    <lightning-card title="Active traffic impacts" icon-name="standard:case">
        <div class="slds-p-horizontal_small">
            <template if:true={hasTraffic}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Route</div></th>
                                <th scope="col"><div class="slds-truncate">Segment</div></th>
                                <th scope="col"><div class="slds-truncate">Impact</div></th>
                                <th scope="col"><div class="slds-truncate">ETA Delta</div></th>
                                <th scope="col"><div class="slds-truncate">System Response</div></th>
                                <th scope="col"><div class="slds-truncate">Action</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={trafficImpacts} for:item="t">
                                <tr key={t.id} class="slds-hint-parent">
                                    <td data-label="Route">{t.crewName}</td>
                                    <td data-label="Segment">{t.segment}</td>
                                    <td data-label="Impact"><span class={t.impactCss}>{t.impactLevel}</span></td>
                                    <td data-label="ETA Delta">{t.etaDelta}</td>
                                    <td data-label="System Response" class="slds-text-color_weak slds-text-body_small">{t.systemResponse}</td>
                                    <td data-label="Action">
                                        <button type="button" class="slds-button slds-button_neutral" data-id={t.id} onclick={handleReroute}>Re-route</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template if:false={hasTraffic}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">No Traffic feed records — or traffic integration not configured. Connect approved traffic provider to this object.</div>
            </template>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 11 — WEATHER
═══════════════════════════════════════════════════════ -->
<template if:true={isWeather}>
    <lightning-card title="Live weather by division" icon-name="standard:topic" class="slds-m-bottom_small">
        <div slot="actions"><span class="slds-badge cs-badge-green">Live · NWS + Open-Meteo</span></div>
        <div class="slds-p-around_small">
            <div class="slds-grid slds-wrap slds-gutters_small">
                <template for:each={divisionWeather} for:item="d">
                    <div key={d.division} class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                        <div class="slds-box slds-box_x-small">
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                                <div class="slds-text-title_bold">{d.division}</div>
                                <div style="font-size: 22px">{d.icon}</div>
                            </div>
                            <div class="slds-grid slds-grid_vertical-align-end slds-m-bottom_x-small">
                                <div class="cs-kpi-v">{d.tempLabel}</div>
                                <div class="slds-text-color_weak slds-m-left_x-small">{d.condition}</div>
                            </div>
                            <div class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                <span>🌧 {d.rainPct}% rain</span>
                                <span class="slds-m-left_small">💨 {d.windMph} mph</span>
                            </div>
                            <img src={d.radarUrl} alt="Radar" class="sco-radar-img"/>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>

    <template if:true={hasWeatherAlerts}>
        <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
            <template for:each={weatherAlerts} for:item="wa">
                <div key={wa.id} class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                    <div class="weather-card slds-box">
                        <div class="weather-main">
                            <div class="weather-ico">{wa.icon}</div>
                            <div>
                                <div class="slds-text-body_small slds-text-color_weak">{wa.division}</div>
                                <div class="slds-text-title_bold">{wa.summary}</div>
                                <div class="slds-text-body_small slds-text-color_weak">{wa.details} · {wa.startDisplay} – {wa.endDisplay}</div>
                            </div>
                        </div>
                        <div class="pill-row slds-m-top_x-small">
                            <span class={wa.severityCss}>{wa.severity}</span>
                            <span class="slds-badge cs-badge-aqua">{wa.affectedStops} stops affected</span>
                        </div>
                        <div class="slds-m-top_x-small">
                            <button type="button" class="slds-button slds-button_destructive" data-id={wa.id} onclick={handleWeatherHold}>Place Hold</button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>
    <template if:false={hasWeatherAlerts}>
        <div class="slds-notify slds-notify_alert slds-theme_success slds-m-bottom_small" role="alert"><strong>No active weather alerts.</strong> Weather service source shows clear conditions.</div>
    </template>

    <lightning-card title="Weather decision tiers" icon-name="standard:process">
        <div class="slds-p-horizontal_small">
            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Severity</div></th>
                            <th scope="col"><div class="slds-truncate">Source</div></th>
                            <th scope="col"><div class="slds-truncate">System Response</div></th>
                            <th scope="col"><div class="slds-truncate">Human Review</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="slds-hint-parent">
                            <td><span class="slds-badge cs-badge-green">Clear</span></td>
                            <td>Weather service / NWS</td><td>Proceed</td><td>No</td>
                        </tr>
                        <tr class="slds-hint-parent">
                            <td><span class="slds-badge cs-badge-aqua">Watch</span></td>
                            <td>Weather service / NWS</td><td>Flag on board</td><td>FM / Scheduling</td>
                        </tr>
                        <tr class="slds-hint-parent">
                            <td><span class="slds-badge cs-badge-amber">Warning</span></td>
                            <td>Weather service / NWS</td><td>Move affected stops to review</td><td>Scheduling Manager</td>
                        </tr>
                        <tr class="slds-hint-parent">
                            <td><span class="slds-badge cs-badge-red">Severe</span></td>
                            <td>Weather service / NWS</td><td>Auto-hold territory</td><td>COO override only</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 12 — OVERTIME
═══════════════════════════════════════════════════════ -->
<template if:true={isOvertime}>
    <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_small" role="alert">
        <strong>Overtime uses Rippling clock-in/out.</strong> Actual hours are summed from Rippling time entries; projected = hours clocked plus scheduled hours remaining this week. Never calculated from display-only cards or the schedule alone.
    </div>
    <template if:true={clockDataUnavailable}>
        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
            <strong>Rippling clock data not yet synced for this week.</strong> Actual and projected hours show "—" and overtime cannot be calculated from clock-in/out until the time-entry sync completes.
        </div>
    </template>
    <lightning-card title="Weekly hours and release block" icon-name="standard:timesheet">
        <div class="slds-p-horizontal_small">
            <template if:true={hasOtRows}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Resource</div></th>
                                <th scope="col"><div class="slds-truncate">Crew</div></th>
                                <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Scheduled hrs</div></th>
                                <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Actual hrs (clocked)</div></th>
                                <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Projected hrs</div></th>
                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                <th scope="col"><div class="slds-truncate">Action</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={otRows} for:item="r">
                                <tr key={r.rowKey} class="slds-hint-parent">
                                    <td data-label="Resource">{r.resourceName}</td>
                                    <td data-label="Crew">{r.crewName}</td>
                                    <td data-label="Scheduled hrs" class="slds-text-align_right">{r.scheduledHours}</td>
                                    <td data-label="Actual hrs" class="slds-text-align_right">{r.actualDisp}</td>
                                    <td data-label="Projected hrs" class="slds-text-align_right">{r.projectedDisp}</td>
                                    <td data-label="Status"><span class={r.chipCss}>{r.otLabel}</span></td>
                                    <td data-label="Action">
                                        <template if:true={r.otRisk}>
                                            <button type="button" class="slds-button slds-button_destructive" data-id={r.employeeId} onclick={handleResolveOt}>Resolve</button>
                                        </template>
                                        <template if:false={r.otRisk}>
                                            <button type="button" class="slds-button slds-button_neutral" disabled>No action</button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template if:false={hasOtRows}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">No overtime risks detected. Source: Rippling time entries and time off.</div>
            </template>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 13 — CREW OPTIMIZATION
═══════════════════════════════════════════════════════ -->
<template if:true={isCrewOpt}>
    <div class="slds-grid slds-wrap slds-gutters_small">
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
            <lightning-card title="Crew efficiency MTD" icon-name="standard:account_team_member">
                <div class="slds-p-horizontal_small">
                    <template if:true={hasCrewEfficiency}>
                        <div class="slds-scrollable_x">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">Crew</div></th>
                                        <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Stops</div></th>
                                        <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Goal hrs</div></th>
                                        <th scope="col" class="slds-text-align_right"><div class="slds-truncate">Actual hrs</div></th>
                                        <th scope="col" class="slds-text-align_right"><div class="slds-truncate">QI</div></th>
                                        <th scope="col" class="slds-text-align_right"><div class="slds-truncate">FJ%</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={crewEfficiency} for:item="e">
                                        <tr key={e.crewName} class="slds-hint-parent">
                                            <td data-label="Crew">{e.crewName}</td>
                                            <td data-label="Stops" class="slds-text-align_right">{e.stops}</td>
                                            <td data-label="Goal hrs" class="slds-text-align_right">{e.goalHours}</td>
                                            <td data-label="Actual hrs" class="slds-text-align_right">{e.actualHours}</td>
                                            <td data-label="QI" class="slds-text-align_right">{e.qiScore}</td>
                                            <td data-label="FJ%" class="slds-text-align_right">{e.fjPct}%</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={hasCrewEfficiency}>
                        <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">No crew efficiency data. Source: WorkOrderLineItem, Rippling, QI score.</div>
                    </template>
                </div>
            </lightning-card>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
            <lightning-card title="Optimizer recommendations" icon-name="standard:multi_picklist">
                <div class="slds-p-around_small">
                    <template if:true={hasOptimizerRecs}>
                        <template for:each={optimizerRecs} for:item="rec">
                            <div key={rec.id} class="job-card slds-box slds-box_x-small slds-m-bottom_x-small">
                                <div class="job-title">{rec.crewName}</div>
                                <div class="job-sub">{rec.recommendation} · <span class={rec.chipCss}>{rec.minutesSaved} min saved</span></div>
                                <div class="job-actions slds-m-top_x-small">
                                    <button type="button" class="slds-button slds-button_brand" data-id={rec.id} onclick={handleApplyOptimizerRec}>Apply</button>
                                    <button type="button" class="slds-button slds-button_neutral" onclick={handleDismissRec}>Dismiss</button>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasOptimizerRecs}>
                        <div class="slds-text-color_weak slds-text-body_small">No Optimizer proposals. Run optimizer to generate recommendations.</div>
                    </template>
                </div>
            </lightning-card>
        </div>
    </div>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 14 — DRAFT REVIEW
═══════════════════════════════════════════════════════ -->
<template if:true={isDraftReview}>
    <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_small" role="alert">
        <strong>{draftReview.draftTime} draft review:</strong> Schedule can be approved in sections. Auto-release is blocked for weather, stale GPS, PTO conflict, or overtime conflicts.
    </div>
    <lightning-card title="Draft release readiness" icon-name="standard:approval">
        <div slot="actions">
            <button type="button" class="slds-button slds-button_brand" onclick={handleReleaseSchedule}>Approve cleared release</button>
        </div>
        <div class="slds-p-horizontal_small">
            <template if:true={hasDraftCrews}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Crew</div></th>
                                <th scope="col"><div class="slds-truncate">Stops</div></th>
                                <th scope="col"><div class="slds-truncate">Route miles</div></th>
                                <th scope="col"><div class="slds-truncate">Weather</div></th>
                                <th scope="col"><div class="slds-truncate">PTO</div></th>
                                <th scope="col"><div class="slds-truncate">OT</div></th>
                                <th scope="col"><div class="slds-truncate">Release Status</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={draftCrews} for:item="c">
                                <tr key={c.crewName} class="slds-hint-parent">
                                    <td data-label="Crew">{c.crewName} <span class="slds-text-color_weak slds-text-body_small">· {c.foremanName}</span></td>
                                    <td data-label="Stops">{c.stops}</td>
                                    <td data-label="Route miles">{c.routeMiles} mi</td>
                                    <td data-label="Weather"><span class={c.weatherCss}>{c.weatherStatus}</span></td>
                                    <td data-label="PTO"><span class={c.ptoCss}>{c.ptoStatus}</span></td>
                                    <td data-label="OT"><span class={c.otCss}>{c.otStatus}</span></td>
                                    <td data-label="Release Status"><span class={c.chipCss}>{c.releaseStatus}</span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template if:false={hasDraftCrews}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-m-around_small" role="alert">No scheduled crews for draft review. Source: service day, WorkOrder.</div>
            </template>
        </div>
    </lightning-card>
</template>

<!-- ═══════════════════════════════════════════════════════
     TAB 15 — DECISION RULES
═══════════════════════════════════════════════════════ -->
<template if:true={isDecisionRules}>
    <template if:true={rulesReadOnly}>
        <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_small" role="alert">
            <strong>Read-only.</strong> You can review the scheduling decision rules but not change them. Editing requires the LOVING Scheduling Rules Admin permission.
        </div>
    </template>

    <lightning-card title="Scheduling decision weights" icon-name="standard:approval" class="slds-m-bottom_small">
        <div slot="actions">
            <span class={weightTotalChipCss}>{weightTotalLabel}</span>
            <template if:true={canEditRules}>
                <div class="slds-button-group slds-m-left_small" role="group">
                    <button type="button" class="slds-button slds-button_neutral" onclick={handleResetRules}>Reset to default</button>
                    <button type="button" class="slds-button slds-button_brand" onclick={handleSaveRules}>Save changes</button>
                </div>
            </template>
        </div>
        <div class="slds-p-horizontal_small">
            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width:26%"><div class="slds-truncate">Rule</div></th>
                            <th scope="col"><div class="slds-truncate">What it favors</div></th>
                            <th scope="col" style="width:110px" class="slds-text-align_right"><div class="slds-truncate">Weight %</div></th>
                            <th scope="col" style="width:44px"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={editWeightRules} for:item="r" for:index="idx">
                            <tr key={r._key} class="slds-hint-parent">
                                <td>
                                    <lightning-input label="Rule name" variant="label-hidden" value={r.name} data-idx={idx} data-field="name" onchange={handleWeightRuleChange} disabled={rulesReadOnly}></lightning-input>
                                </td>
                                <td>
                                    <lightning-input label="What it favors" variant="label-hidden" value={r.favors} data-idx={idx} data-field="favors" onchange={handleWeightRuleChange} disabled={rulesReadOnly}></lightning-input>
                                </td>
                                <td class="slds-text-align_right">
                                    <lightning-input label="Weight %" variant="label-hidden" type="number" min="0" max="100" value={r.weight} data-idx={idx} onchange={handleWeightPctInput} disabled={rulesReadOnly}></lightning-input>
                                </td>
                                <td>
                                    <button type="button" class="slds-button slds-button_icon slds-button_icon-border-filled" data-idx={idx} onclick={handleDeleteWeightRule} aria-label="Remove rule" disabled={rulesReadOnly}>
                                        <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <template if:true={canEditRules}>
                <button type="button" class="slds-button slds-button_neutral slds-m-top_small" onclick={handleAddWeightRule}>+ Add weight rule</button>
            </template>
        </div>
    </lightning-card>

    <lightning-card title="Optimization rules" icon-name="standard:settings" class="slds-m-bottom_small">
        <div class="slds-p-horizontal_small">
            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width:28%"><div class="slds-truncate">Rule</div></th>
                            <th scope="col"><div class="slds-truncate">Setting</div></th>
                            <th scope="col" style="width:160px"><div class="slds-truncate">Applies to</div></th>
                            <th scope="col" style="width:56px" class="slds-text-align_center"><div class="slds-truncate">Active</div></th>
                            <th scope="col" style="width:44px"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={editOptRules} for:item="r" for:index="idx">
                            <tr key={r._key} class="slds-hint-parent">
                                <td>
                                    <lightning-input label="Rule" variant="label-hidden" value={r.name} data-idx={idx} data-field="name" onchange={handleOptRuleChange} disabled={rulesReadOnly}></lightning-input>
                                </td>
                                <td>
                                    <lightning-input label="Setting" variant="label-hidden" value={r.setting} data-idx={idx} data-field="setting" onchange={handleOptRuleChange} disabled={rulesReadOnly}></lightning-input>
                                </td>
                                <td>
                                    <lightning-combobox label="Applies to" variant="label-hidden" value={r.appliesTo} options={r.appliesOptions} data-idx={idx} onchange={handleOptAppliesTo} disabled={rulesReadOnly}></lightning-combobox>
                                </td>
                                <td class="slds-text-align_center">
                                    <div class={r.toggleCls} data-idx={idx} onclick={handleToggleOptRule} role="switch" aria-checked={r.active} tabindex="0">
                                        <span class="toggle-track"></span><span class="toggle-thumb"></span>
                                    </div>
                                </td>
                                <td>
                                    <button type="button" class="slds-button slds-button_icon slds-button_icon-border-filled" data-idx={idx} onclick={handleDeleteOptRule} aria-label="Remove rule" disabled={rulesReadOnly}>
                                        <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <template if:true={canEditRules}>
                <button type="button" class="slds-button slds-button_neutral slds-m-top_small" onclick={handleAddOptRule}>+ Add optimization rule</button>
            </template>
        </div>
    </lightning-card>

    <lightning-card title="Automation rules" icon-name="standard:process">
        <div slot="actions">
            <div class="slds-button-group" role="group">
                <button type="button" class="slds-button slds-button_brand" onclick={handleNewDecisionRule}>+ New Rule</button>
                <button type="button" class="slds-button slds-button_neutral" onclick={handleRefreshDecisionRules}>Refresh</button>
            </div>
        </div>
        <div class="slds-p-horizontal_small">
            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Condition</div></th>
                            <th scope="col"><div class="slds-truncate">Source</div></th>
                            <th scope="col"><div class="slds-truncate">System Response</div></th>
                            <th scope="col"><div class="slds-truncate">Human?</div></th>
                            <th scope="col"><div class="slds-truncate">Actions</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={decisionRules} for:item="r">
                            <tr key={r.id} class="slds-hint-parent">
                                <td data-label="Condition">{r.condition}</td>
                                <td data-label="Source" class="slds-text-color_weak slds-text-body_small">{r.source}</td>
                                <td data-label="System Response">{r.systemAction}</td>
                                <td data-label="Human?"><span class={r.humanCss}>{r.requiresHuman}</span></td>
                                <td data-label="Actions">
                                    <button type="button" class="slds-button slds-button_neutral slds-button_small slds-m-right_x-small" data-id={r.id} onclick={handleEditDecisionRule}>Edit</button>
                                    <button type="button" class="slds-button slds-button_neutral slds-button_small" data-id={r.id} onclick={handleViewDecisionRule}>View</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </lightning-card>
</template>

</div>

<!-- Action modal -->
<template if:true={showModal}>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="sco-modal-heading" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container" onclick={stopPropagation}>
            <header class="slds-modal__header">
                <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse" size="large" class="slds-modal__close" onclick={handleCloseModal}></lightning-button-icon>
                <h2 id="sco-modal-heading" class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_small" role="alert">
                    <strong>This action updates FSL and LOVING records and writes to the audit log.</strong>
                </div>
                <dl class="slds-dl_horizontal">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Primary source</dt>
                    <dd class="slds-dl_horizontal__detail">Appointments / Crews</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Validation</dt>
                    <dd class="slds-dl_horizontal__detail">Weather, Traffic, PTO, GPS, Crew capacity</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Audit log</dt>
                    <dd class="slds-dl_horizontal__detail">schedule issues or Salesforce Chatter</dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak">Rollback</dt>
                    <dd class="slds-dl_horizontal__detail">Restore prior SA assignment and status</dd>
                </dl>
            </div>
            <footer class="slds-modal__footer">
                <button type="button" class="slds-button slds-button_neutral" onclick={handleCloseModal}>Cancel</button>
                <button type="button" class="slds-button slds-button_brand" onclick={handleConfirmModal}>Confirm</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseModal}></div>
</template>

<!-- mcLOVIN — loving command center agent. Freestanding floating dock (its own
     position:fixed): the yellow-shirt character with his chat forms, present on
     every tab of the console. Rendered at template root so no header/flex
     container constrains it. -->
<c-mc-lovin-dock></c-mc-lovin-dock>

</template>
