<template>
    <template if:true={isLoaded}>
        <div class="sf-body">
            <!-- Path -->
            <div class="card">
                <div class="ch">
                    <div class="ci" style="background:#fe9339">PATH</div>
                    <h3>Work Order Status</h3>
                    <span class="chip co">Outdoor Living</span>
                </div>
                <div class="path">
                    <template for:each={pathSteps} for:item="step">
                        <div key={step.label} class={step.cssClass}>{step.label}</div>
                    </template>
                </div>
            </div>

            <div class="layout">
                <div class="layout-main">
                    <!-- Header -->
                    <div class="card info">
                        <div class="ch">
                            <div class="ci" style="background:#0070d2">WO</div>
                            <h3>Work Order Header</h3>
                        </div>
                        <div class="fields-grid">
                            <div><div class="field-label">Work Order</div><div class="field-value">{workOrder.WorkOrderNumber}</div></div>
                            <div><div class="field-label">Opportunity</div><div class="field-value nl">{workOrder.ODL_Opportunity__r.Name}</div></div>
                            <div><div class="field-label">Division</div><div class="field-value">{workOrder.Division__c}</div></div>
                            <div><div class="field-label">Job Type</div><div class="field-value">{workOrder.Job_Type__c}</div></div>
                            <div><div class="field-label">Customer Visible Status</div><div class="field-value">{workOrder.Customer_Visible_Status__c}</div></div>
                            <div><div class="field-label">Property</div><div class="field-value nl">{workOrder.Homeowner_Property__r.Name}</div></div>
                        </div>
                    </div>

                    <!-- Crew + Photos side by side -->
                    <div class="g2">
                        <div class="card">
                            <div class="ch">
                                <div class="ci" style="background:#04844b">CREW</div>
                                <h3>Crew and Schedule</h3>
                            </div>
                            <div class="fields-grid">
                                <div><div class="field-label">Crew</div><div class="field-value">{workOrder.Owner.Name}</div></div>
                                <div><div class="field-label">Field Manager</div><div class="field-value">—</div></div>
                                <div><div class="field-label">Start Date</div><div class="field-value">{startDateFormatted}</div></div>
                                <div><div class="field-label">Target Completion</div><div class="field-value">{endDateFormatted}</div></div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="ch">
                                <div class="ci" style="background:#534ab7">PHOTO</div>
                                <h3>Photos</h3>
                            </div>
                            <div class="photo-grid" style="padding:12px 14px">
                                <div class="photo">Before</div>
                                <div class="photo">Progress</div>
                                <div class="photo">In Progress</div>
                                <div class="photo">Closeout</div>
                            </div>
                        </div>
                    </div>

                    <!-- Punch Items -->
                    <div class="card">
                        <div class="ch">
                            <div class="ci" style="background:#fe9339">PUNCH</div>
                            <h3>Punch Items</h3>
                        </div>
                        <table class="tbl">
                            <thead><tr><th>Item</th><th>Owner</th><th>Status</th><th>Due</th></tr></thead>
                            <tbody>
                                <template for:each={lineItems} for:item="item">
                                    <tr key={item.Id}>
                                        <td>{item.Subject}</td>
                                        <td>{item.ownerName}</td>
                                        <td><span class={item.statusChipClass}>{item.Status}</span></td>
                                        <td>{item.dueDateFormatted}</td>
                                    </tr>
                                </template>
                                <template if:true={noLineItems}>
                                    <tr><td colspan="4" style="text-align:center;color:#54698d;padding:12px">No punch items yet</td></tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Rail -->
                <div class="layout-rail">
                    <div class="card">
                        <div class="ch">
                            <div class="ci" style="background:#04844b">MOB</div>
                            <h3>Foreman Mobile Actions</h3>
                        </div>
                        <div class="qa-list">
                            <div class="qa-item">Upload progress photos</div>
                            <div class="qa-item">Log labor</div>
                            <div class="qa-item">Update materials used</div>
                            <div class="qa-item">Submit punch notes</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="ch">
                            <div class="ci" style="background:#534ab7">AI</div>
                            <h3>Assistant Panel</h3>
                        </div>
                        <div class="qa-list">
                            <div class="qa-item">Summarize work order status</div>
                            <div class="qa-item">Draft customer update</div>
                            <div class="qa-item">Show open punch items</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="ch">
                            <div class="ci" style="background:#0070d2">SLA</div>
                            <h3>Activity Health</h3>
                        </div>
                        <div style="padding:10px 14px">
                            <div class="rail-row"><span>Last touch</span><span>—</span></div>
                            <div class="rail-row"><span>Voicemail</span><span class="chip cgr">None</span></div>
                            <div class="rail-row"><span>Next follow-up</span><span class="chip cb2">—</span></div>
                            <div class="rail-row"><span>Open tasks</span><span>{openPunchCount}</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template if:false={isLoaded}>
        <div style="padding:20px;text-align:center;color:#54698d">Loading...</div>
    </template>
</template>
