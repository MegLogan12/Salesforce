<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOVING — Builder Hierarchy</title>
<style>
  :root {
    --green:   #2d6a4f;
    --green-lt:#52b788;
    --green-bg:#d8f3dc;
    --sand:    #f4a261;
    --sand-lt: #fde8d1;
    --sky:     #118ab2;
    --sky-lt:  #d0eaf5;
    --plum:    #6d4c8c;
    --plum-lt: #e8dff5;
    --lot:     #e76f51;
    --lot-lt:  #fde8e2;
    --white:   #ffffff;
    --gray:    #6c757d;
    --gray-lt: #f8f9fa;
    --border:  #dee2e6;
    --shadow:  0 2px 12px rgba(0,0,0,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f4f2;
    color: #1a1a1a;
    min-height: 100vh;
  }

  /* ── TOP NAV ─────────────────────────────── */
  header {
    background: var(--green);
    color: #fff;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .04em; }
  header span { font-size: .8rem; opacity: .75; }
  .nav-pills { display: flex; gap: .5rem; }
  .nav-pill {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);
    color: #fff;
    border-radius: 20px;
    padding: 4px 14px;
    font-size: .78rem;
    cursor: pointer;
    transition: background .2s;
  }
  .nav-pill:hover, .nav-pill.active { background: rgba(255,255,255,.3); }

  /* ── BREADCRUMB ──────────────────────────── */
  #breadcrumb {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: .55rem 2rem;
    font-size: .82rem;
    color: var(--gray);
    display: flex;
    align-items: center;
    gap: .4rem;
    flex-wrap: wrap;
  }
  .bc-item { cursor: pointer; color: var(--green); font-weight: 500; }
  .bc-item:hover { text-decoration: underline; }
  .bc-sep { color: #ccc; }

  /* ── LAYOUT ──────────────────────────────── */
  .layout {
    display: flex;
    gap: 0;
    min-height: calc(100vh - 100px);
  }

  /* ── SIDEBAR ─────────────────────────────── */
  aside {
    width: 260px;
    min-width: 220px;
    background: #fff;
    border-right: 1px solid var(--border);
    padding: 1.2rem 0;
    overflow-y: auto;
  }
  .sidebar-title {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--gray);
    padding: 0 1.2rem .6rem;
  }
  .tree-item {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .45rem 1.2rem;
    cursor: pointer;
    font-size: .85rem;
    transition: background .15s;
    border-left: 3px solid transparent;
  }
  .tree-item:hover { background: var(--gray-lt); }
  .tree-item.active {
    background: var(--green-bg);
    border-left-color: var(--green);
    color: var(--green);
    font-weight: 600;
  }
  .tree-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .tree-item.l0 .tree-dot { background: var(--green); }
  .tree-item.l1 { padding-left: 2.2rem; }
  .tree-item.l1 .tree-dot { background: var(--sky); }
  .tree-item.l2 { padding-left: 3.2rem; }
  .tree-item.l2 .tree-dot { background: var(--plum); }
  .tree-item.l3 { padding-left: 4.2rem; }
  .tree-item.l3 .tree-dot { background: var(--lot); width:8px; height:8px; }
  .tree-toggle {
    margin-left: auto;
    font-size: .7rem;
    color: var(--gray);
  }

  /* ── MAIN CONTENT ────────────────────────── */
  main {
    flex: 1;
    padding: 1.8rem 2rem;
    overflow-y: auto;
  }

  /* ── SECTION HEADER ──────────────────────── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.4rem;
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: .7rem;
  }
  .level-badge {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    border-radius: 6px;
    padding: .3rem .9rem;
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .badge-builder  { background: var(--green-bg); color: var(--green); }
  .badge-division { background: var(--sky-lt);   color: var(--sky);   }
  .badge-community{ background: var(--plum-lt);  color: var(--plum);  }
  .badge-lot      { background: var(--lot-lt);   color: var(--lot);   }

  .section-header h2 { font-size: 1.4rem; font-weight: 700; }

  /* ── BUTTONS ─────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    border: none;
    border-radius: 6px;
    padding: .5rem 1rem;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter .18s, transform .1s;
  }
  .btn:hover  { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }
  .btn-primary   { background: var(--green);  color: #fff; }
  .btn-sky       { background: var(--sky);    color: #fff; }
  .btn-plum      { background: var(--plum);   color: #fff; }
  .btn-lot       { background: var(--lot);    color: #fff; }
  .btn-outline   { background: #fff; border: 1.5px solid var(--border); color: #444; }
  .btn-outline:hover { background: var(--gray-lt); }
  .btn-danger    { background: #dc3545; color: #fff; }
  .btn-sm { padding: .3rem .7rem; font-size: .75rem; }
  .btn-group { display: flex; gap: .5rem; flex-wrap: wrap; }

  /* ── STATS BAR ───────────────────────────── */
  .stats-bar {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.6rem;
    flex-wrap: wrap;
  }
  .stat-card {
    flex: 1;
    min-width: 120px;
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 1rem 1.2rem;
    box-shadow: var(--shadow);
  }
  .stat-card .stat-num {
    font-size: 1.8rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: .25rem;
  }
  .stat-card .stat-lbl { font-size: .75rem; color: var(--gray); text-transform: uppercase; letter-spacing: .05em; }
  .stat-green  { border-top: 3px solid var(--green); }
  .stat-sky    { border-top: 3px solid var(--sky); }
  .stat-plum   { border-top: 3px solid var(--plum); }
  .stat-lot    { border-top: 3px solid var(--lot); }

  /* ── CARDS GRID ──────────────────────────── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  .card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow .2s, transform .15s;
  }
  .card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.13); transform: translateY(-2px); }

  .card-header {
    padding: .9rem 1.1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .card-header-name {
    font-weight: 700;
    font-size: .95rem;
  }
  .card-body { padding: 1rem 1.1rem; }
  .card-field {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .28rem 0;
    font-size: .82rem;
    border-bottom: 1px solid #f2f2f2;
  }
  .card-field:last-child { border-bottom: none; }
  .card-field label { color: var(--gray); flex-shrink: 0; margin-right: .5rem; }
  .card-field span  { font-weight: 600; text-align: right; }
  .card-footer {
    padding: .75rem 1.1rem;
    background: var(--gray-lt);
    border-top: 1px solid var(--border);
    display: flex;
    gap: .4rem;
    flex-wrap: wrap;
  }

  /* ── STATUS PILL ─────────────────────────── */
  .status-pill {
    display: inline-block;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: .72rem;
    font-weight: 700;
  }
  .s-active     { background: #d4edda; color: #155724; }
  .s-hold       { background: #fff3cd; color: #856404; }
  .s-complete   { background: #cce5ff; color: #004085; }
  .s-pending    { background: #f8d7da; color: #721c24; }
  .s-scheduled  { background: #e2d9f3; color: #4a1e8c; }

  /* ── DETAIL PANEL ────────────────────────── */
  #detail-panel {
    display: none;
    position: fixed;
    top: 0; right: 0;
    width: 420px;
    height: 100vh;
    background: #fff;
    border-left: 1px solid var(--border);
    box-shadow: -4px 0 24px rgba(0,0,0,.13);
    z-index: 200;
    overflow-y: auto;
    transition: transform .25s;
  }
  .detail-hdr {
    padding: 1.2rem 1.4rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .detail-hdr h3 { font-size: 1.1rem; font-weight: 700; }
  .detail-close  { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--gray); line-height: 1; }
  .detail-body   { padding: 1.2rem 1.4rem; }
  .detail-section { margin-bottom: 1.4rem; }
  .detail-section h4 {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--gray);
    margin-bottom: .6rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: .4rem;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: .45rem 0;
    font-size: .85rem;
    border-bottom: 1px solid #f5f5f5;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row label { color: var(--gray); flex-shrink: 0; margin-right: .8rem; max-width: 45%; }
  .detail-row span  { font-weight: 600; text-align: right; }
  .detail-actions   { padding: 1rem 1.4rem; border-top: 1px solid var(--border); display: flex; gap: .5rem; }

  /* ── MODAL ───────────────────────────────── */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 500px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal-hdr {
    padding: 1.2rem 1.4rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-hdr h3 { font-size: 1rem; font-weight: 700; }
  .modal-body   { padding: 1.4rem; }
  .modal-footer {
    padding: 1rem 1.4rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: .6rem;
  }
  .form-group { margin-bottom: 1rem; }
  .form-group label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    color: #444;
    margin-bottom: .35rem;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: .5rem .75rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-size: .85rem;
    transition: border-color .2s;
    font-family: inherit;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--green-lt);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }

  /* ── TOAST ───────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    color: #fff;
    padding: .75rem 1.5rem;
    border-radius: 8px;
    font-size: .85rem;
    font-weight: 600;
    box-shadow: var(--shadow);
    z-index: 500;
    transition: transform .3s;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── PIPELINE PROGRESS ───────────────────── */
  .pipeline-bar {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    height: 28px;
    margin-bottom: .5rem;
    font-size: .72rem;
    font-weight: 700;
  }
  .pipeline-seg {
    display: flex;
    align-items: center;
    justify-content: center;
    transition: flex .4s;
    cursor: default;
    white-space: nowrap;
    overflow: hidden;
  }
  .seg-takeoff  { background: #6c757d; color: #fff; }
  .seg-sched    { background: var(--plum); color: #fff; }
  .seg-inprog   { background: var(--sky); color: #fff; }
  .seg-complete { background: var(--green); color: #fff; }
  .seg-hold     { background: var(--sand); color: #fff; }

  /* ── EMPTY STATE ─────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--gray);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state p { font-size: .9rem; margin-bottom: 1.2rem; }

  /* ── SEARCH ──────────────────────────────── */
  .search-bar {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 1.4rem;
  }
  .search-bar input {
    flex: 1;
    padding: .5rem .9rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: .85rem;
  }
  .search-bar input:focus { outline: none; border-color: var(--green-lt); }

  /* ── RESPONSIVE ──────────────────────────── */
  @media (max-width: 768px) {
    aside { display: none; }
    .cards-grid { grid-template-columns: 1fr; }
    #detail-panel { width: 100%; }
  }
</style>
</head>

//  STATE
// ══════════════════════════════════════════════════
let state = {
  view: 'builders',
  selectedBuilderId: null,
  selectedDivId: null,
  selectedCommId: null,
  searchQuery: '',
};

let modalCallback = null;

// ══════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════
function uid() { return '_' + Math.random().toString(36).slice(2,9); }

function statusPill(s) {
  const map = {
    'In Progress':'s-active', 'Scheduled':'s-scheduled', 'Complete':'s-complete',
    'On Hold':'s-hold', 'Takeoff':'s-pending'
  };
  return `<span class="status-pill ${map[s]||''}">${s}</span>`;
}

function toast(msg, color='#1a1a1a') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function closeDetail() {
  document.getElementById('detail-panel').style.display = 'none';
}

function openModal(title, bodyHTML, onSave) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-overlay').classList.add('open');
  modalCallback = onSave;
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  modalCallback = null;
}

function saveModal() {
  if (modalCallback) modalCallback();
}

// ══════════════════════════════════════════════════
//  BREADCRUMB
// ══════════════════════════════════════════════════
function renderBreadcrumb() {
  let html = `<span class="bc-item" onclick="showView('builders')">🏗 All Builders</span>`;
  if (state.selectedBuilderId) {
    const b = DB.builders.find(x=>x.id===state.selectedBuilderId);
    html += `<span class="bc-sep">›</span><span class="bc-item" onclick="drillBuilder('${b.id}')">${b.name}</span>`;
  }
  if (state.selectedDivId) {
    const d = DB.divisions.find(x=>x.id===state.selectedDivId);
    html += `<span class="bc-sep">›</span><span class="bc-item" onclick="drillDivision('${d.id}')">${d.name}</span>`;
  }
  if (state.selectedCommId) {
    const c = DB.communities.find(x=>x.id===state.selectedCommId);
    html += `<span class="bc-sep">›</span><span class="bc-item">${c.name}</span>`;
  }

}

// ══════════════════════════════════════════════════
//  SIDEBAR TREE
// ══════════════════════════════════════════════════
function renderTree() {
  let html = '';
  DB.builders.forEach(b => {
    const activeB = state.selectedBuilderId === b.id ? 'active' : '';
    html += `<div class="tree-item l0 ${activeB}" onclick="drillBuilder('${b.id}')">
      <div class="tree-dot"></div><span>${b.name}</span>
      <span class="tree-toggle">▾</span>
    </div>`;
    if (state.selectedBuilderId === b.id) {
      DB.divisions.filter(d=>d.builderId===b.id).forEach(d => {
        const activeD = state.selectedDivId === d.id ? 'active' : '';
        html += `<div class="tree-item l1 ${activeD}" onclick="drillDivision('${d.id}')">
          <div class="tree-dot"></div><span>${d.name}</span>
          <span class="tree-toggle">▾</span>
        </div>`;
        if (state.selectedDivId === d.id) {
          DB.communities.filter(c=>c.divId===d.id).forEach(c => {
            const activeC = state.selectedCommId === c.id ? 'active' : '';
            html += `<div class="tree-item l2 ${activeC}" onclick="drillCommunity('${c.id}')">
              <div class="tree-dot"></div><span>${c.name}</span>
              <span class="tree-toggle">▾</span>
            </div>`;
            if (state.selectedCommId === c.id) {
              DB.lots.filter(l=>l.commId===c.id).forEach(l => {
                html += `<div class="tree-item l3" onclick="showLotDetail('${l.id}')">
                  <div class="tree-dot"></div><span>Lot ${l.lotNum}</span>
                </div>`;
              });
            }
          });
        }
      });
    }
  });
  document.getElementById('tree').innerHTML = html;
}

// ══════════════════════════════════════════════════
//  NAVIGATION DRILLS
// ══════════════════════════════════════════════════
function showView(view) {
  state.view = view;
  state.searchQuery = '';
  // Set nav pills active
  document.querySelectorAll('.nav-pill').forEach((p,i)=>{
    p.classList.toggle('active', ['builders','divisions','communities','lots'][i] === view);
  });
  if (view==='builders') { state.selectedBuilderId=null; state.selectedDivId=null; state.selectedCommId=null; }
  if (view==='divisions') { state.selectedDivId=null; state.selectedCommId=null; }
  if (view==='communities') { state.selectedCommId=null; }
  render();
}

function drillBuilder(id) {
  state.selectedBuilderId = id;
  state.selectedDivId = null;
  state.selectedCommId = null;
  state.view = 'divisions';
  setNavActive('divisions');
  render();
}

function drillDivision(id) {
  const d = DB.divisions.find(x=>x.id===id);
  state.selectedBuilderId = d.builderId;
  state.selectedDivId = id;
  state.selectedCommId = null;
  state.view = 'communities';
  setNavActive('communities');
  render();
}

function drillCommunity(id) {
  const c = DB.communities.find(x=>x.id===id);
  const d = DB.divisions.find(x=>x.id===c.divId);
  state.selectedBuilderId = d.builderId;
  state.selectedDivId = c.divId;
  state.selectedCommId = id;
  state.view = 'lots';
  setNavActive('lots');
  render();
}

function setNavActive(view) {
  document.querySelectorAll('.nav-pill').forEach((p,i)=>{
    p.classList.toggle('active', ['builders','divisions','communities','lots'][i] === view);
  });
}

// ══════════════════════════════════════════════════
//  MASTER RENDER
// ══════════════════════════════════════════════════
function render() {
  renderBreadcrumb();
  renderTree();
  closeDetail();
  const v = state.view;
  if (v==='builders')    renderBuilders();
  if (v==='divisions')   renderDivisions();
  if (v==='communities') renderCommunities();
  if (v==='lots')        renderLots();
}

            <div class="card-field"><label>Takeoff</label><span>${l.takeoff ? '✅ Complete' : '⏳ Pending'}</span></div>
            <div class="card-field"><label>WO Created</label><span>${l.woCreated ? '✅ Yes' : '—'}</span></div>
          </div>
          <div class="card-footer">
            <button class="btn btn-lot btn-sm" onclick="showLotDetail('${l.id}')">🔍 Open Lot</button>
            <button class="btn btn-outline btn-sm" onclick="editLot('${l.id}')">✏ Edit</button>
            <button class="btn btn-outline btn-sm" onclick="changeLotStatus('${l.id}')">↕ Status</button>
          </div>
        </div>`;

  document.getElementById('main-content').innerHTML = html;
}

// ══════════════════════════════════════════════════
//  STATUS CHANGE
// ══════════════════════════════════════════════════
function changeLotStatus(id) {
  const l = DB.lots.find(x=>x.id===id);
  openModal(`Change Status — Lot ${l.lotNum}`, `
    <p style="font-size:.85rem;color:var(--gray);margin-bottom:1rem">Current: ${statusPill(l.status)}</p>
    <div class="form-group"><label>New Status</label>
      <select id="f-status">
        ${['Takeoff','Scheduled','In Progress','Complete','On Hold'].map(s=>`<option${s===l.status?' selected':''}>${s}</option>`).join('')}
      </select>
    </div>`, () => {
    const prev = l.status;
    l.status = document.getElementById('f-status').value;
    l.bucket = l.status;
    if (l.status==='Complete') l.woCreated = true;
    closeModal(); render();
    toast(`↕ Lot ${l.lotNum}: ${prev} → ${l.status}`,'#2d6a4f');
  });
}

// ══════════════════════════════════════════════════
//  DELETE
// ══════════════════════════════════════════════════
function confirmDelete(type, id) {
  openModal('Confirm Delete', `<p style="color:#721c24">Are you sure you want to delete this ${type}? This cannot be undone.</p>`, () => {
    if (type==='lot') {
      const i = DB.lots.findIndex(x=>x.id===id);
      if (i>-1) DB.lots.splice(i,1);
    }
    closeModal(); closeDetail(); render();
    toast(`🗑 ${type} deleted`,'#dc3545');
  });
  document.getElementById('modal-save').textContent = 'Delete';
  document.getElementById('modal-save').className = 'btn btn-danger';
}

// ══════════════════════════════════════════════════
//  SEARCH / FILTER
// ══════════════════════════════════════════════════
function filterSearch(q) {
  state.searchQuery = q;
  render();
  // Keep focus in search box
  setTimeout(() => {
    const inp = document.getElementById('search-input');
    if (inp) { inp.focus(); inp.setSelectionRange(q.length, q.length); }
  }, 50);
}

function filterByStatus(s) {
  state.searchQuery = s;
  render();
}

function clearSearch() {
  state.searchQuery = '';
  render();
}

function exportData() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'loving-hierarchy.json';
  a.click();
  toast('⬇ Exported hierarchy data');
}
